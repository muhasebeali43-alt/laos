<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Analiz - Laos Özel Tasarım</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .laos-gradient-text {
            background: linear-gradient(to right, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .animate-up {
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#F1F5F9]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- FİREBASE YAPILANDIRMASI ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { 
                apiKey: "API_KEY_BURAYA",
                authDomain: "PROJE_ADINIZ.firebaseapp.com",
                projectId: "PROJE_ADINIZ",
                storageBucket: "PROJE_ADINIZ.appspot.com",
                messagingSenderId: "SENDER_ID",
                appId: "APP_ID"
            };

        // Firebase Başlatma Kontrolü
        let db, auth;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (e) {
            console.error("Firebase başlatılamadı:", e);
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cafe-pro-v1';

        // --- YARDIMCI ARAÇLAR ---
        const toNum = (v) => {
            if (v === null || v === undefined || v === "") return 0;
            if (typeof v === 'number') return Math.floor(v);
            const clean = String(v).replace(/\./g, '').replace(/,/g, '');
            return parseInt(clean, 10) || 0;
        };

        const formatNumber = (val) => new Intl.NumberFormat('tr-TR').format(toNum(val));
        const formatCurrency = (val) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 0 }).format(toNum(val));

        const dbToDisplay = (isoDate) => {
            if (!isoDate) return "";
            const parts = isoDate.split("-");
            return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : isoDate;
        };

        const displayToDb = (displayDate) => {
            if (!displayDate) return null;
            const parts = displayDate.split(".");
            if (parts.length === 3 && parts[2].length === 4) {
                return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
            return null;
        };

        const ALL_PAYMENT_METHODS = [
            { id: 'nakit', label: 'Nakit' },
            { id: 'havale', label: 'Havale' },
            { id: 'cek', label: 'Çek' },
            { id: 'kart', label: 'Kart' }
        ];

        // --- BİLEŞENLER ---

        const MoneyInput = ({ value, onChange, className = "", placeholder = "0" }) => {
            const [localValue, setLocalValue] = useState(formatNumber(value));
            const isFocused = useRef(false);

            useEffect(() => {
                if (!isFocused.current) setLocalValue(formatNumber(value));
            }, [value]);

            const handleChange = (e) => {
                const raw = e.target.value.replace(/[^0-9]/g, '');
                const numValue = raw ? parseInt(raw, 10) : 0;
                setLocalValue(formatNumber(numValue));
            };

            const handleBlur = () => {
                isFocused.current = false;
                onChange(toNum(localValue));
            };

            return (
                <input 
                    type="text" 
                    inputMode="numeric" 
                    value={localValue === "0" && placeholder !== "0" ? "" : localValue} 
                    onChange={handleChange} 
                    onFocus={() => { isFocused.current = true; }}
                    onBlur={handleBlur}
                    placeholder={placeholder} 
                    className={`focus:ring-2 focus:ring-amber-500 outline-none ${className}`} 
                />
            );
        };

        const DateInput = ({ value, onChange, className = "" }) => {
            const [localVal, setLocalVal] = useState(dbToDisplay(value));
            useEffect(() => { setLocalVal(dbToDisplay(value)); }, [value]);

            const handleChange = (e) => {
                let v = e.target.value.replace(/[^0-9]/g, '').substring(0, 8);
                let formatted = v;
                if (v.length > 2) {
                    const day = v.substring(0, 2);
                    if (parseInt(day) > 31) return;
                    formatted = day + '.' + v.substring(2);
                }
                if (v.length > 4) {
                    const month = v.substring(2, 4);
                    if (parseInt(month) > 12) return;
                    formatted = v.substring(0, 2) + '.' + month + '.' + v.substring(4);
                }
                setLocalVal(formatted);
                if (v.length === 8) {
                    const dbVal = displayToDb(formatted);
                    if (dbVal) onChange(dbVal);
                }
            };

            return (
                <div className="flex items-center gap-1 relative">
                    <input 
                        type="date" 
                        value={value || ""} 
                        onChange={(e) => e.target.value && onChange(e.target.value)} 
                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" 
                    />
                    <span className="text-amber-500 text-[10px]">📅</span>
                    <input 
                        type="text" 
                        value={localVal} 
                        onChange={handleChange} 
                        maxLength={10} 
                        placeholder="GG.AA.YYYY" 
                        className={`bg-transparent border-none focus:ring-0 p-0 text-[10px] font-bold w-20 ${className}`} 
                    />
                </div>
            );
        };

        const MethodSelector = ({ value, onChange, className = "" }) => (
            <select 
                value={value || 'nakit'} 
                onChange={(e) => onChange(e.target.value)} 
                className={`bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[9px] font-bold uppercase text-slate-700 focus:ring-1 focus:ring-amber-500 cursor-pointer outline-none ${className}`}
            >
                {ALL_PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
            </select>
        );

        // --- ANA UYGULAMA ---

        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [recipeSubTab, setRecipeSubTab] = useState('inventory');
            const [loading, setLoading] = useState(true);
            const [reportRange, setReportRange] = useState('monthly');
            const [customStartDate, setCustomStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [customEndDate, setCustomEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedPersonnelId, setSelectedPersonnelId] = useState(null);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [showDeleteModal, setShowDeleteModal] = useState({ show: false, col: '', id: '' });

            const [settings, setSettings] = useState({ initialBalance: 0, defaultCommission: 3.5, defaultValor: 30 });
            const [dailyLogs, setDailyLogs] = useState([]);
            const [scheduledPayments, setScheduledPayments] = useState([]);
            const [personnel, setPersonnel] = useState([]);
            const [personnelPayments, setPersonnelPayments] = useState([]);
            const [inventory, setInventory] = useState([]);
            const [products, setProducts] = useState([]);

            // Firestore Referansları
            const pRef = (col) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(col);
            const sDoc = () => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('app_settings');

            // Kimlik Doğrulama
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (e) { console.error("Auth Error", e); }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            // Veri Dinleme
            useEffect(() => {
                if (!user || !db) return;

                const unsubSet = sDoc().onSnapshot((d) => d.exists && setSettings(d.data()));
                const unsubLogs = pRef('dailyLogs').onSnapshot((s) => setDailyLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubSched = pRef('scheduledPayments').onSnapshot((s) => setScheduledPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubPers = pRef('personnel').onSnapshot((s) => setPersonnel(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubPersPay = pRef('personnelPayments').onSnapshot((s) => setPersonnelPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubInv = pRef('inventory').onSnapshot((s) => setInventory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubProd = pRef('products').onSnapshot((s) => setProducts(s.docs.map(d => ({id: d.id, ...d.data()}))));

                setLoading(false);
                return () => { unsubSet(); unsubLogs(); unsubSched(); unsubPers(); unsubPersPay(); unsubInv(); unsubProd(); };
            }, [user]);

            // İşlem Fonksiyonları
            const updateLog = (id, data) => pRef('dailyLogs').doc(id).update(data);
            const addLog = () => pRef('dailyLogs').add({ date: new Date().toISOString().split('T')[0], cash: 0, card: 0, dailyLoan: 0 });
            
            const addPersonnel = () => pRef('personnel').add({ name: 'Yeni Personel', fixedSalary: 50000 });
            const updatePersonnel = (id, data) => pRef('personnel').doc(id).update(data);
            const addPersonnelPayment = (pId) => pRef('personnelPayments').add({ personnelId: pId, amount: 0, method: 'nakit', date: new Date().toISOString().split('T')[0] });
            
            const addScheduledPayment = () => pRef('scheduledPayments').add({ label: 'Yeni Gider', amount: 0, status: 'pending', method: 'nakit', date: new Date().toISOString().split('T')[0] });
            const updateScheduledPayment = (id, data) => pRef('scheduledPayments').doc(id).update(data);

            const saveSettings = (newVal) => sDoc().set(newVal, { merge: true });

            // Hesaplamalar
            const posSettlementsList = useMemo(() => {
                const today = new Date(); today.setHours(0,0,0,0);
                const valor = toNum(settings.defaultValor || 30);
                return dailyLogs.filter(log => toNum(log.card) > 0).map(log => {
                    const dateObj = new Date(log.date);
                    if (isNaN(dateObj)) return null;
                    const settleDate = new Date(dateObj);
                    settleDate.setDate(dateObj.getDate() + valor);
                    const netValue = toNum(log.card) - (toNum(log.card) * toNum(settings.defaultCommission) / 100);
                    return { id: log.id, date: log.date, settle: settleDate, net: netValue, settled: settleDate <= today };
                }).filter(x => x !== null).sort((a,b) => a.settle - b.settle);
            }, [dailyLogs, settings]);

            const stats = useMemo(() => {
                const logsTotals = dailyLogs.reduce((acc, log) => {
                    const cash = toNum(log.cash);
                    const card = toNum(log.card);
                    const loan = toNum(log.dailyLoan);
                    const comm = (card * toNum(settings.defaultCommission || 3.5)) / 100;
                    return { loan: acc.loan + loan, cash: acc.cash + cash, card: acc.card + card, comm: acc.comm + comm };
                }, { loan: 0, cash: 0, card: 0, comm: 0 });
                const billsPaid = scheduledPayments.filter(p => p.status === 'paid').reduce((s, p) => s + toNum(p.amount), 0);
                const staffPaid = personnelPayments.reduce((s, p) => s + toNum(p.amount), 0);
                const netCash = toNum(settings.initialBalance) + logsTotals.cash + logsTotals.card + logsTotals.loan - (staffPaid + billsPaid + logsTotals.comm);
                const upcoming = scheduledPayments.filter(p => p.status !== 'paid').sort((a,b) => new Date(a.date)-new Date(b.date)).slice(0, 4);
                return { ...logsTotals, billsPaid, staffPaid, netCash, posPending: logsTotals.card - logsTotals.comm, upcoming };
            }, [dailyLogs, scheduledPayments, personnelPayments, settings]);

            const reportAnalysis = useMemo(() => {
                const start = new Date(customStartDate); const end = new Date(customEndDate);
                start.setHours(0,0,0,0); end.setHours(23,59,59,999);
                const filterFn = (dStr) => {
                    if (!dStr) return false; const d = new Date(dStr);
                    if (reportRange === 'daily') return d.toDateString() === new Date().toDateString();
                    if (reportRange === 'monthly') return d.getMonth() === new Date().getMonth() && d.getFullYear() === new Date().getFullYear();
                    return d >= start && d <= end;
                };
                const fLogs = dailyLogs.filter(l => filterFn(l.date));
                const fPersPays = personnelPayments.filter(p => filterFn(p.date));
                const fSchedPays = scheduledPayments.filter(p => p.status === 'paid' && filterFn(p.date));
                const inSum = fLogs.reduce((a, l) => ({ cash: a.cash + toNum(l.cash), card: a.card + toNum(l.card), loan: a.loan + toNum(l.dailyLoan) }), {cash:0, card:0, loan:0});
                const totalIn = inSum.cash + inSum.card + inSum.loan;
                const staffEx = fPersPays.reduce((s, p) => s + toNum(p.amount), 0);
                const posEx = fLogs.reduce((s, l) => s + (toNum(l.card) * toNum(settings.defaultCommission) / 100), 0);
                const malEx = fSchedPays.filter(p => (p.label||"").toLowerCase().includes('mal')).reduce((s, p) => s + toNum(p.amount), 0);
                const totalEx = staffEx + posEx + fSchedPays.reduce((s, p) => s + toNum(p.amount), 0);
                return { totalIn, totalEx, profit: totalIn - totalEx, margin: totalIn > 0 ? ((totalIn - totalEx) / totalIn) * 100 : 0, staffEx, posEx, malEx };
            }, [dailyLogs, personnelPayments, scheduledPayments, reportRange, customStartDate, customEndDate, settings]);

            const calculateProductCost = (prod) => {
                if (!prod.ingredients || !Array.isArray(prod.ingredients)) return 0;
                return prod.ingredients.reduce((total, ing) => {
                    const item = inventory.find(i => i.id === ing.id);
                    if (!item) return total;
                    const factor = (item.unit === 'kg' || item.unit === 'L') ? 1000 : 1;
                    return total + (toNum(item.price) / factor) * toNum(ing.amount);
                }, 0);
            };

            const confirmDelete = async () => {
                await pRef(showDeleteModal.col).doc(showDeleteModal.id).delete();
                setShowDeleteModal({ show: false, col: '', id: '' });
            };

            if (firebaseConfig.apiKey === "API_KEY_BURAYA") {
                return <div className="h-screen bg-slate-900 text-white flex items-center justify-center p-10 text-center flex-col gap-4">
                    <div className="text-4xl">⚠️</div>
                    <h1 className="font-black text-xl uppercase tracking-widest text-amber-500">FIREBASE ANAHTARLARI EKSİK</h1>
                    <p className="text-slate-400 text-sm max-w-md">GitHub'daki index.html dosyasının en başındaki <b>firebaseConfig</b> bölümünü kendi Firebase projenizden aldığınız bilgilerle doldurmanız gerekiyor.</p>
                </div>;
            }

            if (loading) return <div className="h-screen bg-slate-950 flex items-center justify-center text-amber-500 font-black animate-pulse text-[10px] uppercase tracking-widest italic">Laos Connect...</div>;

            return (
                <div className="min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 bg-[#F1F5F9] font-sans text-slate-900 overflow-x-hidden">
                    
                    {/* SİLME MODALI */}
                    {showDeleteModal.show && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm z-[2000]">
                            <div className="bg-white rounded-[2rem] p-8 max-w-xs w-full shadow-2xl animate-up">
                                <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">🗑️</div>
                                <h3 className="text-xs font-black text-slate-900 mb-6 uppercase text-center italic">Bu kayıt silinsin mi?</h3>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowDeleteModal({show:false, col:'', id:''})} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-500 font-black text-[9px] uppercase italic">VAZGEÇ</button>
                                    <button onClick={confirmDelete} className="flex-1 py-3 rounded-xl bg-red-500 text-white font-black text-[9px] uppercase italic shadow-lg shadow-red-200">SİL</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* NAVİGASYON */}
                    <nav className="fixed bottom-0 left-0 right-0 md:relative md:w-20 lg:w-64 bg-slate-950 text-white p-2 md:p-4 flex md:flex-col justify-around md:justify-start gap-1 z-50 shadow-2xl">
                        <div className="hidden md:flex items-center gap-3 mb-10 px-2">
                            <div className="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center text-slate-950 font-black italic shadow-lg shadow-amber-500/20 text-xs">L</div>
                            <h2 className="hidden lg:block font-black text-sm italic uppercase tracking-tighter text-amber-500">Kafe Analiz</h2>
                        </div>
                        {[
                            {id:'dashboard', icon:'📊', l:'Özet'},
                            {id:'daily', icon:'📅', l:'Günlük'},
                            {id:'pos', icon:'💳', l:'POS'},
                            {id:'personnel', icon:'👥', l:'Ekip'},
                            {id:'payments', icon:'🧾', l:'Borçlar'},
                            {id:'recipes', icon:'📋', l:'Reçete'},
                            {id:'reports', icon:'📈', l:'Analiz'}
                        ].map(t => (
                            <button key={t.id} onClick={() => {setActiveTab(t.id); setSelectedPersonnelId(null); setSelectedProductId(null);}} 
                                className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2.5 rounded-xl transition-all flex-1 md:flex-none ${activeTab === t.id ? 'bg-amber-500 text-slate-950 font-black shadow-lg shadow-amber-500/20' : 'text-slate-500 hover:text-slate-200'}`}>
                                <span className="text-base">{t.icon}</span> 
                                <span className="text-[7px] lg:text-[10px] font-black uppercase tracking-tight text-center lg:text-left italic">{t.l}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-3 md:p-10 lg:p-14 overflow-y-auto max-w-full">
                        {/* TAB İÇERİKLERİ */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-up">
                                <header className="flex items-center gap-2"><div className="w-1.5 h-6 bg-amber-500 rounded-full"></div><h1 className="text-xl md:text-3xl font-black text-slate-900 uppercase italic">İşletme Durumu</h1></header>
                                <div className="bg-slate-950 rounded-[2.5rem] p-6 md:p-12 text-white shadow-2xl border-b-[8px] border-amber-500 relative overflow-hidden">
                                    <div className="relative z-10">
                                        <p className="text-[9px] md:text-[11px] font-bold text-slate-500 uppercase mb-2 tracking-[0.3em] italic">💰 Mevcut Nakit Gücü</p>
                                        <h2 className="text-3xl md:text-6xl font-black text-amber-500 tracking-tighter mb-10 italic break-words">{formatCurrency(stats.netCash)}</h2>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6 border-t border-white/5 pt-8 text-center md:text-left">
                                            <div><p className="text-[8px] text-slate-500 font-black uppercase mb-1 italic">Toplam Ciro</p><p className="font-black text-xs md:text-xl italic">{formatCurrency(stats.cash + stats.card)}</p></div>
                                            <div><p className="text-[8px] text-slate-500 font-black uppercase mb-1 italic">Gider Toplam</p><p className="font-black text-xs md:text-xl text-red-400 italic">{formatCurrency(stats.staffPaid + stats.billsPaid + stats.comm)}</p></div>
                                            <div><p className="text-[8px] text-slate-500 font-black uppercase mb-1 italic">Borç/Kredi</p><p className="font-black text-xs md:text-xl text-blue-400 italic">{formatCurrency(stats.loan)}</p></div>
                                            <div><p className="text-[8px] text-slate-500 font-black uppercase mb-1 italic">Ana Kasa</p><p className="font-black text-xs md:text-xl text-slate-400 italic">{formatCurrency(settings.initialBalance)}</p></div>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-slate-950 p-6 rounded-3xl shadow-xl border border-slate-800">
                                    <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1 italic">Sistem Başlangıç Bakiyesi</p>
                                    <MoneyInput value={settings.initialBalance} onChange={(v) => saveSettings({ ...settings, initialBalance: v })} className="text-2xl md:text-4xl font-black bg-transparent w-full focus:ring-0 text-amber-500 italic tracking-tighter" />
                                </div>
                            </div>
                        )}

                        {activeTab === 'daily' && (
                            <div className="max-w-4xl mx-auto space-y-4 animate-up">
                                <div className="bg-slate-950 p-6 rounded-[2.5rem] flex justify-between items-center mb-10 shadow-2xl border-b-8 border-amber-500">
                                    <h2 className="text-white font-black text-lg md:text-3xl uppercase italic tracking-tighter laos-gradient-text">GÜNLÜK GİRİŞLER</h2>
                                    <button onClick={addLog} className="bg-amber-500 text-slate-950 px-6 py-3 rounded-2xl font-black text-[10px] uppercase italic shadow-lg">YENİ GÜN</button>
                                </div>
                                {dailyLogs.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(log => (
                                    <div key={log.id} className="bg-white rounded-[2.5rem] p-6 md:p-10 border border-slate-100 shadow-sm space-y-8 mb-4">
                                        <div className="flex justify-between items-center">
                                            <div className="bg-slate-950 px-4 py-2 rounded-xl text-amber-500"><DateInput value={log.date} onChange={(d) => updateLog(log.id, { date: d })} /></div>
                                            <button onClick={() => setShowDeleteModal({show:true, col:'dailyLogs', id:log.id})} className="text-red-500 p-2.5 bg-red-50 rounded-xl font-black text-[10px] uppercase italic">SİL</button>
                                        </div>
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="bg-slate-50 p-5 rounded-[2rem] border shadow-inner text-center">
                                                <p className="text-[8px] font-black text-slate-400 mb-2 uppercase italic tracking-widest">NAKİT SATIŞ</p>
                                                <MoneyInput value={log.cash} onChange={(v) => updateLog(log.id, { cash: v })} className="w-full bg-transparent font-black text-sm md:text-3xl text-center focus:ring-0 text-slate-800 italic" />
                                            </div>
                                            <div className="bg-blue-50/50 p-5 rounded-[2rem] border shadow-inner text-center">
                                                <p className="text-[8px] font-black text-blue-500 mb-2 uppercase italic tracking-widest">POS SATIŞ</p>
                                                <MoneyInput value={log.card} onChange={(v) => updateLog(log.id, { card: v })} className="w-full bg-transparent font-black text-sm md:text-3xl text-center focus:ring-0 text-blue-700 italic" />
                                            </div>
                                        </div>
                                        <div className="bg-slate-950 p-6 rounded-[2rem] border border-slate-800 text-center shadow-2xl">
                                            <p className="text-[8px] font-black text-amber-500 mb-2 uppercase italic tracking-widest">DIŞ KAYNAK / KREDİ GİRİŞİ</p>
                                            <MoneyInput value={log.dailyLoan || 0} onChange={(v) => updateLog(log.id, { dailyLoan: v })} className="w-full bg-transparent p-0 border-none font-black text-xl md:text-5xl text-white italic text-center focus:ring-0 tracking-tighter" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'pos' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-up">
                                <header className="bg-slate-950 p-6 rounded-[2.5rem] border-b-8 border-amber-500 flex flex-col md:flex-row justify-between items-center gap-6 shadow-2xl">
                                    <h2 className="text-white font-black text-lg md:text-3xl uppercase italic tracking-tighter laos-gradient-text">BANKA & POS</h2>
                                    <div className="bg-white/5 border border-white/10 px-8 py-4 rounded-3xl text-center shadow-inner">
                                        <p className="text-[8px] font-black text-slate-500 uppercase italic mb-1 tracking-widest">TAHMİNİ NET ALACAK</p>
                                        <p className="text-xl md:text-3xl font-black text-amber-500 tracking-tighter italic">{formatCurrency(stats.posPending)}</p>
                                    </div>
                                </header>
                                <div className="grid grid-cols-2 gap-6">
                                    <div className="bg-white p-8 rounded-[2rem] border-l-[10px] border-amber-500 shadow-sm text-center">
                                        <p className="text-[9px] font-black text-slate-400 uppercase italic mb-2">KOMİSYON (%)</p>
                                        <input type="number" step="0.1" value={settings.defaultCommission} onChange={(e) => saveSettings({ ...settings, defaultCommission: Number(e.target.value) })} className="text-lg md:text-4xl font-black bg-transparent w-full focus:ring-0 text-center text-slate-800 italic outline-none" />
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] border-l-[10px] border-slate-900 shadow-sm text-center">
                                        <p className="text-[9px] font-black text-slate-400 uppercase italic mb-2">VALÖR GÜNÜ</p>
                                        <input type="number" value={settings.defaultValor} onChange={(e) => saveSettings({ ...settings, defaultValor: Number(e.target.value) })} className="text-lg md:text-4xl font-black bg-transparent w-full focus:ring-0 text-center text-slate-800 italic outline-none" />
                                    </div>
                                </div>
                                <div className="space-y-4 mt-8">
                                    {(posSettlementsList || []).map(p => (
                                        <div key={p.id} className={`bg-white p-6 rounded-3xl flex justify-between items-center transition-all ${p.settled ? 'opacity-30' : 'shadow-md'}`}>
                                            <div className="flex items-center gap-6">
                                                <div className="bg-slate-950 p-4 rounded-2xl text-amber-500 font-black">🏦</div>
                                                <div>
                                                    <p className="text-[8px] font-black text-slate-400 uppercase italic">İŞLEM: {dbToDisplay(p.date)}</p>
                                                    <p className="text-xs md:text-sm font-black text-slate-800 uppercase italic">TAHSİLAT: {p.settle.toLocaleDateString('tr-TR')}</p>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-sm md:text-2xl font-black text-slate-950 italic tracking-tighter">{formatCurrency(p.net)}</p>
                                                {p.settled && <span className="text-[7px] font-black text-green-600 uppercase italic bg-green-50 px-2 py-1 rounded-lg">TAMAMLANDI</span>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'personnel' && (
                            <div className="max-w-6xl mx-auto space-y-6 animate-up">
                                {!selectedPersonnelId ? (
                                    <>
                                        <div className="bg-slate-950 p-6 rounded-[2.5rem] border-b-8 border-amber-500 flex justify-between items-center shadow-2xl">
                                            <h2 className="text-white font-black text-lg md:text-3xl uppercase italic tracking-tighter laos-gradient-text">EKİP ÜYELERİ</h2>
                                            <button onClick={addPersonnel} className="bg-amber-500 text-slate-950 px-8 py-3 rounded-2xl font-black text-[10px] uppercase italic">EKLE</button>
                                        </div>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {personnel.map(p => {
                                                const paid = personnelPayments.filter(pay => pay.personnelId === p.id).reduce((s, pay) => s + toNum(pay.amount), 0);
                                                const bal = toNum(p.fixedSalary) - paid;
                                                return (
                                                    <div key={p.id} onClick={() => setSelectedPersonnelId(p.id)} className="bg-white p-8 rounded-[2.5rem] flex flex-col justify-between cursor-pointer border hover:border-amber-400 shadow-sm min-h-[160px] relative group overflow-hidden">
                                                        <div className="flex justify-between items-start mb-6">
                                                            <div className="bg-slate-950 p-4 rounded-2xl text-amber-500 font-black">👤</div>
                                                            <button onClick={(e) => { e.stopPropagation(); setShowDeleteModal({show:true, col:'personnel', id:p.id}); }} className="text-red-400 p-2 bg-red-50 rounded-xl">SİL</button>
                                                        </div>
                                                        <div>
                                                            <p className="font-black text-sm md:text-xl uppercase text-slate-800 italic">{String(p.name || 'İsimsiz')}</p>
                                                            <p className={`text-[8px] font-black uppercase italic tracking-widest mt-2 ${bal > 0 ? 'text-red-500' : 'text-green-500'}`}>BORÇ KALAN: {formatCurrency(bal)}</p>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </>
                                ) : (
                                    <div className="space-y-6">
                                        <button onClick={() => setSelectedPersonnelId(null)} className="font-black text-[10px] uppercase text-slate-400 bg-white px-6 py-3 rounded-2xl border border-slate-100 flex items-center gap-3 hover:text-slate-900 italic shadow-sm tracking-[0.2em]">🔙 GERİ DÖN</button>
                                        {personnel.filter(p => p.id === selectedPersonnelId).map(p => {
                                            const myPays = personnelPayments.filter(pay => pay.personnelId === p.id).sort((a,b) => new Date(b.date) - new Date(a.date));
                                            const totalPaid = myPays.reduce((s, pay) => s + toNum(pay.amount), 0);
                                            const bal = toNum(p.fixedSalary) - totalPaid;
                                            return (
                                                <div key={p.id} className="space-y-8 animate-up">
                                                    <div className="bg-slate-950 p-10 md:p-14 rounded-[3rem] text-white shadow-2xl border-b-[10px] border-amber-500">
                                                        <input value={p.name} onChange={(e) => updatePersonnel(p.id, { name: e.target.value })} className="text-2xl md:text-6xl font-black bg-transparent w-full uppercase text-amber-500 italic mb-12 focus:ring-0 border-none p-0 tracking-tighter outline-none" />
                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                                            <div className="bg-white/5 p-6 rounded-[2rem] border border-white/5 shadow-inner">
                                                                <p className="text-[9px] font-black text-slate-500 uppercase mb-3 italic tracking-widest">SABİT MAAŞ</p>
                                                                <div className="flex items-center gap-3 font-black text-2xl md:text-4xl text-amber-500 italic"><MoneyInput value={p.fixedSalary} onChange={(v) => updatePersonnel(p.id, { fixedSalary: v })} className="bg-transparent w-full border-none focus:ring-0 p-0" /></div>
                                                            </div>
                                                            <div className="bg-white/5 p-6 rounded-[2rem] border border-white/5 shadow-inner text-center">
                                                                <p className="text-[9px] font-black text-slate-500 uppercase mb-3 italic tracking-widest">ÖDENECEK KALAN</p>
                                                                <p className={`text-2xl md:text-4xl font-black italic tracking-tighter ${bal > 0 ? 'text-red-400' : 'text-green-400'}`}>{formatCurrency(bal)}</p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="bg-white rounded-[2.5rem] p-8 md:p-12 shadow-sm space-y-8">
                                                        <div className="flex flex-col sm:flex-row justify-between items-center border-b pb-6 gap-4">
                                                            <h3 className="text-xs md:text-lg font-black uppercase italic tracking-[0.2em] text-slate-800">MAAŞ & AVANS KAYITLARI</h3>
                                                            <button onClick={() => addPersonnelPayment(p.id)} className="bg-slate-950 text-white px-8 py-4 rounded-2xl text-[10px] font-black uppercase italic shadow-2xl">YENİ İŞLEM</button>
                                                        </div>
                                                        {myPays.map(pay => (
                                                            <div key={pay.id} className="flex flex-col sm:flex-row items-center justify-between gap-6 p-6 bg-slate-50 rounded-[2rem] border border-slate-100 hover:border-amber-200">
                                                                <div className="flex items-center gap-6 w-full sm:w-auto">
                                                                    <div className="bg-white p-3 rounded-xl shadow-sm border"><DateInput value={pay.date} onChange={(d) => pRef('personnelPayments').doc(pay.id).update({ date: d })} /></div>
                                                                    <MethodSelector value={pay.method} onChange={(m) => pRef('personnelPayments').doc(pay.id).update({ method: m })} className="w-28 sm:w-36 shadow-sm" />
                                                                </div>
                                                                <div className="flex items-center justify-between w-full sm:w-auto gap-6">
                                                                    <div className="flex items-center gap-2 font-black italic"><span className="text-slate-300 text-xs">₺</span><MoneyInput value={pay.amount} onChange={(v) => pRef('personnelPayments').doc(pay.id).update({ amount: v })} className="bg-transparent w-28 md:w-48 font-black text-sm md:text-2xl text-right border-none focus:ring-0 p-0" /></div>
                                                                    <button onClick={() => setShowDeleteModal({show:true, col:'personnelPayments', id:pay.id})} className="text-red-400 p-3 bg-white rounded-xl shadow-sm hover:bg-red-500 hover:text-white transition-all">SİL</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'payments' && (
                            <div className="max-w-2xl mx-auto space-y-6 animate-up">
                                <div className="bg-slate-950 p-6 rounded-[2.5rem] border-b-8 border-amber-500 flex justify-between items-center shadow-2xl">
                                    <h2 className="text-white font-black text-lg md:text-3xl uppercase italic tracking-tighter laos-gradient-text">ÖDEME PLANI</h2>
                                    <button onClick={addScheduledPayment} className="bg-amber-500 text-slate-950 px-8 py-3 rounded-2xl font-black text-[10px] uppercase italic">EKLE</button>
                                </div>
                                {scheduledPayments.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(p => (
                                    <div key={p.id} className={`bg-white rounded-[2.5rem] p-8 flex flex-col md:flex-row justify-between items-center gap-6 transition-all ${p.status === 'paid' ? 'opacity-30 grayscale' : 'shadow-sm border-l-[10px] border-red-500 hover:shadow-xl'}`}>
                                        <div className="flex-1 w-full space-y-4">
                                            <div className="flex flex-wrap items-center gap-4">
                                                <div className="bg-slate-50 p-2 rounded-xl border shadow-inner"><DateInput value={p.date} onChange={(d) => updateScheduledPayment(p.id, { date: d })} className="text-red-500 font-black" /></div>
                                                <MethodSelector value={p.method} onChange={(m) => updateScheduledPayment(p.id, { method: m })} className="w-32 md:w-40" />
                                            </div>
                                            <input value={p.label} onChange={(e) => updateScheduledPayment(p.id, { label: e.target.value })} className="font-black text-sm md:text-2xl w-full uppercase border-none p-0 focus:ring-0 italic text-slate-800 outline-none" placeholder="Gider Adı" />
                                            <div className="flex items-center gap-2 font-black text-lg md:text-4xl text-slate-950 italic tracking-tighter"><span className="text-xs md:text-xl text-slate-300 font-black">₺</span><MoneyInput value={p.amount} onChange={(v) => updateScheduledPayment(p.id, { amount: v })} className="bg-transparent w-full border-none p-0 focus:ring-0" /></div>
                                        </div>
                                        <div className="flex gap-4 w-full md:w-auto pt-6 md:pt-0">
                                            <button onClick={() => updateScheduledPayment(p.id, { status: p.status === 'paid' ? 'pending' : 'paid' })} className={`flex-1 px-8 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest ${p.status === 'paid' ? 'bg-green-500 text-white' : 'bg-slate-950 text-white shadow-xl active:scale-95 transition-all'}`}>{p.status === 'paid' ? 'ÖDENDİ' : 'ÖDEMEYİ YAP'}</button>
                                            <button onClick={() => setShowDeleteModal({show:true, col:'scheduledPayments', id:p.id})} className="text-red-400 p-3 bg-red-50 rounded-2xl hover:bg-red-500 hover:text-white transition-all shadow-sm">SİL</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'reports' && (
                            <div className="max-w-6xl mx-auto space-y-10 animate-up pb-24">
                                <header className="flex flex-col md:flex-row justify-between items-center gap-6">
                                    <div className="flex items-center gap-4"><div className="w-2 h-10 bg-amber-500 rounded-full shadow-lg shadow-amber-500/30"></div><h2 className="text-2xl md:text-4xl font-black text-slate-900 tracking-tighter uppercase italic">STRATEJİK ANALİZ</h2></div>
                                    <div className="flex bg-slate-950 p-2 rounded-[2rem] border border-slate-800 shadow-2xl overflow-x-auto no-scrollbar max-w-full">
                                        {['daily', 'monthly', 'custom'].map(r => (
                                            <button key={r} onClick={() => setReportRange(r)} className={`px-8 py-3.5 md:px-12 md:py-4 rounded-full text-[9px] md:text-[11px] font-black uppercase tracking-[0.2em] transition-all italic whitespace-nowrap ${reportRange === r ? 'bg-amber-500 text-slate-950 shadow-xl scale-105' : 'text-slate-500 hover:text-slate-200'}`}>
                                                {r === 'daily' ? 'BUGÜN' : r === 'monthly' ? 'BU AY' : 'ÖZEL ARALIK'}
                                            </button>
                                        ))}
                                    </div>
                                </header>
                                {reportRange === 'custom' && (
                                    <div className="bg-white rounded-[3rem] p-8 md:p-12 flex gap-8 md:gap-16 items-center justify-center border-amber-100 shadow-sm animate-up">
                                        <div className="flex flex-col"><label className="text-[9px] font-black uppercase text-slate-400 mb-3 ml-2 italic tracking-widest">BAŞLANGIÇ</label><div className="bg-slate-50 p-4 rounded-2xl border shadow-inner"><DateInput value={customStartDate} onChange={setCustomStartDate} /></div></div>
                                        <div className="flex flex-col"><label className="text-[9px] font-black uppercase text-slate-400 mb-3 ml-2 italic tracking-widest">BİTİŞ</label><div className="bg-slate-50 p-4 rounded-2xl border shadow-inner"><DateInput value={customEndDate} onChange={setCustomEndDate} /></div></div>
                                    </div>
                                )}
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
                                    <div className="bg-white p-8 rounded-[2.5rem] border-l-[10px] border-emerald-500 shadow-sm flex flex-col justify-between group hover:shadow-2xl transition-all">
                                        <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 italic">TOPLAM HASILAT</p>
                                        <p className="text-sm md:text-3xl font-black text-slate-900 tracking-tighter italic break-words">{formatCurrency(reportAnalysis.totalIn)}</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2.5rem] border-l-[10px] border-red-500 shadow-sm flex flex-col justify-between group hover:shadow-2xl transition-all">
                                        <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 italic">TOPLAM GİDER</p>
                                        <p className="text-sm md:text-3xl font-black text-red-600 tracking-tighter italic break-words">{formatCurrency(reportAnalysis.totalEx)}</p>
                                    </div>
                                    <div className="bg-slate-950 p-8 rounded-[2.5rem] text-white shadow-2xl flex flex-col justify-center border-b-8 border-amber-500">
                                        <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3 italic">DÖNEMSEL NET KÂR</p>
                                        <p className={`text-sm md:text-3xl font-black tracking-tighter italic break-words ${reportAnalysis.profit >= 0 ? 'text-amber-500' : 'text-red-400'}`}>{formatCurrency(reportAnalysis.profit)}</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2.5rem] border-l-[10px] border-blue-500 shadow-sm flex flex-col justify-center">
                                        <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 italic">KÂR MARJI (%)</p>
                                        <p className="text-sm md:text-3xl font-black text-blue-600 tracking-tighter italic">%{reportAnalysis.margin.toFixed(1)}</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                    <div className="bg-white rounded-[3rem] p-10 md:p-14 shadow-sm space-y-10">
                                        <h3 className="text-xs md:text-2xl font-black text-slate-800 uppercase italic tracking-[0.2em] border-b pb-8">GİDER DAĞILIMI</h3>
                                        <div className="space-y-10">
                                            {[
                                                { l: 'Maaş Gideri', val: reportAnalysis.staffEx, r: (reportAnalysis.staffEx / (reportAnalysis.totalEx || 1)) * 100, c: 'bg-amber-500' },
                                                { l: 'POS / Banka', val: reportAnalysis.posEx, r: (reportAnalysis.posEx / (reportAnalysis.totalEx || 1)) * 100, c: 'bg-blue-500' },
                                                { l: 'Diğer Giderler', val: reportAnalysis.totalEx - (reportAnalysis.staffEx + reportAnalysis.posEx), r: ((reportAnalysis.totalEx - (reportAnalysis.staffEx + reportAnalysis.posEx)) / (reportAnalysis.totalEx || 1)) * 100, c: 'bg-slate-300' }
                                            ].map((item, i) => (
                                                <div key={i}>
                                                    <div className="flex justify-between text-[10px] font-black uppercase text-slate-500 mb-4 italic"><span>{String(item.l)}</span><span>%{item.r.toFixed(0)}</span></div>
                                                    <div className="w-full h-4 bg-slate-50 rounded-full border shadow-inner overflow-hidden flex items-center"><div className={`h-full ${item.c} shadow-xl transition-all duration-1000`} style={{width: `${item.r}%`}}></div></div>
                                                    <p className="text-right text-[10px] font-black text-slate-800 mt-3 italic">{formatCurrency(item.val)}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 p-10 md:p-14 rounded-[3rem] text-white shadow-2xl relative overflow-hidden flex flex-col justify-between border border-white/5">
                                        <div>
                                           <h3 className="text-xs md:text-2xl font-black text-amber-500 uppercase italic mb-12 tracking-[0.2em] laos-gradient-text">YÖNETİCİ NOTLARI</h3>
                                           <div className="space-y-8 relative z-10">
                                              <div className="bg-white/5 p-8 rounded-[2rem] border border-white/5 backdrop-blur-xl">
                                                <p className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest italic">İŞGÜCÜ VERİMLİLİĞİ</p>
                                                <p className="text-xs md:text-lg font-bold italic leading-relaxed text-slate-200 tracking-tight">Personel giderleri toplam cironun %{((reportAnalysis.staffEx / (reportAnalysis.totalIn || 1)) * 100).toFixed(1)}'ini oluşturuyor.</p>
                                              </div>
                                              <div className="bg-white/5 p-8 rounded-[2rem] border border-white/5 backdrop-blur-xl">
                                                <p className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest italic">KÂR DURUMU</p>
                                                <p className="text-xs md:text-lg font-bold italic leading-relaxed text-slate-200 tracking-tight">Ciro bazlı kâr marjınız %{reportAnalysis.margin.toFixed(1)} seviyesinde seyrediyor.</p>
                                              </div>
                                           </div>
                                        </div>
                                        <div className="mt-14 pt-10 border-t border-white/5 flex items-center justify-between">
                                           <p className="text-[9px] font-black text-slate-500 uppercase tracking-[0.6em] italic">LAOS FINANS ANALİZ</p>
                                           <span className="text-amber-500 text-xl animate-pulse italic font-black">⚡ L</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* SYNC DURUMU */}
                    <div className="fixed top-4 right-4 z-[1001] md:top-8 md:right-8">
                        <div className="px-5 py-2.5 rounded-full bg-slate-950/95 backdrop-blur-2xl shadow-2xl border border-white/10 flex items-center gap-3">
                            <div className="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-[0_0_15px_#f59e0b] animate-pulse"></div>
                            <span className="text-[9px] font-black text-amber-500 uppercase tracking-[0.3em] italic font-bold">LAOS CONNECTED</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
