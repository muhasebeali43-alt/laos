<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kafe Analiz | Laos Finansal Yönetim</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide İkon Kütüphanesi -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
        
        :root {
            --laos-gold: #f59e0b;
            --laos-dark: #0f172a;
            --laos-slate: #1e293b;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        .laos-hero-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 2rem;
            border-bottom: 8px solid var(--laos-gold);
        }

        @media (min-width: 768px) {
            .laos-hero-card { border-radius: 3.5rem; }
        }

        .gold-text { color: var(--laos-gold); } 
        .gold-bg { background-color: var(--laos-gold); }

        .white-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }
        
        @media (min-width: 768px) {
            .white-card { border-radius: 2.5rem; }
        }

        .nav-active {
            background-color: var(--laos-gold);
            color: #0f172a;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3);
        }

        input:focus, select:focus { outline: none; border-bottom: 2px solid var(--laos-gold); }
        
        .animate-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .laos-gradient-text {
            background: linear-gradient(to right, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.2s ease-out;
            z-index: 1000;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .date-input-font {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.05em;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: white;">
            <div style="width: 50px; height: 50px; border: 4px solid #f59e0b; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
            <p style="font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; font-size: 10px;">Laos Analiz Sistemleri</p>
        </div>
    </div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDDzSjjk0N-k3QLIJQu8jHWxCDtgzvZ1lE",
            authDomain: "laos-61380.firebaseapp.com",
            projectId: "laos-61380",
            storageBucket: "laos-61380.appspot.com",
            messagingSenderId: "833439553703",
            appId: "1:833439553703:web:6f4a1c7969a7f7216fa382"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'cafe-pro-v1';

        const { useState, useEffect, useMemo } = React;

        const MATERIAL_UNITS = [
            { id: 'kg', label: 'Kilogram (kg)' },
            { id: 'lt', label: 'Litre (lt)' },
            { id: 'ad', label: 'Adet (ad)' },
            { id: 'mg', label: 'Miligram (mg)' },
            { id: 'paket', label: 'Paket (pkt)' }
        ];

        const Icon = ({ name, size = 20, className = "" }) => {
            if (!window.lucide || !lucide.icons) return null;
            const camelName = name.split('-').map((word, index) => 
                index === 0 ? word : word.charAt(0).toUpperCase() + word.slice(1)
            ).join('');
            const iconData = lucide.icons[camelName] || lucide.icons[name];
            if (!iconData) return null;
            const [tag, attrs, children] = iconData;
            return React.createElement(
                'svg', { ...attrs, width: size, height: size, className: `lucide lucide-${name} ${className}`, xmlns: "http://www.w3.org/2000/svg" },
                children.map((child, i) => React.createElement(child[0], { ...child[1], key: i }))
            );
        };

        const formatNumber = (val) => {
            if (val === null || val === undefined || isNaN(val)) return "0";
            return new Intl.NumberFormat('tr-TR').format(val);
        };

        const formatCurrency = (val) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 0 }).format(val || 0);

        const dbToDisplay = (isoDate) => {
            if (!isoDate) return "";
            const parts = isoDate.split("-");
            if (parts.length !== 3) return isoDate;
            return `${parts[2]}.${parts[1]}.${parts[0]}`; 
        };

        const displayToDb = (displayDate) => {
            if (!displayDate) return null;
            const parts = displayDate.split(".");
            if (parts.length !== 3) return null;
            return `${parts[2]}-${parts[1]}-${parts[0]}`; 
        };

        const DateInput = ({ value, onChange, className = "" }) => {
            const [localVal, setLocalVal] = useState(dbToDisplay(value));
            useEffect(() => { setLocalVal(dbToDisplay(value)); }, [value]);
            const handleChange = (e) => {
                let v = e.target.value.replace(/[^0-9]/g, '');
                if (v.length > 8) v = v.substring(0, 8);
                let formatted = v;
                if (v.length > 2) formatted = v.substring(0, 2) + '.' + v.substring(2);
                if (v.length > 4) formatted = formatted.substring(0, 5) + '.' + formatted.substring(5);
                setLocalVal(formatted);
                if (v.length === 8) {
                    const dbVal = displayToDb(formatted);
                    if (dbVal) onChange(dbVal);
                }
            };
            return (
                <div className="flex items-center gap-2 relative group w-full md:w-auto">
                    <div className="relative p-2 bg-white/10 rounded-lg hover:bg-white/20 transition-all cursor-pointer">
                        <Icon name="calendar" size={18} className="text-amber-500 pointer-events-none" />
                        <input type="date" value={value || ""} onChange={(e) => e.target.value && onChange(e.target.value)} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
                    </div>
                    <input type="text" value={localVal} onChange={handleChange} maxLength={10} placeholder="GG.AA.YYYY" className={`bg-transparent date-input-font border-none focus:ring-0 p-0 text-sm italic tracking-tighter w-24 ${className}`} />
                </div>
            );
        };

        const MoneyInput = ({ value, onChange, className = "", placeholder = "0" }) => {
            const [display, setDisplay] = useState(formatNumber(value));
            useEffect(() => { setDisplay(formatNumber(value)); }, [value]);
            const handleChange = (e) => {
                const raw = e.target.value.replace(/[^0-9]/g, '');
                const numValue = raw ? parseInt(raw, 10) : 0;
                setDisplay(formatNumber(numValue));
                onChange(numValue);
            };
            return (
                <input type="text" inputMode="numeric" value={display === "0" && placeholder !== "0" ? "" : display} 
                       onChange={handleChange} placeholder={placeholder} className={className} />
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [recipeSubTab, setRecipeSubTab] = useState('products'); 
            const [loading, setLoading] = useState(true);
            const [reportRange, setReportRange] = useState('monthly');
            const [customStartDate, setCustomStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [customEndDate, setCustomEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedPersonnelId, setSelectedPersonnelId] = useState(null);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [showDeleteModal, setShowDeleteModal] = useState({ show: false, col: '', id: '' });
            const [historyFilter, setHistoryFilter] = useState('all');

            const [settings, setSettings] = useState({ initialBalance: 0, defaultCommission: 3.5, defaultValor: 30 });
            const [dailyLogs, setDailyLogs] = useState([]);
            const [scheduledPayments, setScheduledPayments] = useState([]);
            const [personnel, setPersonnel] = useState([]);
            const [personnelPayments, setPersonnelPayments] = useState([]);
            const [materials, setMaterials] = useState([]);
            const [products, setProducts] = useState([]);

            useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (u) {
                        const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                        baseRef.collection('config').doc('app_settings').onSnapshot(d => d.exists && setSettings(d.data()));
                        baseRef.collection('dailyLogs').onSnapshot(s => setDailyLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('scheduledPayments').onSnapshot(s => setScheduledPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('personnel').onSnapshot(s => setPersonnel(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('personnelPayments').onSnapshot(s => setPersonnelPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('materials').onSnapshot(s => setMaterials(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('products').onSnapshot(s => setProducts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        setLoading(false);
                    } else {
                        auth.signInAnonymously().catch(console.error);
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            // TÜM İŞLEMLERİN BİRLEŞTİRİLMESİ
            const allTransactions = useMemo(() => {
                const logs = dailyLogs.map(l => ({
                    id: l.id,
                    date: l.date,
                    label: 'Günlük Kasa Satışı',
                    amount: Number(l.cash || 0) + Number(l.card || 0),
                    type: 'income',
                    category: 'Satış',
                    collection: 'dailyLogs'
                }));

                const loans = dailyLogs.filter(l => Number(l.dailyLoan) > 0).map(l => ({
                    id: l.id + '_loan',
                    date: l.date,
                    label: 'Kredi / Borç Girişi',
                    amount: Number(l.dailyLoan),
                    type: 'loan',
                    category: 'Kredi',
                    collection: 'dailyLogs',
                    subField: 'dailyLoan'
                }));

                const bills = scheduledPayments.filter(p => p.status === 'paid').map(p => ({
                    id: p.id,
                    date: p.date,
                    label: p.label,
                    amount: Number(p.amount),
                    type: 'expense',
                    category: 'Gider',
                    collection: 'scheduledPayments'
                }));

                const staff = personnelPayments.map(p => {
                    const person = personnel.find(pers => pers.id === p.personnelId);
                    return {
                        id: p.id,
                        date: p.date,
                        label: `Maaş Ödemesi: ${person?.name || 'Personel'}`,
                        amount: Number(p.amount),
                        type: 'expense',
                        category: 'Maaş',
                        collection: 'personnelPayments'
                    };
                });

                const combined = [...logs, ...loans, ...bills, ...staff].sort((a, b) => new Date(b.date) - new Date(a.date));
                
                if (historyFilter === 'income') return combined.filter(t => t.type === 'income' || t.type === 'loan');
                if (historyFilter === 'expense') return combined.filter(t => t.type === 'expense');
                return combined;
            }, [dailyLogs, scheduledPayments, personnelPayments, personnel, historyFilter]);

            const globalStats = useMemo(() => {
                const logsTotals = dailyLogs.reduce((acc, log) => {
                    const comm = (Number(log.card || 0) * (settings.defaultCommission || 3.5)) / 100;
                    return {
                        loan: acc.loan + Number(log.dailyLoan || 0),
                        cash: acc.cash + Number(log.cash || 0),
                        card: acc.card + Number(log.card || 0),
                        comm: acc.comm + comm
                    };
                }, { loan: 0, cash: 0, card: 0, comm: 0 });

                const billsPaid = scheduledPayments.filter(p => p.status === 'paid').reduce((s, p) => s + Number(p.amount), 0);
                const validPersonnelIds = new Set(personnel.map(p => p.id));
                const staffPaidTotal = personnelPayments
                    .filter(pay => validPersonnelIds.has(pay.personnelId))
                    .reduce((s, p) => s + Number(p.amount || 0), 0);
                
                const netCash = Number(settings.initialBalance || 0) + logsTotals.cash + logsTotals.card + logsTotals.loan - (staffPaidTotal + billsPaid + logsTotals.comm);
                const posPending = logsTotals.card - logsTotals.comm;
                
                const upcoming = scheduledPayments
                    .filter(p => p.status !== 'paid')
                    .sort((a, b) => new Date(a.date) - new Date(b.date))
                    .slice(0, 5);

                return { ...logsTotals, billsPaid, staffPaidTotal, netCash, posPending, upcoming };
            }, [dailyLogs, scheduledPayments, personnelPayments, personnel, settings]);

            const reportAnalysis = useMemo(() => {
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const startOfMonthStr = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];

                let logs = [...dailyLogs];
                let pPayments = [...personnelPayments];
                let bills = [...scheduledPayments];

                const filterByDate = (arr) => {
                    if (reportRange === 'daily') return arr.filter(l => l.date === todayStr);
                    if (reportRange === 'monthly') return arr.filter(l => l.date >= startOfMonthStr);
                    if (reportRange === 'custom') return arr.filter(l => l.date >= customStartDate && l.date <= customEndDate);
                    return arr;
                };

                logs = filterByDate(logs);
                pPayments = filterByDate(pPayments);
                bills = filterByDate(bills.filter(b => b.status === 'paid'));

                const incomeCash = logs.reduce((acc, log) => acc + Number(log.cash || 0), 0);
                const incomeCard = logs.reduce((acc, log) => acc + Number(log.card || 0), 0);
                const incomeLoan = logs.reduce((acc, log) => acc + Number(log.dailyLoan || 0), 0);
                
                const totalRevenue = incomeCash + incomeCard; 
                const staffExpense = pPayments.reduce((acc, p) => acc + Number(p.amount || 0), 0);
                const billsExpense = bills.reduce((acc, p) => acc + Number(p.amount || 0), 0);
                const commExpense = logs.reduce((acc, log) => acc + (Number(log.card || 0) * (settings.defaultCommission || 3.5)) / 100, 0);
                
                const totalExpense = staffExpense + billsExpense + commExpense;
                const profit = totalRevenue - totalExpense;
                const margin = totalRevenue > 0 ? (profit / totalRevenue) * 100 : 0;

                return { 
                    incomeCash, incomeCard, incomeLoan, totalRevenue,
                    staffExpense, billsExpense, commExpense, totalExpense,
                    profit, margin,
                    raw: { logs, pPayments, bills } 
                };
            }, [dailyLogs, personnelPayments, scheduledPayments, reportRange, customStartDate, customEndDate, settings]);

            const calculateProductCost = (product) => {
                if (!product.ingredients || product.ingredients.length === 0) return 0;
                return product.ingredients.reduce((total, ing) => {
                    const mat = materials.find(m => m.id === ing.materialId);
                    if (!mat) return total;
                    let unitFactor = 1000;
                    if (mat.unit === 'mg') unitFactor = 1;
                    if (mat.unit === 'ad' || mat.unit === 'paket') unitFactor = 1;
                    const unitPrice = Number(mat.price || 0) / unitFactor;
                    return total + (unitPrice * Number(ing.quantity || 0));
                }, 0);
            };

            const getCol = (c) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(c);
            const triggerDelete = (col, id) => setShowDeleteModal({ show: true, col, id });
            
            const confirmDelete = async () => { 
                const { col, id } = showDeleteModal; 
                if (!col || !id) return;
                try {
                    // Eğer loan siliyorsak aslında log'u değil log içindeki loan alanını 0 yapmalıyız
                    if (id.endsWith('_loan')) {
                        const originalId = id.replace('_loan', '');
                        await getCol('dailyLogs').doc(originalId).update({ dailyLoan: 0 });
                    } else {
                        await getCol(col).doc(id).delete(); 
                        if (col === 'personnel') {
                            const paymentsToDelete = personnelPayments.filter(p => p.personnelId === id);
                            for (const pay of paymentsToDelete) await getCol('personnelPayments').doc(pay.id).delete();
                        }
                    }
                } catch (e) {
                    console.error("Hata:", e);
                } finally {
                    setShowDeleteModal({ show: false, col: '', id: '' }); 
                }
            };

            if (loading) return <div className="min-h-screen bg-[#0f172a] flex items-center justify-center text-white font-black uppercase animate-pulse">Yükleniyor...</div>;

            return (
                <div className="min-h-screen flex flex-col md:flex-row pb-24 md:pb-0 overflow-x-hidden bg-[#F1F5F9]">
                    
                    {showDeleteModal.show && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 modal-overlay z-[1001]">
                            <div className="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl animate-up text-center border">
                                <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6"> <Icon name="trash-2" size={32} /> </div>
                                <h3 className="text-xl font-black text-slate-900 mb-2 uppercase tracking-tighter">İşlemi Onayla</h3>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowDeleteModal({show:false, col:'', id:''})} className="flex-1 py-4 rounded-xl bg-slate-100 text-slate-500 font-black text-xs uppercase tracking-widest">VAZGEÇ</button>
                                    <button onClick={confirmDelete} className="flex-1 py-4 rounded-xl bg-red-500 text-white font-black text-xs uppercase shadow-lg">SİL</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 md:relative md:w-64 bg-[#0f172a] text-white p-2 md:p-6 flex md:flex-col justify-around md:justify-start gap-1 md:gap-4 z-50 shadow-2xl font-bold">
                        <div className="hidden md:flex items-center gap-3 mb-10 px-2 font-bold">
                            <div className="w-8 h-8 gold-bg rounded-full flex items-center justify-center text-slate-900 font-black italic shadow-[0_0_15px_#f59e0b] text-xs font-bold">L</div>
                            <h2 className="font-black text-xl italic tracking-tighter uppercase laos-gradient-text">Kafe Analiz</h2>
                        </div>
                        {[
                            {id:'dashboard', icon:'layout-dashboard', l:'Özet'},
                            {id:'daily', icon:'calendar-days', l:'Günlük'},
                            {id:'transactions', icon:'history', l:'İşlemler'}, // YENİ SEKME
                            {id:'pos', icon:'credit-card', l:'POS'},
                            {id:'recipe', icon:'chef-hat', l:'Reçeteler'},
                            {id:'personnel', icon:'users', l:'Personel'},
                            {id:'payments', icon:'receipt', l:'Ödemeler'},
                            {id:'reports', icon:'bar-chart-3', l:'Analiz'}
                        ].map(t => (
                            <button key={t.id} onClick={() => {setActiveTab(t.id); setSelectedPersonnelId(null); setSelectedProductId(null);}} 
                                className={`flex-1 md:flex-none flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:p-3 rounded-xl md:rounded-2xl transition-all ${activeTab === t.id ? 'nav-active' : 'text-slate-500 hover:text-slate-300'}`}>
                                <Icon name={t.icon} size={activeTab === t.id ? 20 : 18} /> 
                                <span className="text-[8px] md:text-xs font-black uppercase tracking-widest text-center">{t.l}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-4 md:p-12 overflow-y-auto no-scrollbar">
                        
                        {/* ÖZET PANELİ */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 md:space-y-10 animate-up font-bold">
                                <header className="flex items-center gap-3 md:gap-4 font-bold font-bold"><div className="w-1.5 h-8 md:h-10 gold-bg rounded-full"></div><h1 className="text-2xl md:text-5xl font-black text-slate-900 tracking-tighter italic uppercase">Finansal Durum</h1></header>
                                
                                <div className="laos-hero-card p-6 md:p-14 text-white shadow-2xl relative overflow-hidden group font-bold">
                                    <p className="text-[8px] md:text-[12px] font-bold text-slate-400 uppercase mb-3 tracking-[0.4em] flex items-center gap-2 italic">NET NAKİT GÜCÜ</p>
                                    <h2 className="text-3xl md:text-8xl font-black gold-text tracking-tighter mb-8 md:mb-16 italic break-all font-bold">{formatCurrency(globalStats.netCash)}</h2>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-12 border-t border-white/5 pt-8 md:pt-10 font-bold">
                                        <div><p className="text-[8px] md:text-[11px] text-slate-500 font-bold uppercase mb-1 tracking-widest italic">Aylık Ciro</p><p className="font-bold text-sm md:text-2xl text-slate-200">{formatCurrency(globalStats.cash + globalStats.card)}</p></div>
                                        <div><p className="text-[8px] md:text-[11px] text-slate-500 font-bold uppercase mb-1 tracking-widest italic">Gider</p><p className="font-bold text-sm md:text-2xl text-red-400">{formatCurrency(globalStats.staffPaidTotal + globalStats.billsPaid + globalStats.comm)}</p></div>
                                        <div><p className="text-[8px] md:text-[11px] text-slate-500 font-bold uppercase mb-1 tracking-widest italic">Kredi</p><p className="font-bold text-sm md:text-2xl text-blue-400">{formatCurrency(globalStats.loan)}</p></div>
                                        <div><p className="text-[8px] md:text-[11px] text-slate-500 font-bold uppercase mb-1 tracking-widest italic">Kasa</p><p className="font-bold text-sm md:text-2xl text-slate-500">{formatCurrency(settings.initialBalance)}</p></div>
                                    </div>
                                </div>

                                <div className="white-card p-6 md:p-10 border-l-8 border-red-500 shadow-xl space-y-6 font-bold">
                                    <div className="flex justify-between items-center border-b pb-4">
                                        <h3 className="text-lg md:text-2xl font-black text-slate-800 uppercase italic tracking-tighter flex items-center gap-3">
                                            <Icon name="bell" className="text-red-500" /> Yaklaşan Ödemeler
                                        </h3>
                                    </div>
                                    <div className="space-y-4 font-bold">
                                        {globalStats.upcoming && globalStats.upcoming.length > 0 ? globalStats.upcoming.map(p => (
                                            <div key={p.id} className="flex justify-between items-center bg-slate-50 p-4 md:p-6 rounded-[1.5rem] border transition-all hover:bg-slate-100 font-bold">
                                                <div className="flex items-center gap-4">
                                                    <div className="bg-white p-2 rounded-xl text-[10px] font-black text-red-600 border border-red-100 italic tracking-tighter">{dbToDisplay(p.date)}</div>
                                                    <div><p className="font-black text-slate-800 uppercase text-xs md:text-base leading-none mb-1 font-bold">{p.label}</p></div>
                                                </div>
                                                <p className="text-lg md:text-2xl font-black text-red-600 tracking-tighter font-bold">{formatCurrency(p.amount)}</p>
                                            </div>
                                        )) : <div className="text-center py-6 text-slate-300 font-black uppercase text-[10px] italic">Bekleyen Ödeme Yok</div>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* YENİ İŞLEMLER SEKME İÇERİĞİ */}
                        {activeTab === 'transactions' && (
                            <div className="max-w-6xl mx-auto space-y-8 animate-up pb-20 font-bold font-bold font-bold">
                                <header className="flex flex-col md:flex-row justify-between items-center gap-6 font-bold font-bold font-bold">
                                    <div className="flex items-center gap-4 font-bold font-bold font-bold font-bold"><div className="w-2 h-12 gold-bg rounded-full shadow-[0_0_15px_#f59e0b]"></div><h2 className="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter uppercase italic font-bold font-bold font-bold font-bold">Tüm Hareketler</h2></div>
                                    <div className="flex bg-slate-950 p-1.5 md:p-2 rounded-2xl md:rounded-[3rem] border border-slate-800 shadow-2xl overflow-x-auto no-scrollbar max-w-full font-bold">
                                        {['all', 'income', 'expense'].map(f => (
                                            <button key={f} onClick={() => setHistoryFilter(f)} className={`px-6 py-3 md:px-10 md:py-4 rounded-xl md:rounded-full text-[9px] md:text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap font-bold ${historyFilter === f ? 'gold-bg text-slate-950 shadow-xl' : 'text-slate-500 hover:text-slate-300'}`}>
                                                {f === 'all' ? 'HEPSİ' : f === 'income' ? 'GELİRLER' : 'GİDERLER'}
                                            </button>
                                        ))}
                                    </div>
                                </header>

                                <div className="white-card shadow-2xl overflow-hidden font-bold">
                                    <div className="overflow-x-auto font-bold font-bold font-bold font-bold">
                                        <table className="w-full text-left font-bold font-bold font-bold">
                                            <thead>
                                                <tr className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest font-bold">
                                                    <th className="p-6">Tarih</th>
                                                    <th className="p-6">Tür / Kategori</th>
                                                    <th className="p-6">Açıklama</th>
                                                    <th className="p-6 text-right">Tutar</th>
                                                    <th className="p-6 text-center">İşlem</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-bold font-bold font-bold">
                                                {allTransactions.map((t, idx) => (
                                                    <tr key={t.id + '_' + idx} className="hover:bg-slate-50/50 transition-all font-bold">
                                                        <td className="p-6 text-sm text-slate-500 italic font-bold font-bold">{dbToDisplay(t.date)}</td>
                                                        <td className="p-6">
                                                            <span className={`px-3 py-1 rounded-full text-[9px] font-black uppercase italic ${
                                                                t.type === 'income' ? 'bg-emerald-100 text-emerald-600' : 
                                                                t.type === 'loan' ? 'bg-blue-100 text-blue-600' : 'bg-red-100 text-red-600'
                                                            }`}>
                                                                {t.category}
                                                            </span>
                                                        </td>
                                                        <td className="p-6 font-black text-slate-800 text-sm uppercase tracking-tighter italic font-bold font-bold">{t.label}</td>
                                                        <td className={`p-6 text-right font-black text-base italic font-bold font-bold font-bold ${
                                                            t.type === 'expense' ? 'text-red-500' : 'text-emerald-500'
                                                        }`}>
                                                            {t.type === 'expense' ? '-' : '+'}{formatCurrency(t.amount)}
                                                        </td>
                                                        <td className="p-6 text-center">
                                                            <button 
                                                                onClick={() => triggerDelete(t.collection, t.id)}
                                                                className="bg-red-500 text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-red-600 transition-all shadow-md font-bold"
                                                            >
                                                                SİL
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                        {allTransactions.length === 0 && (
                                            <div className="text-center py-20 text-slate-300 font-black uppercase italic text-xs font-bold font-bold">Herhangi bir işlem kaydı bulunamadı.</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ANALİZ / RAPORLAR */}
                        {activeTab === 'reports' && (
                            <div className="max-w-5xl mx-auto space-y-8 animate-up pb-20 font-bold">
                                <header className="flex flex-col md:flex-row justify-between items-center gap-6 font-bold font-bold">
                                    <div className="flex items-center gap-4 font-bold font-bold font-bold font-bold font-bold font-bold font-bold"><div className="w-2 h-12 gold-bg rounded-full shadow-[0_0_15px_#f59e0b]"></div><h2 className="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter uppercase italic font-bold">İşletme Analizi</h2></div>
                                    <div className="flex bg-slate-900 p-1.5 md:p-2 rounded-2xl md:rounded-[3rem] border border-slate-800 shadow-2xl overflow-x-auto no-scrollbar max-w-full font-bold">
                                        {['daily', 'monthly', 'custom'].map(r => (
                                            <button key={r} onClick={() => setReportRange(r)} className={`px-6 py-3 md:px-10 md:py-4 rounded-xl md:rounded-full text-[9px] md:text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap font-bold ${reportRange === r ? 'gold-bg text-slate-950 shadow-xl' : 'text-slate-500 hover:text-slate-300'}`}>
                                                {r === 'daily' ? 'BUGÜN' : r === 'monthly' ? 'BU AY' : 'ÖZEL'}
                                            </button>
                                        ))}
                                    </div>
                                </header>
                                
                                {reportRange === 'custom' && (
                                    <div className="flex gap-4 p-6 white-card justify-center items-center font-bold">
                                        <DateInput value={customStartDate} onChange={setCustomStartDate} className="bg-slate-50 px-4 py-2 rounded-xl" />
                                        <Icon name="arrow-right" size={16} className="text-slate-400" />
                                        <DateInput value={customEndDate} onChange={setCustomEndDate} className="bg-slate-50 px-4 py-2 rounded-xl" />
                                    </div>
                                )}

                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 font-bold font-bold">
                                    <div className="bg-white p-6 rounded-[2.5rem] border-l-[10px] border-emerald-500 shadow-xl font-bold font-bold">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 italic font-bold">BRÜT HASILAT</p>
                                        <p className="text-xl md:text-3xl font-black text-slate-900 tracking-tighter font-bold">{formatCurrency(reportAnalysis.totalRevenue)}</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-[2.5rem] border-l-[10px] border-red-500 shadow-xl font-bold font-bold">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 italic font-bold">TOPLAM GİDER</p>
                                        <p className="text-xl md:text-3xl font-black text-red-600 tracking-tighter font-bold">{formatCurrency(reportAnalysis.totalExpense)}</p>
                                    </div>
                                    <div className="laos-hero-card p-6 rounded-[2.5rem] text-white shadow-2xl flex flex-col justify-center font-bold">
                                        <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 italic font-bold">NET KÂR</p>
                                        <p className={`text-xl md:text-3xl font-black tracking-tighter font-bold ${reportAnalysis.profit >= 0 ? 'gold-text' : 'text-red-400'}`}>{formatCurrency(reportAnalysis.profit)}</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-[2.5rem] border-l-[10px] border-blue-500 shadow-xl font-bold font-bold">
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 italic font-bold font-bold">KÂR MARJI</p>
                                        <p className="text-xl md:text-3xl font-black text-blue-600 tracking-tighter font-bold">%{reportAnalysis.margin.toFixed(1)}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 font-bold font-bold">
                                    <div className="white-card p-8 shadow-xl font-bold font-bold">
                                        <h3 className="text-lg font-black uppercase italic text-slate-800 mb-6 flex items-center gap-3 border-b pb-4 font-bold font-bold">
                                            <Icon name="trending-up" className="text-emerald-500" /> Gelir Kalemleri
                                        </h3>
                                        <div className="space-y-4 font-bold font-bold">
                                            <div className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl font-bold"><span className="text-sm font-bold uppercase italic font-bold">Nakit Satış</span><span className="font-black text-emerald-600">{formatCurrency(reportAnalysis.incomeCash)}</span></div>
                                            <div className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl font-bold font-bold"><span className="text-sm font-bold uppercase italic font-bold">Kredi Kartı</span><span className="font-black text-emerald-600">{formatCurrency(reportAnalysis.incomeCard)}</span></div>
                                            <div className="flex justify-between items-center bg-blue-50/50 p-4 rounded-2xl border border-blue-100 font-bold"><span className="text-sm font-bold uppercase italic text-blue-500">Borç/Kredi Girişi*</span><span className="font-black text-blue-500">{formatCurrency(reportAnalysis.incomeLoan)}</span></div>
                                            <p className="text-[8px] text-slate-400 italic text-right font-bold">*Borç girişleri net kâr hesabına dahil edilmez.</p>
                                        </div>
                                    </div>

                                    <div className="white-card p-8 shadow-xl font-bold">
                                        <h3 className="text-lg font-black uppercase italic text-slate-800 mb-6 flex items-center gap-3 border-b pb-4 font-bold">
                                            <Icon name="trending-down" className="text-red-500" /> Gider Kalemleri
                                        </h3>
                                        <div className="space-y-4 font-bold">
                                            <div className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl font-bold"><span className="text-sm font-bold uppercase italic font-bold">Personel Maaşları</span><span className="font-black text-red-600">{formatCurrency(reportAnalysis.staffExpense)}</span></div>
                                            <div className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl font-bold"><span className="text-sm font-bold uppercase italic font-bold">Ödenen Faturalar</span><span className="font-black text-red-600">{formatCurrency(reportAnalysis.billsExpense)}</span></div>
                                            <div className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl font-bold font-bold"><span className="text-sm font-bold uppercase italic font-bold">POS Komisyonları</span><span className="font-black text-red-600">{formatCurrency(reportAnalysis.commExpense)}</span></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* GÜNLÜK VERİLER */}
                        {activeTab === 'daily' && (
                            <div className="max-w-2xl mx-auto space-y-4 md:space-y-6 animate-up font-bold">
                                <div className="flex justify-between items-center bg-slate-950 p-6 md:p-8 rounded-3xl border-b-8 border-amber-500 shadow-2xl font-bold">
                                    <h2 className="text-white font-black text-lg md:text-2xl uppercase tracking-widest laos-gradient-text italic font-bold">Günlük Girişler</h2>
                                    <button onClick={() => getCol('dailyLogs').add({date: new Date().toISOString().split('T')[0], cash:0, card:0, dailyLoan:0})} className="gold-bg text-slate-950 px-8 py-4 rounded-2xl font-black text-xs uppercase shadow-xl italic font-bold">YENİ GÜN</button>
                                </div>
                                {dailyLogs.sort((a,b) => new Date(b.date) - new Date(a.date)).map(log => (
                                    <div key={log.id} className="white-card p-6 md:p-10 space-y-6 border group shadow-lg font-bold">
                                        <div className="flex justify-between items-center border-b pb-4 font-bold">
                                            <DateInput value={log.date} onChange={(newDate) => getCol('dailyLogs').doc(log.id).update({date: newDate})} />
                                            <button onClick={() => triggerDelete('dailyLogs', log.id)} className="bg-red-50 text-red-500 px-4 py-2 rounded-lg text-[9px] font-black uppercase font-bold tracking-widest font-bold">SİL</button>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4 font-bold">
                                            <div>
                                                <p className="text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest italic font-bold font-bold">Nakit Satış</p>
                                                <MoneyInput value={log.cash} onChange={(val) => getCol('dailyLogs').doc(log.id).update({cash: val})} className="w-full bg-slate-50 p-6 rounded-2xl font-black text-xl border-none shadow-inner font-bold italic font-bold" />
                                            </div>
                                            <div>
                                                <p className="text-[10px] font-black text-blue-500 mb-1 uppercase tracking-widest italic font-bold font-bold">POS Satış</p>
                                                <MoneyInput value={log.card} onChange={(val) => getCol('dailyLogs').doc(log.id).update({card: val})} className="w-full bg-blue-50 p-6 rounded-2xl font-black text-xl text-blue-700 border-none shadow-inner font-bold italic font-bold" />
                                            </div>
                                        </div>
                                        <div className="bg-slate-950 p-6 rounded-3xl border border-slate-800 shadow-inner text-center font-bold">
                                            <p className="text-[10px] font-black text-amber-500 mb-1 uppercase tracking-widest italic font-bold">Kredi Girişi</p>
                                            <MoneyInput value={log.dailyLoan || 0} onChange={(val) => getCol('dailyLogs').doc(log.id).update({dailyLoan: val})} className="w-full bg-transparent p-0 border-none font-black text-3xl text-white italic text-center focus:ring-0 font-bold" placeholder="0" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* REÇETE YÖNETİMİ */}
                        {activeTab === 'recipe' && (
                            <div className="max-w-6xl mx-auto space-y-8 animate-up pb-20 font-bold">
                                <header className="flex flex-col md:flex-row justify-between items-center gap-6 font-bold font-bold">
                                    <div className="flex items-center gap-4 font-bold font-bold font-bold"><div className="w-2 h-12 gold-bg rounded-full shadow-[0_0_15px_#f59e0b]"></div><h2 className="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter uppercase italic font-bold font-bold font-bold">Maliyet Analizi</h2></div>
                                    <div className="flex bg-slate-900 p-1.5 md:p-2 rounded-2xl md:rounded-[3rem] border border-slate-800 shadow-2xl font-bold font-bold">
                                        {['products', 'materials'].map(r => (
                                            <button key={r} onClick={() => {setRecipeSubTab(r); setSelectedProductId(null);}} 
                                                className={`px-6 py-3 md:px-10 md:py-4 rounded-xl md:rounded-full text-[9px] md:text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap font-bold ${recipeSubTab === r ? 'gold-bg text-slate-950 shadow-xl' : 'text-slate-500 hover:text-slate-300'}`}>
                                                {r === 'products' ? 'ÜRÜN REÇETELERİ' : 'HAMMADDE FİYATLARI'}
                                            </button>
                                        ))}
                                    </div>
                                </header>
                                {recipeSubTab === 'materials' && (
                                    <div className="white-card p-6 md:p-10 shadow-xl space-y-8 font-bold">
                                        <div className="flex justify-between items-center border-b pb-8 font-bold font-bold">
                                            <h3 className="text-xl font-black uppercase italic text-slate-800 tracking-tighter flex items-center gap-3 font-bold"><Icon name="boxes" className="text-amber-500" /> Hammadde Listesi</h3>
                                            <button onClick={() => getCol('materials').add({name: 'Yeni Malzeme', price: 0, unit: 'kg'})} className="bg-slate-950 text-white px-8 py-4 rounded-2xl text-[10px] font-black uppercase shadow-xl italic font-bold">MALZEME EKLE</button>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 font-bold font-bold font-bold font-bold">
                                            {materials.map(m => (
                                                <div key={m.id} className="bg-slate-50 p-6 rounded-3xl border border-slate-100 hover:shadow-md transition-all space-y-4 font-bold">
                                                    <div className="flex justify-between items-start font-bold">
                                                        <input value={m.name} onChange={(e) => getCol('materials').doc(m.id).update({name: e.target.value})} className="font-black uppercase text-sm bg-transparent border-none focus:ring-0 w-full italic font-bold" />
                                                        <button 
                                                            onClick={() => triggerDelete('materials', m.id)} 
                                                            className="p-2 bg-red-100 text-red-600 hover:bg-red-600 hover:text-white rounded-xl transition-all shadow-sm"
                                                            title="Malzemeyi Sil"
                                                        >
                                                            <Icon name="trash-2" size={18} />
                                                        </button>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-4 font-bold font-bold font-bold">
                                                        <div className="font-bold font-bold">
                                                            <p className="text-[9px] font-black text-slate-400 uppercase italic font-bold font-bold">Birim</p>
                                                            <select 
                                                                value={m.unit} 
                                                                onChange={(e) => getCol('materials').doc(m.id).update({unit: e.target.value})} 
                                                                className="w-full bg-white px-3 py-2 rounded-xl text-xs border font-black uppercase focus:ring-2 focus:ring-amber-500 italic font-bold font-bold font-bold font-bold"
                                                            >
                                                                {MATERIAL_UNITS.map(u => <option key={u.id} value={u.id}>{u.label}</option>)}
                                                            </select>
                                                        </div>
                                                        <div className="font-bold font-bold font-bold font-bold font-bold"><p className="text-[9px] font-black text-slate-400 uppercase italic font-bold">Birim Fiyat (₺)</p><MoneyInput value={m.price} onChange={(val) => getCol('materials').doc(m.id).update({price: val})} className="w-full bg-white px-3 py-2 rounded-xl text-sm border font-black italic font-bold" /></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* PERSONEL YÖNETİMİ */}
                        {activeTab === 'personnel' && (
                            <div className="max-w-6xl mx-auto space-y-6 animate-up font-bold">
                                <div className="flex justify-between items-center mb-10 bg-slate-950 p-6 md:p-8 rounded-3xl border-b-8 border-amber-500 shadow-2xl font-bold">
                                    <h2 className="text-white font-black text-xl md:text-2xl uppercase tracking-widest laos-gradient-text italic font-bold">Ekip Yönetimi</h2>
                                    <button onClick={() => getCol('personnel').add({name: 'Yeni Personel', fixedSalary: 50000})} className="gold-bg text-slate-950 px-10 py-5 rounded-2xl font-black text-xs uppercase shadow-xl italic font-bold">PERSONEL EKLE</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 font-bold font-bold font-bold font-bold">
                                    {personnel.map(p => {
                                        const paid = personnelPayments.filter(pay => pay.personnelId === p.id).reduce((s, pay) => s + Number(pay.amount || 0), 0);
                                        const bal = Number(p.fixedSalary || 0) - paid;
                                        return (
                                            <div key={p.id} onClick={() => setSelectedPersonnelId(p.id)} className="white-card p-8 group cursor-pointer hover:border-amber-400 transition-all shadow-xl font-bold font-bold">
                                                <div className="flex justify-between items-start mb-6 font-bold font-bold font-bold font-bold"><div className="bg-slate-950 p-4 rounded-2xl text-amber-500 font-bold font-bold font-bold font-bold"><Icon name="user" size={24} /></div><button onClick={(e) => { e.stopPropagation(); triggerDelete('personnel', p.id); }} className="bg-red-50 text-red-500 px-3 py-1.5 rounded-lg text-[8px] font-black uppercase font-bold">SİL</button></div>
                                                <div><p className="font-black text-2xl uppercase tracking-tighter text-slate-800 mb-1 italic font-bold font-bold">{p.name}</p><p className={`text-[10px] font-black uppercase tracking-widest ${bal > 0 ? 'text-red-500' : 'text-green-500'} italic font-bold font-bold`}>BORÇ: {formatCurrency(bal)}</p></div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* ÖDEMELER / GİDERLER */}
                        {activeTab === 'payments' && (
                            <div className="max-w-4xl mx-auto space-y-6 md:space-y-8 animate-up font-bold">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-10 bg-slate-950 p-6 md:p-8 rounded-3xl border-b-8 border-amber-500 shadow-2xl gap-6 font-bold font-bold font-bold">
                                    <h2 className="text-white font-black text-xl md:text-2xl uppercase tracking-widest laos-gradient-text italic font-bold">Gider Planı</h2>
                                    <button onClick={() => getCol('scheduledPayments').add({label: 'Yeni Gider', amount: 0, status: 'pending', date: new Date().toISOString().split('T')[0]})} className="gold-bg text-slate-950 px-10 py-5 rounded-2xl font-black text-xs uppercase shadow-xl italic font-bold">GİDER EKLE</button>
                                </div>
                                {scheduledPayments.sort((a,b) => new Date(b.date) - new Date(a.date)).map(p => (
                                    <div key={p.id} className={`white-card p-6 md:p-10 flex flex-col md:flex-row justify-between items-center gap-6 transition-all ${p.status === 'paid' ? 'opacity-40 grayscale' : 'shadow-2xl border-l-8 border-red-500'} font-bold`}>
                                        <div className="flex-1 w-full space-y-4 font-bold"><DateInput value={p.date} onChange={(newDate) => getCol('scheduledPayments').doc(p.id).update({date: newDate})} /><input value={p.label} onChange={(e) => getCol('scheduledPayments').doc(p.id).update({label: e.target.value})} className="font-black text-2xl w-full uppercase border-none p-0 focus:ring-0 italic text-slate-800 font-bold" /><MoneyInput value={p.amount} onChange={(val) => getCol('scheduledPayments').doc(p.id).update({amount: val})} className="bg-transparent border-none p-0 font-black text-3xl font-bold font-bold" /></div>
                                        <div className="flex flex-col gap-2 font-bold font-bold"><button onClick={() => getCol('scheduledPayments').doc(p.id).update({status: p.status === 'paid' ? 'pending' : 'paid'})} className={`px-8 py-4 rounded-2xl font-black text-xs uppercase shadow-xl font-bold font-bold ${p.status === 'paid' ? 'bg-green-500 text-white' : 'bg-slate-950 text-white'}`}>{p.status === 'paid' ? 'ÖDENDİ' : 'ÖDEMEYİ YAP'}</button><button onClick={() => triggerDelete('scheduledPayments', p.id)} className="text-[9px] font-black uppercase text-red-400 hover:text-red-600 transition-all font-bold">SİL</button></div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
