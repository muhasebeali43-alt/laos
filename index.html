<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kafe Analiz | Laos Finansal Yönetim</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide İkon Kütüphanesi -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
        
        :root {
            --laos-gold: #f59e0b;
            --laos-dark: #0f172a;
            --laos-slate: #1e293b;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        .laos-hero-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 2rem;
            border-bottom: 8px solid var(--laos-gold);
        }

        @media (min-width: 768px) {
            .laos-hero-card { border-radius: 3.5rem; }
        }

        .gold-text { color: var(--laos-gold); } 
        .gold-bg { background-color: var(--laos-gold); }

        .white-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }
        
        @media (min-width: 768px) {
            .white-card { border-radius: 2.5rem; }
        }

        .nav-active {
            background-color: var(--laos-gold);
            color: #0f172a !important;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3);
        }

        input:focus, select:focus { outline: none; border-bottom: 2px solid var(--laos-gold); }
        
        .animate-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .date-input-font {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.05em;
        }

        .method-btn-active {
            background-color: #0f172a;
            color: #f59e0b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.2s ease-out;
            z-index: 2000;
        }

        .btn-delete-visible {
            background-color: #dc2626 !important;
            color: white !important;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .btn-delete-visible:hover {
            background-color: #b91c1c !important;
            transform: scale(1.1);
        }

        .sidebar-scroll {
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .sidebar-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDDzSjjk0N-k3QLIJQu8jHWxCDtgzvZ1lE",
            authDomain: "laos-61380.firebaseapp.com",
            projectId: "laos-61380",
            storageBucket: "laos-61380.appspot.com",
            messagingSenderId: "833439553703",
            appId: "1:833439553703:web:6f4a1c7969a7f7216fa382"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'cafe-pro-v1';

        const { useState, useEffect, useMemo } = React;

        const MATERIAL_UNITS = [
            { id: 'kg', label: 'Kilogram (kg)' },
            { id: 'lt', label: 'Litre (lt)' },
            { id: 'ad', label: 'Adet (ad)' },
            { id: 'mg', label: 'Miligram (mg)' },
            { id: 'paket', label: 'Paket (pkt)' }
        ];

        const PAYMENT_METHODS = [
            { id: 'nakit', label: 'Nakit', icon: 'banknote' },
            { id: 'kart', label: 'Kart', icon: 'credit-card' },
            { id: 'havale', label: 'Havale', icon: 'send' },
            { id: 'cek', label: 'Çek', icon: 'file-text' }
        ];

        const EXPENSE_CATEGORIES = [
            { id: 'malzeme', label: 'Malzeme Alımı', icon: 'shopping-cart', color: 'bg-orange-100 text-orange-600' },
            { id: 'kira', label: 'Kira', icon: 'home', color: 'bg-blue-100 text-blue-600' },
            { id: 'fatura', label: 'Fatura (Elek/Su/Gaz)', icon: 'zap', color: 'bg-yellow-100 text-yellow-600' },
            { id: 'pazarlama', label: 'Pazarlama / Reklam', icon: 'megaphone', color: 'bg-purple-100 text-purple-600' },
            { id: 'vergi', label: 'Vergi / Ödemeler', icon: 'file-text', color: 'bg-red-100 text-red-600' },
            { id: 'diger', label: 'Diğer / Çeşitli', icon: 'more-horizontal', color: 'bg-slate-100 text-slate-600' }
        ];

        const Icon = ({ name, size = 20, className = "" }) => {
            if (!window.lucide || !lucide.icons) return null;
            const camelName = name.split('-').map((word, index) => 
                index === 0 ? word : word.charAt(0).toUpperCase() + word.slice(1)
            ).join('');
            const iconData = lucide.icons[camelName] || lucide.icons[name];
            if (!iconData) return null;
            const [tag, attrs, children] = iconData;
            return React.createElement(
                'svg', { ...attrs, width: size, height: size, className: `lucide lucide-${name} ${className}`, xmlns: "http://www.w3.org/2000/svg" },
                children.map((child, i) => React.createElement(child[0], { ...child[1], key: i }))
            );
        };

        const formatNumber = (val) => {
            if (val === null || val === undefined || isNaN(val)) return "0";
            return new Intl.NumberFormat('tr-TR').format(val);
        };
        const formatCurrency = (val) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 0 }).format(val || 0);
        
        const dbToDisplay = (isoDate) => {
            if (!isoDate) return "";
            const parts = isoDate.split("-");
            return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : isoDate;
        };

        const displayToDb = (displayDate) => {
            const parts = displayDate.split(".");
            return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : null;
        };

        const calculateValorDate = (dateStr, days) => {
            if (!dateStr) return "";
            const date = new Date(dateStr);
            date.setDate(date.getDate() + (Number(days) || 0));
            return date.toISOString().split('T')[0];
        };

        const DateInput = ({ value, onChange, className = "" }) => {
            const [localVal, setLocalVal] = useState(dbToDisplay(value));
            useEffect(() => { setLocalVal(dbToDisplay(value)); }, [value]);
            const handleChange = (e) => {
                let v = e.target.value.replace(/[^0-9]/g, '');
                if (v.length > 8) v = v.substring(0, 8);
                let formatted = v;
                if (v.length > 2) formatted = v.substring(0, 2) + '.' + v.substring(2);
                if (v.length > 4) formatted = formatted.substring(0, 5) + '.' + formatted.substring(5);
                setLocalVal(formatted);
                if (v.length === 8) {
                    const dbVal = displayToDb(formatted);
                    if (dbVal) onChange(dbVal);
                }
            };
            return (
                <div className="flex items-center gap-2 relative w-full md:w-auto">
                    <div className="relative p-2 bg-slate-100 rounded-lg cursor-pointer">
                        <Icon name="calendar" size={16} className="text-amber-500 pointer-events-none" />
                        <input type="date" value={value || ""} onChange={(e) => e.target.value && onChange(e.target.value)} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
                    </div>
                    <input type="text" value={localVal || ""} onChange={handleChange} maxLength={10} placeholder="GG.AA.YYYY" className={`bg-transparent date-input-font border-none focus:ring-0 p-0 text-xs italic w-24 ${className}`} />
                </div>
            );
        };

        const MoneyInput = ({ value, onChange, className = "", placeholder = "0" }) => {
            const [display, setDisplay] = useState(formatNumber(value));
            useEffect(() => { setDisplay(formatNumber(value)); }, [value]);
            const handleChange = (e) => {
                const raw = e.target.value.replace(/[^0-9]/g, '');
                const numValue = raw ? parseInt(raw, 10) : 0;
                setDisplay(formatNumber(numValue));
                onChange(numValue);
            };
            return <input type="text" inputMode="numeric" value={(display === "0" && placeholder !== "0") ? "" : (display || "")} onChange={handleChange} placeholder={placeholder} className={className} />;
        };

        const MethodSelector = ({ value, onChange }) => (
            <div className="flex bg-slate-100 p-1 rounded-xl w-full md:w-fit overflow-x-auto no-scrollbar border font-black">
                {PAYMENT_METHODS.map(m => (
                    <button key={m.id} onClick={() => onChange(m.id)} className={`flex-1 md:flex-none flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-[10px] font-black uppercase transition-all whitespace-nowrap ${value === m.id ? 'method-btn-active' : 'text-slate-400 hover:bg-slate-200'}`}>
                        <Icon name={m.icon} size={14} /> <span>{m.label}</span>
                    </button>
                ))}
            </div>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [recipeSubTab, setRecipeSubTab] = useState('products'); 
            const [personnelFilter, setPersonnelFilter] = useState('active'); 
            const [loading, setLoading] = useState(true);
            const [reportRange, setReportRange] = useState('monthly');
            const [customStartDate, setCustomStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [customEndDate, setCustomEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedPersonnelId, setSelectedPersonnelId] = useState(null);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [showDeleteModal, setShowDeleteModal] = useState({ show: false, col: '', id: '' });
            const [historyFilter, setHistoryFilter] = useState('all');

            const [settings, setSettings] = useState({ initialBalance: 0, defaultCommission: 3.5, valorDays: 1 });
            const [dailyLogs, setDailyLogs] = useState([]);
            const [scheduledPayments, setScheduledPayments] = useState([]);
            const [personnel, setPersonnel] = useState([]);
            const [personnelPayments, setPersonnelPayments] = useState([]);
            const [materials, setMaterials] = useState([]);
            const [products, setProducts] = useState([]);

            useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (u) {
                        const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                        baseRef.collection('config').doc('app_settings').onSnapshot(d => {
                            if (d.exists) {
                                const data = d.data();
                                setSettings({
                                    initialBalance: data.initialBalance ?? 0,
                                    defaultCommission: data.defaultCommission ?? 3.5,
                                    valorDays: data.valorDays ?? 1
                                });
                            }
                        });
                        baseRef.collection('dailyLogs').onSnapshot(s => setDailyLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('scheduledPayments').onSnapshot(s => setScheduledPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('personnel').onSnapshot(s => setPersonnel(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('personnelPayments').onSnapshot(s => setPersonnelPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('materials').onSnapshot(s => setMaterials(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('products').onSnapshot(s => setProducts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        setLoading(false);
                    } else {
                        auth.signInAnonymously().catch(console.error);
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            const getCol = (c) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(c);

            const saveSetting = async (field, val) => {
                const newSettings = { ...settings, [field]: val };
                setSettings(newSettings);
                await getCol('config').doc('app_settings').set(newSettings, { merge: true });
            };

            const calculateProductCost = (p) => {
                if (!p.ingredients || p.ingredients.length === 0) return 0;
                return p.ingredients.reduce((total, ing) => {
                    const mat = materials.find(m => m.id === ing.materialId);
                    if (!mat) return total;
                    let divisor = (mat.unit === 'kg' || mat.unit === 'lt') ? 1000 : 1;
                    return total + ((Number(mat.price || 0) / divisor) * Number(ing.quantity || 0));
                }, 0);
            };

            const allTransactions = useMemo(() => {
                const logs = dailyLogs.map(l => ({ id: l.id, date: l.date, label: 'Kasa Satışı', amount: Number(l.cash || 0) + Number(l.card || 0), type: 'income', category: 'Ciro', method: 'nakit/pos', col: 'dailyLogs' }));
                const loans = dailyLogs.filter(l => Number(l.dailyLoan) > 0).map(l => ({ id: l.id + '_loan', date: l.date, label: 'Kredi Girişi', amount: Number(l.dailyLoan), type: 'income', category: 'Kredi', method: 'nakit', col: 'dailyLogs' }));
                const bills = scheduledPayments.filter(p => p.status === 'paid').map(p => ({ id: p.id, date: p.date, label: p.label, amount: Number(p.amount), type: 'expense', category: EXPENSE_CATEGORIES.find(c => c.id === p.category)?.label || 'Gider', method: p.method || 'nakit', col: 'scheduledPayments' }));
                const staff = personnelPayments.map(p => ({ id: p.id, date: p.date, label: `Maaş: ${personnel.find(per => per.id === p.personnelId)?.name || 'Personel'}`, amount: Number(p.amount), type: 'expense', category: 'Maaş', method: p.method || 'nakit', col: 'personnelPayments' }));
                const combined = [...logs, ...loans, ...bills, ...staff].sort((a, b) => new Date(b.date) - new Date(a.date));
                return historyFilter === 'income' ? combined.filter(t => t.type === 'income') : historyFilter === 'expense' ? combined.filter(t => t.type === 'expense') : combined;
            }, [dailyLogs, scheduledPayments, personnelPayments, personnel, historyFilter]);

            const globalStats = useMemo(() => {
                const logs = dailyLogs.reduce((acc, log) => {
                    const commRate = settings.defaultCommission || 3.5;
                    const commissionAmt = (Number(log.card || 0) * commRate) / 100;
                    const netCard = Number(log.card || 0) - commissionAmt;
                    return { 
                        loan: acc.loan + Number(log.dailyLoan || 0), 
                        cash: acc.cash + Number(log.cash || 0), 
                        card: acc.card + Number(log.card || 0), 
                        pending: acc.pending + (log.posStatus === 'bankada' ? 0 : netCard) 
                    };
                }, { loan: 0, cash: 0, card: 0, pending: 0 });
                const billsPaid = scheduledPayments.filter(p => p.status === 'paid').reduce((s, p) => s + Number(p.amount), 0);
                const staffPaid = personnelPayments.reduce((s, p) => s + Number(p.amount || 0), 0);
                const commTotal = (logs.card * (settings.defaultCommission || 3.5)) / 100;
                const netCash = Number(settings.initialBalance || 0) + logs.cash + (logs.card - commTotal - logs.pending) + logs.loan - (staffPaid + billsPaid);
                const upcoming = scheduledPayments.filter(p => p.status !== 'paid').sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0, 5);
                return { ...logs, billsPaid, staffPaid, netCash, upcoming };
            }, [dailyLogs, scheduledPayments, personnelPayments, settings]);

            const reportAnalysis = useMemo(() => {
                const now = new Date();
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
                const filterItems = (arr) => {
                    if (reportRange === 'daily') return arr.filter(x => x.date === now.toISOString().split('T')[0]);
                    if (reportRange === 'monthly') return arr.filter(x => x.date >= startOfMonth);
                    return arr.filter(x => x.date >= customStartDate && x.date <= customEndDate);
                };
                const logs = filterItems([...dailyLogs]);
                const pPays = filterItems([...personnelPayments]);
                const bills = filterItems([...scheduledPayments].filter(p => p.status === 'paid'));
                
                const totals = { 
                    income: 0, 
                    expense: 0, 
                    breakdown: { personnel: 0, malzeme: 0, kira: 0, fatura: 0, pazarlama: 0, vergi: 0, diger: 0, pos_komisyon: 0 } 
                };

                logs.forEach(l => {
                    const dailyGross = (Number(l.cash || 0) + Number(l.card || 0));
                    totals.income += dailyGross;
                    
                    // Dönemlik POS Komisyonu hesaplama
                    const commRate = settings.defaultCommission || 3.5;
                    const commAmt = (Number(l.card || 0) * commRate) / 100;
                    totals.expense += commAmt;
                    totals.breakdown.pos_komisyon += commAmt;
                });

                pPays.forEach(p => { const amt = Number(p.amount || 0); totals.expense += amt; totals.breakdown.personnel += amt; });
                bills.forEach(p => { 
                    const amt = Number(p.amount || 0); 
                    totals.expense += amt; 
                    const cat = p.category || 'diger'; 
                    if(totals.breakdown[cat] !== undefined) totals.breakdown[cat] += amt; 
                    else totals.breakdown.diger += amt; 
                });
                return totals;
            }, [dailyLogs, personnelPayments, scheduledPayments, reportRange, customStartDate, customEndDate, settings.defaultCommission]);

            const triggerDelete = (col, id) => setShowDeleteModal({ show: true, col, id });
            const confirmDelete = async () => {
                const { col, id } = showDeleteModal;
                if (!col || !id) return;
                try {
                    if (id.endsWith('_loan')) await getCol('dailyLogs').doc(id.replace('_loan', '')).update({ dailyLoan: 0 });
                    else await getCol(col).doc(id).delete();
                } catch (e) { console.error(e); }
                setShowDeleteModal({ show: false, col: '', id: '' });
            };

            const addPersonnel = async () => await getCol('personnel').add({ name: 'Yeni Personel', type: 'Tam Zamanlı', fixedSalary: 0, hourlyRate: 0, hoursWorked: 0, status: 'active' });
            const addScheduledPayment = async () => await getCol('scheduledPayments').add({ label: 'Yeni Gider', amount: 0, status: 'pending', method: 'nakit', category: 'malzeme', date: new Date().toISOString().split('T')[0] });
            const addPersonnelPayment = async (pId) => await getCol('personnelPayments').add({ personnelId: pId, date: new Date().toISOString().split('T')[0], amount: 0, method: 'nakit' });

            if (loading) return <div className="min-h-screen bg-slate-900 flex items-center justify-center text-white font-black uppercase italic animate-pulse p-10 text-center">Kafe Analiz Yükleniyor...</div>;

            return (
                <div className="min-h-screen flex bg-[#F1F5F9] font-bold">
                    {/* SİLME MODALI */}
                    {showDeleteModal.show && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white rounded-[2rem] p-10 max-w-sm w-full shadow-2xl animate-up text-center border">
                                <div className="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="trash-2" size={40} /></div>
                                <h3 className="text-xl font-black text-slate-900 mb-2 uppercase italic">Emin Misiniz?</h3>
                                <p className="text-xs text-slate-400 mb-8 font-black uppercase italic">Veritabanından kalıcı olarak silinecektir.</p>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowDeleteModal({show:false, col:'', id:''})} className="flex-1 py-4 rounded-2xl bg-slate-100 text-slate-400 font-black text-xs uppercase italic">Vazgeç</button>
                                    <button onClick={confirmDelete} className="flex-1 py-4 rounded-2xl bg-red-600 text-white font-black text-xs uppercase shadow-xl italic">Sil</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SOL DİKEY NAVİGASYON */}
                    <nav className="fixed left-0 top-0 bottom-0 w-16 md:w-64 bg-slate-950 text-white flex flex-col items-center md:items-stretch py-4 md:p-6 z-50 shadow-2xl sidebar-scroll">
                        <div className="flex items-center justify-center md:justify-start gap-3 mb-8 md:mb-12 px-1">
                            <div className="w-8 h-8 md:w-10 md:h-10 gold-bg rounded-xl md:rounded-2xl flex items-center justify-center text-slate-900 font-black italic shadow-[0_0_15px_#f59e0b]">L</div>
                            <h2 className="hidden md:block font-black text-xl italic tracking-tighter uppercase gold-text">Kafe Analiz</h2>
                        </div>
                        
                        <div className="flex flex-col gap-2 w-full">
                            {[
                                {id:'dashboard', icon:'layout-dashboard', l:'Özet'},
                                {id:'daily', icon:'calendar-days', l:'Günlük'},
                                {id:'transactions', icon:'history', l:'İşlemler'},
                                {id:'pos', icon:'credit-card', l:'POS Takip'},
                                {id:'recipe', icon:'chef-hat', l:'Reçeteler'},
                                {id:'personnel', icon:'users', l:'Personel'},
                                {id:'payments', icon:'receipt', l:'Ödemeler'},
                                {id:'reports', icon:'bar-chart-3', l:'Analiz'}
                            ].map(t => (
                                <button key={t.id} onClick={() => {setActiveTab(t.id); setSelectedPersonnelId(null); setSelectedProductId(null);}} 
                                    className={`w-full flex flex-col md:flex-row items-center gap-1 md:gap-3 p-3 md:p-4 rounded-xl md:rounded-2xl transition-all ${activeTab === t.id ? 'nav-active' : 'text-slate-500 hover:bg-white/5 font-bold'}`}>
                                    <Icon name={t.icon} size={22} className={activeTab === t.id ? 'text-slate-900' : 'text-slate-500'} /> 
                                    <span className="text-[7px] md:text-[11px] font-black uppercase tracking-widest text-center md:text-left font-bold">{t.l}</span>
                                </button>
                            ))}
                        </div>
                    </nav>

                    <main className="flex-1 ml-16 md:ml-64 p-4 md:p-12 overflow-y-auto no-scrollbar">
                        {/* ÖZET SAYFASI */}
                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-8 animate-up">
                                <header className="flex items-center gap-4"><div className="w-2 h-10 gold-bg rounded-full"></div><h1 className="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter italic uppercase">Finansal Durum</h1></header>
                                <div className="laos-hero-card p-6 md:p-16 text-white shadow-2xl relative overflow-hidden font-bold">

                                        <header className="flex flex-col md:flex-row justify-between items-center gap-8 font-bold"><div className="flex items-center gap-4 font-black"><div className="w-2 h-12 gold-bg rounded-full shadow-[0_0_20px_#f59e0b]"></div><h2 className="text-3xl md:text-5xl font-black text-slate-900 uppercase italic tracking-tighter">Ekip Yönetimi</h2></div><div className="flex bg-slate-950 p-2 rounded-full border border-slate-800 shadow-2xl font-bold overflow-x-auto no-scrollbar max-w-full">{[{id: 'active', label: 'AKTİF KADRO'}, {id: 'resigned', label: 'AYRILANLAR'}].map(f => (<button key={f.id} onClick={() => setPersonnelFilter(f.id)} className={`px-6 md:px-10 py-4 rounded-full text-[9px] md:text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap ${personnelFilter === f.id ? 'gold-bg text-slate-900 shadow-xl' : 'text-slate-500 hover:text-slate-200'}`}>{f.label}</button>))}</div></header>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{personnelFilter === 'active' && (<button onClick={addPersonnel} className="bg-white border-4 border-dashed border-slate-200 rounded-3xl p-8 flex flex-col items-center justify-center text-slate-300 hover:text-amber-500 hover:border-amber-200 font-bold group"><Icon name="user-plus" size={48} className="mb-2 group-hover:scale-110 transition-transform" /><p className="font-black uppercase italic tracking-widest text-sm text-center">YENİ PERSONEL EKLE</p></button>)}{(personnel || []).filter(p => (personnelFilter === 'active' ? (p.status !== 'resigned') : (p.status === 'resigned'))).map(p => { const myPays = personnelPayments.filter(pay => pay.personnelId === p.id); const totalPaid = myPays.reduce((s, pay) => s + Number(pay.amount || 0), 0); const totalSalary = p.type === 'Part-Time' ? (Number(p.hourlyRate || 0) * Number(p.hoursWorked || 0)) : Number(p.fixedSalary || 0); const balance = totalSalary - totalPaid; return (<div key={p.id} onClick={() => setSelectedPersonnelId(p.id)} className={`white-card p-6 md:p-10 group cursor-pointer hover:border-amber-400 transition-all shadow-xl font-bold relative overflow-hidden ${p.status === 'resigned' ? 'opacity-70 grayscale bg-slate-50' : ''}`}><button onClick={(e) => { e.stopPropagation(); triggerDelete('personnel', p.id); }} className="absolute top-4 right-4 btn-delete-visible p-2.5 rounded-xl shadow-lg transition-all"><Icon name="trash-2" size={16} /></button><div className={`p-4 rounded-2xl shadow-lg w-fit mb-6 ${p.status === 'resigned' ? 'bg-slate-200 text-slate-500' : 'bg-slate-900 text-amber-500'}`}><Icon name="user" size={28} /></div><p className="font-black text-xl md:text-2xl uppercase tracking-tighter text-slate-800 mb-2 italic truncate pr-10" title={p.name}>{p.name || "İsimsiz Personel"}</p><div className="flex justify-between items-center border-t pt-4"><div><p className="text-[9px] text-slate-400 uppercase italic">Kalan Alacak</p><p className={`font-black text-sm italic ${balance > 0 ? 'text-red-500' : 'text-emerald-500'}`}>{formatCurrency(balance)}</p></div><div className="text-right"><p className="text-[8px] text-slate-400 uppercase italic">{p.type || "Belirtilmedi"}</p>{p.status === 'resigned' && <span className="bg-red-100 text-red-600 px-3 py-1 rounded-full text-[9px] font-black uppercase italic">AYRILDI</span>}</div></div></div>); })}</div>
                                    </>
                                ) : (
                                    <div className="space-y-8 animate-up"><button onClick={() => setSelectedPersonnelId(null)} className="flex items-center gap-2 text-[10px] font-black text-slate-400 hover:text-slate-900 uppercase italic tracking-widest"><Icon name="chevron-left" size={16} /> LİSTEYE DÖN</button>{(personnel || []).filter(p => p.id === selectedPersonnelId).map(p => { const myPays = personnelPayments.filter(pay => pay.personnelId === p.id).sort((a,b) => new Date(b.date) - new Date(a.date)); const totalPaid = myPays.reduce((s, pay) => s + Number(pay.amount || 0), 0); const totalSalary = p.type === 'Part-Time' ? (Number(p.hourlyRate || 0) * Number(p.hoursWorked || 0)) : Number(p.fixedSalary || 0); return (<div key={p.id} className={`white-card p-6 md:p-12 shadow-2xl border-t-[12px] font-bold overflow-hidden ${p.status === 'resigned' ? 'border-red-500' : 'border-slate-900'}`}><div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-8"><div className="flex-1 w-full"><input value={p.name ?? ""} onChange={(e) => getCol('personnel').doc(p.id).update({name: e.target.value})} className="text-3xl md:text-4xl font-black border-none p-0 focus:ring-0 w-full text-slate-800 uppercase italic" /></div><div className="flex bg-slate-100 p-1 rounded-2xl w-full md:w-fit font-black border uppercase italic shadow-inner">{['Tam Zamanlı', 'Part-Time'].map(type => (<button key={type} onClick={() => getCol('personnel').doc(p.id).update({type: type})} className={`flex-1 px-6 py-3 rounded-xl text-[10px] transition-all whitespace-nowrap ${p.type === type ? 'bg-slate-900 text-amber-500 shadow-md scale-105' : 'text-slate-400 hover:text-slate-600'}`}>{type}</button>))}</div></div><div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10"><div className="bg-slate-50 p-6 md:p-8 rounded-[2rem] flex flex-col justify-between border shadow-sm"><p className="text-[10px] font-black text-slate-400 uppercase italic mb-2 tracking-widest">{p.type === 'Tam Zamanlı' ? 'AYLIK MAAŞ' : 'SAATLİK ÜCRET'}</p><div className="flex items-center gap-2 font-black text-2xl md:text-3xl italic"><span>₺</span><MoneyInput value={(p.type === 'Tam Zamanlı' ? p.fixedSalary : p.hourlyRate) || 0} onChange={(val) => getCol('personnel').doc(p.id).update(p.type === 'Tam Zamanlı' ? {fixedSalary: val} : {hourlyRate: val})} className="bg-transparent border-none p-0 w-full focus:ring-0 font-black italic" /></div></div>{p.type === 'Part-Time' && (<div className="bg-slate-50 p-6 md:p-8 rounded-[2rem] flex flex-col justify-between border shadow-sm"><p className="text-[10px] font-black text-slate-400 uppercase italic mb-2 tracking-widest">TOPLAM ÇALIŞILAN SAAT</p><div className="flex items-center gap-2 font-black text-2xl md:text-3xl italic"><input type="number" value={p.hoursWorked ?? 0} onChange={(e) => getCol('personnel').doc(p.id).update({hoursWorked: Number(e.target.value)})} className="bg-transparent border-none p-0 w-full focus:ring-0 font-black italic" /></div></div>)}<div className={`p-6 md:p-8 rounded-[2rem] border shadow-sm flex flex-col justify-between ${totalSalary - totalPaid > 0 ? 'bg-red-50 border-red-100' : 'bg-emerald-50 border-emerald-100'}`}><p className="text-[10px] font-black uppercase italic mb-2 tracking-widest">GÜNCEL KALAN ALACAK</p><p className="font-black text-2xl md:text-3xl italic leading-none">{formatCurrency(totalSalary - totalPaid)}</p></div></div><div className="flex flex-col md:flex-row justify-between items-center bg-slate-900 p-8 rounded-[2.5rem] mb-10 gap-6 shadow-xl border-b-4 border-amber-500"><div><h4 className="text-white font-black uppercase italic tracking-widest text-sm mb-1">PERSONEL DURUMU</h4><p className="text-slate-400 text-[10px] uppercase font-bold italic tracking-wider">Ayrılan personelin eski kayıtları sistemde saklanır.</p></div><div className="flex bg-slate-800 p-1 rounded-2xl border border-slate-700 w-full md:w-auto">{['active', 'resigned'].map(status => (<button key={status} onClick={() => getCol('personnel').doc(p.id).update({status: status})} className={`flex-1 md:flex-none px-8 py-3 rounded-xl text-[10px] font-black uppercase italic transition-all ${p.status === status ? (status === 'resigned' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white') : 'text-slate-500 hover:text-white'}`}>{status === 'active' ? 'AKTİF ÇALIŞAN' : 'İŞTEN AYRILDI'}</button>))}</div></div><div className="space-y-6"><div className="flex justify-between items-center px-2"><h3 className="text-lg font-black uppercase italic flex items-center gap-3"><Icon name="receipt" className="text-amber-500" /> Ödeme Kayıtları</h3><button onClick={() => addPersonnelPayment(p.id)} className="bg-slate-950 text-white px-8 py-3 rounded-xl text-[10px] font-black uppercase italic shadow-xl hover:scale-105 active:scale-95 transition-all tracking-widest">+ YENİ ÖDEME EKLE</button></div>{myPays.map(pay => (<div key={pay.id} className="flex flex-col md:flex-row md:items-center justify-between gap-6 bg-white p-6 rounded-3xl border shadow-md transition-all hover:border-slate-300 group"><div className="flex flex-col md:flex-row items-start md:items-center gap-6 md:gap-10 w-full"><DateInput value={pay.date || ""} onChange={(val) => getCol('personnelPayments').doc(pay.id).update({date: val})} /><div className="flex items-center gap-2 font-black text-xl md:text-2xl italic text-slate-900 bg-slate-50 px-4 py-2 rounded-2xl border border-slate-100">₺<MoneyInput value={pay.amount || 0} onChange={(v) => getCol('personnelPayments').doc(pay.id).update({amount: v})} className="bg-transparent border-none p-0 w-32 focus:ring-0 font-black italic" /></div><MethodSelector value={pay.method || 'nakit'} onChange={(val) => getCol('personnelPayments').doc(pay.id).update({method: val})} /></div><button onClick={() => triggerDelete('personnelPayments', pay.id)} className="btn-delete-visible p-3.5 rounded-xl md:opacity-0 group-hover:opacity-100 transition-all shadow-lg"><Icon name="trash-2" size={20} /></button></div>))}</div></div>); })}</div>
                                )}
                            </div>
                        )}

                        {/* ÖDEMELER */}
                        {activeTab === 'payments' && (
                            <div className="max-w-4xl mx-auto space-y-8 animate-up font-bold">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-6 bg-slate-950 p-6 md:p-10 rounded-[2rem] border-b-8 border-amber-500 shadow-2xl"><h2 className="text-white font-black text-xl md:text-2xl uppercase tracking-widest gold-text italic">Gider Planı</h2><button onClick={addScheduledPayment} className="gold-bg text-slate-950 px-10 py-5 rounded-2xl font-black text-xs uppercase shadow-xl italic tracking-widest">YENİ GİDER EKLE</button></div>{(scheduledPayments || []).sort((a,b) => new Date(b.date) - new Date(a.date)).map(p => (<div key={p.id} className={`white-card p-6 md:p-10 flex flex-col md:flex-row justify-between items-center gap-8 transition-all overflow-hidden ${p.status === 'paid' ? 'opacity-40 grayscale' : 'shadow-2xl border-l-[12px] border-red-500'}`}><div className="flex-1 w-full space-y-6 font-bold min-w-0"><div className="flex flex-wrap justify-between items-center gap-4"><DateInput value={p.date || ""} onChange={(val) => getCol('scheduledPayments').doc(p.id).update({date: val})} /><MethodSelector value={p.method || 'nakit'} onChange={(val) => getCol('scheduledPayments').doc(p.id).update({method: val})} /></div><div className="flex flex-col md:flex-row md:items-center gap-4 min-w-0"><select value={p.category ?? "diger"} onChange={(e) => getCol('scheduledPayments').doc(p.id).update({category: e.target.value})} className="bg-slate-100 p-2 rounded-xl text-[10px] font-black uppercase border-none focus:ring-0 w-fit flex-shrink-0">{EXPENSE_CATEGORIES.map(cat => <option key={cat.id} value={cat.id}>{cat.label}</option>)}</select><input value={p.label ?? ""} onChange={(e) => getCol('scheduledPayments').doc(p.id).update({label: e.target.value})} className="font-black text-xl md:text-2xl w-full uppercase border-none p-0 focus:ring-0 italic text-slate-800 truncate" /></div><div className="flex items-center gap-2 font-black text-2xl md:text-3xl text-red-600 italic"><span>₺</span><MoneyInput value={p.amount || 0} onChange={(v) => getCol('scheduledPayments').doc(p.id).update({amount: v})} className="bg-transparent border-none p-0 focus:ring-0 font-black italic" /></div></div><div className="flex flex-col gap-4 w-full md:w-auto items-center flex-shrink-0"><button onClick={() => getCol('scheduledPayments').doc(p.id).update({status: p.status === 'paid' ? 'pending' : 'paid'})} className={`w-full px-10 py-4 rounded-2xl font-black text-[11px] uppercase shadow-lg italic tracking-widest ${p.status === 'paid' ? 'bg-emerald-500 text-white' : 'bg-slate-950 text-white'}`}>{p.status === 'paid' ? 'ÖDENDİ' : 'ÖDEMEYİ YAP'}</button><button onClick={() => triggerDelete('scheduledPayments', p.id)} className="btn-delete-visible p-3 rounded-xl shadow-md"><Icon name="trash-2" size={20} /></button></div></div>))}
                            </div>
                        )}

                        {/* ANALİZ */}
                        {activeTab === 'reports' && (
                            <div className="max-w-5xl mx-auto space-y-8 animate-up font-bold pb-20">
                                <header className="flex flex-col md:flex-row justify-between items-center gap-6"><div className="flex items-center gap-4 font-black"><div className="w-2 h-10 gold-bg rounded-full"></div><h2 className="text-2xl md:text-3xl font-black text-slate-900 uppercase italic tracking-tighter">İşletme Analizi</h2></div><div className="flex bg-slate-900 p-1.5 rounded-full border border-slate-800 shadow-xl overflow-x-auto no-scrollbar max-w-full">{['daily', 'monthly', 'custom'].map(r => (<button key={r} onClick={() => setReportRange(r)} className={`px-6 md:px-8 py-3 rounded-full text-[9px] font-black uppercase tracking-widest transition-all whitespace-nowrap ${reportRange === r ? 'gold-bg text-slate-900 shadow-lg' : 'text-slate-500'}`}>{r === 'daily' ? 'BUGÜN' : r === 'monthly' ? 'BU AY' : 'ARALIK'}</button>))}</div></header>
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6"><div className="white-card p-6 border-l-[12px] border-emerald-500 shadow-xl flex flex-col justify-center"><p className="text-[10px] font-black text-slate-400 uppercase italic mb-1 tracking-widest text-center md:text-left">HASILAT</p><p className="text-lg md:text-2xl font-black text-slate-900 italic text-center md:text-left">{formatCurrency(reportAnalysis.income)}</p></div><div className="white-card p-6 border-l-[12px] border-red-500 shadow-xl flex flex-col justify-center"><p className="text-[10px] font-black text-slate-400 uppercase italic mb-1 tracking-widest text-center md:text-left">GİDER</p><p className="text-lg md:text-2xl font-black text-red-600 italic text-center md:text-left">{formatCurrency(reportAnalysis.expense)}</p></div><div className="laos-hero-card p-6 flex flex-col justify-center shadow-xl"><p className="text-[10px] font-black text-slate-500 uppercase italic mb-1 tracking-widest text-center md:text-left">KÂR</p><p className={`text-lg md:text-2xl font-black italic text-center md:text-left ${reportAnalysis.income - reportAnalysis.expense >= 0 ? 'gold-text' : 'text-red-400'}`}>{formatCurrency(reportAnalysis.income - reportAnalysis.expense)}</p></div><div className="white-card p-6 border-l-[12px] border-blue-500 shadow-xl flex flex-col justify-center"><p className="text-[10px] font-black text-slate-400 uppercase italic mb-1 tracking-widest text-center md:text-left">MARJ</p><p className="text-lg md:text-2xl font-black text-blue-600 italic text-center md:text-left">%{reportAnalysis.income > 0 ? (((reportAnalysis.income - reportAnalysis.expense) / reportAnalysis.income) * 100).toFixed(0) : 0}</p></div></div>
                                <div className="white-card p-6 md:p-10 shadow-2xl space-y-8 border-t-[15px] border-slate-950"><h3 className="text-xl md:text-2xl font-black text-slate-800 uppercase italic border-b pb-6 flex items-center gap-4"><Icon name="bar-chart-3" className="text-amber-500" size={32} /> Harcama Analiz Kırılımı</h3><div className="space-y-6">{[
                                    { id: 'personnel', label: 'Personel Maaşları', val: reportAnalysis.breakdown.personnel, icon: 'users', color: 'bg-indigo-50 text-indigo-600 border-indigo-100' }, 
                                    { id: 'pos_komisyon', label: 'POS Komisyon Gideri', val: reportAnalysis.breakdown.pos_komisyon, icon: 'percent', color: 'bg-amber-50 text-amber-600 border-amber-100' },
                                    ...EXPENSE_CATEGORIES.map(cat => ({ id: cat.id, label: cat.label, val: reportAnalysis.breakdown[cat.id], icon: cat.icon, color: `${cat.color} border-slate-100` }))
                                ].filter(i => i.val > 0).map(item => (<div key={item.id} className={`p-5 md:p-6 rounded-3xl border-2 transition-all hover:scale-[1.01] ${item.color}`}><div className="flex justify-between items-center mb-3"><div className="flex items-center gap-4 font-black uppercase italic text-xs md:text-sm tracking-[0.2em]"><div className="p-2 bg-white/50 rounded-xl shadow-sm"><Icon name={item.icon} size={20} /></div><span>{item.label}</span></div><div className="text-right"><span className="text-xs md:text-base font-black italic bg-white/50 px-3 py-1 rounded-full border shadow-sm">%{reportAnalysis.expense > 0 ? ((item.val / reportAnalysis.expense) * 100).toFixed(1) : 0}</span></div></div><div className="w-full bg-black/5 h-4 rounded-full overflow-hidden mb-3 border shadow-inner"><div className="h-full bg-current shadow-[0_0_10px_currentColor]" style={{width: `${(item.val / (reportAnalysis.expense || 1)) * 100}%`}}></div></div><p className="text-xl md:text-3xl font-black italic text-right tracking-tighter leading-none">{formatCurrency(item.val)}</p></div>))}</div></div>
                            </div>
                        )}

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
