<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Analiz - Laos Özel Tasarım</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Modern Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, addDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        window.FB = { initializeApp, getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken, getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, addDoc, deleteDoc, query };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .laos-gradient-text {
            background: linear-gradient(to right, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .animate-up {
            animation: slideUp 0.4s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-[#F1F5F9]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { initializeApp, getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken, getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, addDoc, deleteDoc } = window.FB;

        // --- FİREBASE YAPILANDIRMASI ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cafe-pro-v1';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- YARDIMCI ARAÇLAR ---
        const toNum = (v) => {
            if (v === null || v === undefined || v === "") return 0;
            if (typeof v === 'number') return Math.floor(v);
            const clean = String(v).replace(/\./g, '').replace(/,/g, '');
            return parseInt(clean, 10) || 0;
        };

        const formatNumber = (val) => new Intl.NumberFormat('tr-TR').format(toNum(val));
        const formatCurrency = (val) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 0 }).format(toNum(val));
        const dbToDisplay = (isoDate) => isoDate ? isoDate.split("-").reverse().join(".") : "";

        const ALL_PAYMENT_METHODS = [
            { id: 'nakit', label: 'Nakit', color: 'bg-emerald-100 text-emerald-700' },
            { id: 'havale', label: 'Havale', color: 'bg-blue-100 text-blue-700' },
            { id: 'cek', label: 'Çek', color: 'bg-purple-100 text-purple-700' },
            { id: 'kart', label: 'Kart', color: 'bg-amber-100 text-amber-700' }
        ];

        // --- BİLEŞENLER ---
        const MoneyInput = ({ value, onChange, className = "", placeholder = "0" }) => {
            const [localValue, setLocalValue] = useState(formatNumber(value));
            const isFocused = useRef(false);

            useEffect(() => {
                if (!isFocused.current) setLocalValue(formatNumber(value));
            }, [value]);

            const handleChange = (e) => {
                const raw = e.target.value.replace(/[^0-9]/g, '');
                const numValue = raw ? parseInt(raw, 10) : 0;
                setLocalValue(formatNumber(numValue));
            };

            const handleBlur = () => {
                isFocused.current = false;
                onChange(toNum(localValue));
            };

            return (
                <input type="text" inputMode="numeric" value={localValue === "0" && placeholder !== "0" ? "" : localValue} 
                    onChange={handleChange} onFocus={() => { isFocused.current = true; }} onBlur={handleBlur}
                    placeholder={placeholder} className={`focus:ring-2 focus:ring-amber-500 outline-none ${className}`} 
                />
            );
        };

        const DateInput = ({ value, onChange, className = "" }) => {
            const [localVal, setLocalVal] = useState(dbToDisplay(value));
            useEffect(() => { setLocalVal(dbToDisplay(value)); }, [value]);

            return (
                <div className="flex items-center gap-1 relative">
                    <input type="date" value={value || ""} onChange={(e) => e.target.value && onChange(e.target.value)} 
                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" />
                    <span className="text-amber-500 text-[10px]">📅</span>
                    <span className={`bg-transparent p-0 text-[10px] font-bold w-20 ${className}`}>{localVal || "GG.AA.YYYY"}</span>
                </div>
            );
        };

        const MethodSelector = ({ value, onChange, className = "" }) => (
            <select value={value || 'nakit'} onChange={(e) => onChange(e.target.value)} 
                className={`bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[9px] font-bold uppercase text-slate-700 focus:ring-1 focus:ring-amber-500 cursor-pointer outline-none ${className}`}>
                {ALL_PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
            </select>
        );

        // --- ANA UYGULAMA ---
        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [recipeSubTab, setRecipeSubTab] = useState('inventory');
            const [loading, setLoading] = useState(true);
            const [settings, setSettings] = useState({ initialBalance: 0, defaultCommission: 3.5, defaultValor: 30 });
            const [dailyLogs, setDailyLogs] = useState([]);
            const [scheduledPayments, setScheduledPayments] = useState([]);
            const [personnel, setPersonnel] = useState([]);
            const [personnelPayments, setPersonnelPayments] = useState([]);
            const [inventory, setInventory] = useState([]);
            const [products, setProducts] = useState([]);
            const [selectedPersonnelId, setSelectedPersonnelId] = useState(null);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [showDeleteModal, setShowDeleteModal] = useState({ show: false, col: '', id: '' });
            const [reportRange, setReportRange] = useState('monthly');
            const [customStartDate, setCustomStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [customEndDate, setCustomEndDate] = useState(new Date().toISOString().split('T')[0]);

            // --- RULE 1: STRICT PATHS ---
            const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
            const getSettingsDoc = () => doc(db, 'artifacts', appId, 'public', 'data', 'config', 'app_settings');

            useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;

                const unsubSet = onSnapshot(getSettingsDoc(), (d) => d.exists() && setSettings(d.data()));
                const unsubLogs = onSnapshot(getColRef('dailyLogs'), (s) => setDailyLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubSched = onSnapshot(getColRef('scheduledPayments'), (s) => setScheduledPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubPers = onSnapshot(getColRef('personnel'), (s) => setPersonnel(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubPersPay = onSnapshot(getColRef('personnelPayments'), (s) => setPersonnelPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubInv = onSnapshot(getColRef('inventory'), (s) => setInventory(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubProd = onSnapshot(getColRef('products'), (s) => setProducts(s.docs.map(d => ({id: d.id, ...d.data()}))));

                setLoading(false);
                return () => { unsubSet(); unsubLogs(); unsubSched(); unsubPers(); unsubPersPay(); unsubInv(); unsubProd(); };
            }, [user]);

            const stats = useMemo(() => {
                const logsTotals = dailyLogs.reduce((acc, log) => {
                    const card = toNum(log.card);
                    const comm = (card * toNum(settings.defaultCommission || 3.5)) / 100;
                    return { loan: acc.loan + toNum(log.dailyLoan), cash: acc.cash + toNum(log.cash), card: acc.card + card, comm: acc.comm + comm };
                }, { loan: 0, cash: 0, card: 0, comm: 0 });

                const billsPaid = scheduledPayments.filter(p => p.status === 'paid').reduce((s, p) => s + toNum(p.amount), 0);
                const staffPaid = personnelPayments.reduce((s, p) => s + toNum(p.amount), 0);
                const netCash = toNum(settings.initialBalance) + logsTotals.cash + logsTotals.card + logsTotals.loan - (staffPaid + billsPaid + logsTotals.comm);
                const upcoming = scheduledPayments.filter(p => p.status !== 'paid').sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 4);

                return { ...logsTotals, billsPaid, staffPaid, netCash, upcoming };
            }, [dailyLogs, scheduledPayments, personnelPayments, settings]);

            const reportAnalysis = useMemo(() => {
                const now = new Date();
                const filterFn = (dStr) => {
                    const d = new Date(dStr);
                    if (reportRange === 'daily') return d.toDateString() === now.toDateString();
                    if (reportRange === 'monthly') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    if (reportRange === 'custom') return d >= new Date(customStartDate) && d <= new Date(customEndDate);
                    return true;
                };

                const fLogs = dailyLogs.filter(l => filterFn(l.date));
                const totalIn = fLogs.reduce((a, l) => a + toNum(l.cash) + toNum(l.card) + toNum(l.dailyLoan), 0);
                const staffEx = personnelPayments.filter(p => filterFn(p.date)).reduce((s, p) => s + toNum(p.amount), 0);
                const posEx = fLogs.reduce((s, l) => s + (toNum(l.card) * toNum(settings.defaultCommission) / 100), 0);
                const paidBills = scheduledPayments.filter(p => p.status === 'paid' && filterFn(p.date)).reduce((s, p) => s + toNum(p.amount), 0);
                const totalEx = staffEx + posEx + paidBills;
                
                return { totalIn, totalEx, profit: totalIn - totalEx, margin: totalIn > 0 ? ((totalIn - totalEx) / totalIn) * 100 : 0, staffEx, posEx };
            }, [dailyLogs, personnelPayments, scheduledPayments, reportRange, customStartDate, customEndDate, settings]);

            const calculateProductCost = (prod) => {
                if (!prod.ingredients) return 0;
                return prod.ingredients.reduce((total, ing) => {
                    const invItem = inventory.find(i => i.id === ing.id);
                    if (!invItem) return total;
                    const factor = (invItem.unit === 'kg' || invItem.unit === 'L') ? 1000 : 1;
                    return total + (toNum(invItem.price) / factor) * toNum(ing.amount);
                }, 0);
            };

            const confirmDelete = async () => {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', showDeleteModal.col, showDeleteModal.id));
                setShowDeleteModal({ show: false, col: '', id: '' });
            };

            if (loading) return <div className="h-screen bg-slate-950 flex items-center justify-center text-amber-500 font-black animate-pulse text-[10px] uppercase tracking-widest italic">Laos Connect...</div>;

            return (
                <div className="min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 bg-[#F1F5F9] font-sans text-slate-900 overflow-x-hidden">
                    
                    {/* SİLME MODALI */}
                    {showDeleteModal.show && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm z-[2000]">
                            <div className="bg-white rounded-[2rem] p-8 max-w-xs w-full shadow-2xl animate-up">
                                <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">🗑️</div>
                                <h3 className="text-xs font-black text-slate-900 mb-6 uppercase text-center italic">Bu kayıt silinsin mi?</h3>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowDeleteModal({show: false})} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-500 font-black text-[9px] uppercase italic">VAZGEÇ</button>
                                    <button onClick={confirmDelete} className="flex-1 py-3 rounded-xl bg-red-500 text-white font-black text-[9px] uppercase italic shadow-lg shadow-red-200">SİL</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* NAVİGASYON */}
                    <nav className="fixed bottom-0 left-0 right-0 md:relative md:w-20 lg:w-64 bg-slate-950 text-white p-2 md:p-4 flex md:flex-col justify-around md:justify-start gap-1 z-50 shadow-2xl">
                        <div className="hidden md:flex items-center gap-3 mb-10 px-2">
                            <div className="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center text-slate-950 font-black italic shadow-lg shadow-amber-500/20 text-xs">L</div>
                            <h2 className="hidden lg:block font-black text-sm italic uppercase tracking-tighter text-amber-500">Kafe Analiz</h2>
                        </div>
                        {[
                            {id:'dashboard', icon:'📊', l:'Özet'},
                            {id:'daily', icon:'📅', l:'Günlük'},
                            {id:'pos', icon:'💳', l:'POS'},
                            {id:'personnel', icon:'👥', l:'Ekip'},
                            {id:'payments', icon:'🧾', l:'Borçlar'},
                            {id:'recipes', icon:'📋', l:'Reçete'},
                            {id:'reports', icon:'📈', l:'Analiz'}
                        ].map(t => (
                            <button key={t.id} onClick={() => {setActiveTab(t.id); setSelectedPersonnelId(null); setSelectedProductId(null);}} 
                                className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2.5 rounded-xl transition-all flex-1 md:flex-none ${activeTab === t.id ? 'bg-amber-500 text-slate-950 font-black shadow-lg shadow-amber-500/20' : 'text-slate-500 hover:text-slate-200'}`}>
                                <span className="text-base">{t.icon}</span> 
                                <span className="text-[7px] lg:text-[10px] font-black uppercase tracking-tight text-center lg:text-left italic">{t.l}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-3 md:p-10 lg:p-14 overflow-y-auto max-w-full">
                        
                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-up">
                                <header className="flex items-center gap-2"><div className="w-1.5 h-6 bg-amber-500 rounded-full"></div><h1 className="text-xl md:text-3xl font-black text-slate-900 uppercase italic">İşletme Durumu</h1></header>
                                <div className="bg-slate-950 rounded-[2.5rem] p-6 md:p-12 text-white shadow-2xl border-b-[8px] border-amber-500 relative overflow-hidden">
                                    <div className="relative z-10">
                                        <p className="text-[9px] md:text-[11px] font-bold text-slate-500 uppercase mb-2 tracking-[0.3em] italic">💰 Mevcut Nakit Gücü</p>
                                        <h2 className="text-3xl md:text-6xl font-black text-amber-500 tracking-tighter mb-10 italic break-words">{formatCurrency(stats.netCash)}</h2>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6 border-t border-white/5 pt-8 text-center md:text-left">
                                            <div><p className="text-[8px] text-slate-500 font-black uppercase mb-1 italic">Toplam Ciro</p><p className="font-black text-xs md:text-xl text-slate-100 italic">{formatCurrency(stats.cash + stats.card)}</p></div>
                                            <div><p className="text-[8px] text-slate-500 font-black uppercase mb-1 italic">Gider Toplam</p><p className="font-black text-xs md:text-xl text-red-400 italic">{formatCurrency(stats.staffPaid + stats.billsPaid + stats.comm)}</p></div>
                                            <div><p className="text-[8px] text-slate-500 font-black uppercase mb-1 italic">Borç/Kredi Girişi</p><p className="font-black text-xs md:text-xl text-blue-400 italic">{formatCurrency(stats.loan)}</p></div>
                                            <div><p className="text-[8px] text-slate-500 font-black uppercase mb-1 italic">Ana Kasa</p><p className="font-black text-xs md:text-xl text-slate-400 italic">{formatCurrency(settings.initialBalance)}</p></div>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white rounded-3xl p-6 border-l-8 border-red-500 shadow-sm space-y-4">
                                    <h3 className="text-xs md:text-base font-black text-slate-800 uppercase italic flex items-center gap-2">🔔 Yaklaşan Ödemeler</h3>
                                    <div className="space-y-2.5">
                                        {stats.upcoming.map(p => (
                                            <div key={p.id} className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                <div className="flex items-center gap-3">
                                                    <div className="bg-white px-2 py-1 rounded-lg text-[9px] font-black text-red-600 border border-red-50 italic shadow-sm">{dbToDisplay(p.date)}</div>
                                                    <div className="font-black text-[10px] md:text-sm uppercase text-slate-800 italic">{p.label}</div>
                                                </div>
                                                <p className="text-xs md:text-lg font-black text-red-600 italic">{formatCurrency(p.amount)}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-slate-950 p-6 rounded-3xl shadow-xl border border-slate-800">
                                    <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1 italic">Sistem Başlangıç Bakiyesi</p>
                                    <MoneyInput value={settings.initialBalance} onChange={(v) => updateDoc(getSettingsDoc(), { initialBalance: v })} className="text-2xl md:text-4xl font-black bg-transparent w-full text-amber-500 italic tracking-tighter" />
                                </div>
                            </div>
                        )}

                        {activeTab === 'daily' && (
                            <div className="max-w-4xl mx-auto space-y-4 animate-up">
                                <div className="bg-slate-950 p-6 rounded-[2.5rem] flex justify-between items-center mb-10 shadow-2xl border-b-8 border-amber-500">
                                    <h2 className="text-white font-black text-lg md:text-3xl uppercase italic tracking-tighter laos-gradient-text">GÜNLÜK GİRİŞLER</h2>
                                    <button onClick={() => addDoc(getColRef('dailyLogs'), { date: new Date().toISOString().split('T')[0], cash: 0, card: 0, dailyLoan: 0 })} className="bg-amber-500 text-slate-950 px-6 py-3 rounded-2xl font-black text-[10px] uppercase italic shadow-lg">YENİ GÜN</button>
                                </div>
                                {dailyLogs.sort((a,b) => new Date(b.date) - new Date(a.date)).map(log => (
                                    <div key={log.id} className="bg-white rounded-[2.5rem] p-6 md:p-10 border border-slate-100 shadow-sm space-y-8 animate-up">
                                        <div className="flex justify-between items-center">
                                            <div className="bg-slate-950 px-4 py-2 rounded-xl text-amber-500 shadow-xl border border-white/10"><DateInput value={log.date} onChange={(d) => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dailyLogs', log.id), { date: d })} /></div>
                                            <button onClick={() => setShowDeleteModal({show: true, col: 'dailyLogs', id: log.id})} className="text-red-500 p-2.5 bg-red-50 rounded-xl font-black text-[10px] uppercase italic">SİL</button>
                                        </div>
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="bg-slate-50 p-5 rounded-[2rem] border border-slate-100 shadow-inner">
                                                <p className="text-[8px] font-black text-slate-400 mb-2 uppercase italic tracking-widest">NAKİT SATIŞ</p>
                                                <MoneyInput value={log.cash} onChange={(v) => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dailyLogs', log.id), { cash: v })} className="w-full bg-transparent font-black text-sm md:text-3xl border-none p-0 focus:ring-0 text-slate-800 italic" />
                                            </div>
                                            <div className="bg-blue-50/50 p-5 rounded-[2rem] border border-blue-100 shadow-inner">
                                                <p className="text-[8px] font-black text-blue-500 mb-2 uppercase italic tracking-widest">POS SATIŞ</p>
                                                <MoneyInput value={log.card} onChange={(v) => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dailyLogs', log.id), { card: v })} className="w-full bg-transparent font-black text-sm md:text-3xl border-none p-0 focus:ring-0 text-blue-700 italic" />
                                            </div>
                                        </div>
                                        <div className="bg-slate-950 p-6 rounded-[2rem] border border-slate-800 text-center shadow-2xl">
                                            <p className="text-[8px] font-black text-amber-500 mb-2 uppercase italic tracking-widest">DIŞ KAYNAK / KREDİ GİRİŞİ</p>
                                            <MoneyInput value={log.dailyLoan || 0} onChange={(v) => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dailyLogs', log.id), { dailyLoan: v })} className="w-full bg-transparent p-0 border-none font-black text-xl md:text-5xl text-white italic text-center focus:ring-0 tracking-tighter" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'pos' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-up">
                                <header className="bg-slate-950 p-6 rounded-[2.5rem] border-b-8 border-amber-500 flex flex-col md:flex-row justify-between items-center gap-6 shadow-2xl">
                                    <h2 className="text-white font-black text-lg md:text-3xl uppercase italic tracking-tighter laos-gradient-text">BANKA & POS ANALİZİ</h2>
                                    <div className="bg-white/5 border border-white/10 px-8 py-4 rounded-3xl text-center shadow-inner">
                                        <p className="text-[8px] font-black text-slate-500 uppercase italic mb-1 tracking-widest">TOPLAM BEKLEYEN ALACAK</p>
                                        <p className="text-xl md:text-3xl font-black text-amber-500 tracking-tighter italic">{formatCurrency(stats.card - stats.comm)}</p>
                                    </div>
                                </header>
                                <div className="grid grid-cols-2 gap-6">
                                    <div className="bg-white p-8 rounded-[2rem] border-l-[10px] border-amber-500 shadow-sm">
                                        <p className="text-[9px] font-black text-slate-400 uppercase italic mb-2 tracking-widest">KOMİSYON (%)</p>
                                        <input type="number" step="0.1" value={settings.defaultCommission} onChange={(e) => updateDoc(getSettingsDoc(), { defaultCommission: Number(e.target.value) })} className="text-lg md:text-4xl font-black bg-transparent w-full focus:ring-0 text-slate-800 italic outline-none" />
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] border-l-[10px] border-slate-900 shadow-sm">
                                        <p className="text-[9px] font-black text-slate-400 uppercase italic mb-2 tracking-widest">VALÖR GÜNÜ</p>
                                        <input type="number" value={settings.defaultValor} onChange={(e) => updateDoc(getSettingsDoc(), { defaultValor: Number(e.target.value) })} className="text-lg md:text-4xl font-black bg-transparent w-full focus:ring-0 text-slate-800 italic outline-none" />
                                    </div>

                                            return (
                                                <div key={i}>
                                                    <div className="flex justify-between text-[10px] font-black uppercase text-slate-500 mb-4 italic"><span>{item.l}</span><span>%{ratio.toFixed(0)}</span></div>
                                                    <div className="w-full h-4 bg-slate-50 rounded-full border overflow-hidden"><div className={`h-full ${item.c}`} style={{width: `${ratio}%`}}></div></div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="bg-slate-900 p-10 md:p-14 rounded-[3rem] text-white shadow-2xl border border-white/5 flex flex-col justify-between">
                                        <h3 className="text-xs md:text-2xl font-black text-amber-500 uppercase italic mb-12 tracking-[0.2em] laos-gradient-text">STRATEJİK YÖNETİCİ NOTLARI</h3>
                                        <div className="space-y-8 relative z-10">
                                            <div className="bg-white/5 p-8 rounded-[2rem] border border-white/5 backdrop-blur-xl">
                                                <p className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest italic">İŞGÜCÜ VERİMLİLİĞİ</p>
                                                <p className="text-xs md:text-lg font-bold italic text-slate-200">Maaş giderleri toplam cironun %{((reportAnalysis.staffEx / (reportAnalysis.totalIn || 1)) * 100).toFixed(1)}'ini oluşturuyor.</p>
                                            </div>
                                            <div className="bg-white/5 p-8 rounded-[2rem] border border-white/5 backdrop-blur-xl">
                                                <p className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest italic">GENEL DURUM</p>
                                                <p className="text-xs md:text-lg font-bold italic text-slate-200">Operasyonel kârlılık sürdürülebilir seviyededir.</p>
                                            </div>
                                        </div>
                                        <div className="mt-14 pt-10 border-t border-white/5 flex items-center justify-between text-[9px] font-black text-slate-500 uppercase tracking-[0.6em] italic">
                                            <p>LAOS FINANS ANALİZ SİSTEMLERİ</p>
                                            <span className="text-amber-500 text-xl animate-pulse italic font-black">L</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* STATUS BAR */}
                    <div className="fixed top-4 right-4 z-[1001] md:top-8 md:right-8">
                        <div className="px-5 py-2.5 rounded-full bg-slate-950/95 backdrop-blur-2xl shadow-2xl border border-white/10 flex items-center gap-3">
                            <div className="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-[0_0_15px_#f59e0b] animate-pulse"></div>
                            <span className="text-[9px] font-black text-amber-500 uppercase tracking-[0.3em] italic font-bold">LAOS CONNECTED</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
