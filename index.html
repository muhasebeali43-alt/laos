<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kafe Analiz | Laos Finansal Yönetim</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide İkon Kütüphanesi -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --laos-gold: #f59e0b;
            --laos-dark: #0f172a;
            --laos-slate: #1e293b;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        /* Laos Özel Kart Tasarımı */
        .laos-hero-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 2.5rem;
            border-bottom: 6px solid var(--laos-gold);
        }

        @media (min-width: 768px) {
            .laos-hero-card { border-radius: 3.5rem; }
        }

        .gold-text { color: var(--laos-gold); } 
        .gold-bg { background-color: var(--laos-gold); }

        .white-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s ease;
        }
        
        @media (min-width: 768px) {
            .white-card { border-radius: 2.5rem; }
        }

        .white-card:active { transform: scale(0.97); }

        .nav-active {
            background-color: var(--laos-gold);
            color: #0f172a;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.3);
        }

        input:focus { outline: none; border-bottom: 2px solid var(--laos-gold); }
        
        .animate-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .cari-table-row:nth-child(even) { background-color: #f8fafc; }
        
        input[type="text"], input[type="number"], input[type="date"] {
            font-size: 16px !important;
        }

        .laos-gradient-text {
            background: linear-gradient(to right, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: white;">
            <div style="width: 50px; height: 50px; border: 4px solid #f59e0b; border-top: 4px solid transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
            <p style="font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; font-size: 10px;">Laos Analiz Sistemleri</p>
        </div>
    </div>

    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDDzSjjk0N-k3QLIJQu8jHWxCDtgzvZ1lE",
            authDomain: "laos-61380.firebaseapp.com",
            projectId: "laos-61380",
            storageBucket: "laos-61380.appspot.com",
            messagingSenderId: "833439553703",
            appId: "1:833439553703:web:6f4a1c7969a7f7216fa382"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'cafe-pro-v1';

        const { useState, useEffect, useMemo } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            if (!window.lucide || !lucide.icons) return null;
            const camelName = name.split('-').map((word, index) => 
                index === 0 ? word : word.charAt(0).toUpperCase() + word.slice(1)
            ).join('');
            const iconData = lucide.icons[camelName] || lucide.icons[name];
            if (!iconData) return null;
            const [tag, attrs, children] = iconData;
            return React.createElement(
                'svg', { ...attrs, width: size, height: size, className: `lucide lucide-${name} ${className}`, xmlns: "http://www.w3.org/2000/svg" },
                children.map((child, i) => React.createElement(child[0], { ...child[1], key: i }))
            );
        };

        // --- Sayı Formatlama Yardımcıları ---
        const formatInput = (val) => {
            if (val === null || val === undefined || val === '') return '';
            const num = val.toString().replace(/[^0-9]/g, '');
            return num.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        };

        const parseInput = (val) => {
            if (!val) return 0;
            return Number(val.toString().replace(/\./g, '')) || 0;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [reportRange, setReportRange] = useState('monthly');
            const [customStartDate, setCustomStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [customEndDate, setCustomEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedPersonnelId, setSelectedPersonnelId] = useState(null);

            const [settings, setSettings] = useState({ initialBalance: 0, defaultCommission: 3.5, defaultValor: 30 });
            const [dailyLogs, setDailyLogs] = useState([]);
            const [scheduledPayments, setScheduledPayments] = useState([]);
            const [personnel, setPersonnel] = useState([]);
            const [personnelPayments, setPersonnelPayments] = useState([]);

            useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (u) {
                        const baseRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                        baseRef.collection('config').doc('app_settings').onSnapshot(d => d.exists && setSettings(d.data()));
                        baseRef.collection('dailyLogs').onSnapshot(s => setDailyLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('scheduledPayments').onSnapshot(s => setScheduledPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('personnel').onSnapshot(s => setPersonnel(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        baseRef.collection('personnelPayments').onSnapshot(s => setPersonnelPayments(s.docs.map(d => ({id: d.id, ...d.data()}))));
                        setLoading(false);
                    } else {
                        auth.signInAnonymously().catch(console.error);
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            const formatCurrency = (val) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(val || 0);

            // --- Hesaplamalar ---
            const totals = useMemo(() => dailyLogs.reduce((acc, log) => {
                const comm = (Number(log.card || 0) * (settings.defaultCommission || 3.5)) / 100;
                return {
                    loan: acc.loan + Number(log.dailyLoan || 0),
                    cash: acc.cash + Number(log.cash || 0),
                    card: acc.card + Number(log.card || 0),
                    comm: acc.comm + comm
                };
            }, { loan: 0, cash: 0, card: 0, comm: 0 }), [dailyLogs, settings.defaultCommission]);

            const billsPaid = scheduledPayments.filter(p => p.status === 'paid').reduce((s, p) => s + Number(p.amount), 0);
            const pendingBills = scheduledPayments.filter(p => p.status !== 'paid').reduce((s, p) => s + Number(p.amount), 0);
            const staffPaid = personnelPayments.reduce((s, p) => s + Number(p.amount || 0), 0);
            const netCash = Number(settings.initialBalance || 0) + totals.cash + totals.card + totals.loan - (staffPaid + billsPaid + totals.comm);

            const posPending = useMemo(() => totals.card - totals.comm, [totals]);
            
            const upcomingPayments = useMemo(() => {
                return scheduledPayments
                    .filter(p => p.status !== 'paid')
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
            }, [scheduledPayments]);

            const posSettlements = useMemo(() => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const valorDays = Number(settings.defaultValor || 30);
                return dailyLogs.filter(log => Number(log.card) > 0).map(log => {
                    const logDate = new Date(log.date);
                    const settlementDate = new Date(logDate);
                    settlementDate.setDate(logDate.getDate() + valorDays); 
                    const commission = (Number(log.card) * (settings.defaultCommission || 3.5)) / 100;
                    return { id: log.id, date: log.date, settlementDate: settlementDate.toLocaleDateString('tr-TR'), gross: Number(log.card), net: Number(log.card) - commission, isSettled: settlementDate <= today };
                }).sort((a, b) => new Date(a.date) - new Date(b.date));
            }, [dailyLogs, settings.defaultCommission, settings.defaultValor]);

            const reportData = useMemo(() => {
                const now = new Date();
                const start = new Date(customStartDate);
                const end = new Date(customEndDate);
                start.setHours(0,0,0,0);
                end.setHours(23,59,59,999);

                const filter = (itemDateStr) => {
                    if (!itemDateStr) return false;
                    const d = new Date(itemDateStr);
                    if (reportRange === 'daily') return d.toDateString() === now.toDateString();
                    if (reportRange === 'monthly') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    if (reportRange === 'custom') return d >= start && d <= end;
                    return true;
                };

                const fLogs = dailyLogs.filter(l => filter(l.date));
                const fPersPays = personnelPayments.filter(p => filter(p.date));
                const fSchedPays = scheduledPayments.filter(p => p.status === 'paid' && filter(p.date));

                const income = fLogs.reduce((a, l) => ({ 
                    cash: a.cash + Number(l.cash || 0), 
                    card: a.card + Number(l.card || 0), 
                    loan: a.loan + Number(l.dailyLoan || 0)
                }), {cash:0, card:0, loan:0});

                const expense = {
                    personnel: fPersPays.reduce((s, p) => s + Number(p.amount || 0), 0),
                    scheduled: fSchedPays.reduce((s, p) => s + Number(p.amount || 0), 0),
                    posComm: fLogs.reduce((s, l) => s + (Number(l.card || 0) * (settings.defaultCommission || 3.5) / 100), 0)
                };

                const totalIncome = income.cash + income.card + income.loan;
                const totalExpense = expense.personnel + expense.scheduled + expense.posComm;
                const netProfit = totalIncome - totalExpense;
                const profitMargin = totalIncome > 0 ? (netProfit / totalIncome) * 100 : 0;

                return { income, expense, totalIncome, totalExpense, netProfit, profitMargin, fLogs, fPersPays, fSchedPays };
            }, [dailyLogs, personnelPayments, scheduledPayments, reportRange, customStartDate, customEndDate, settings.defaultCommission]);

            const getCol = (c) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(c);
            const saveSettings = async (newData) => await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('app_settings').set({...settings, ...newData}, {merge:true});
            const deleteItem = async (c, id) => { if(confirm("Kalıcı olarak silinecek. Emin misiniz?")) await getCol(c).doc(id).delete(); };

            if (loading) return <div className="min-h-screen bg-[#0f172a] flex items-center justify-center text-white font-black uppercase tracking-widest animate-pulse">Laos Verileri Hazırlanıyor...</div>;

            return (
                <div className="min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 overflow-x-hidden bg-[#F1F5F9]">
                    {/* Menü */}
                    <nav className="fixed bottom-0 left-0 right-0 md:relative md:w-64 bg-[#0f172a] text-white border-t border-slate-800 md:border-r p-1 md:p-6 flex md:flex-col justify-around md:justify-start gap-1 md:gap-4 z-50 shadow-2xl">
                        <div className="hidden md:flex items-center gap-3 mb-10 px-2">
                            <div className="w-8 h-8 gold-bg rounded-full flex items-center justify-center text-slate-900 font-black italic shadow-[0_0_15px_rgba(245,158,11,0.5)] text-xs">L</div>
                            <h2 className="font-black text-xl italic tracking-tighter uppercase laos-gradient-text">Kafe Analiz</h2>
                        </div>
                        {[
                            {id:'dashboard', icon:'layout-dashboard', l:'Özet'},
                            {id:'daily', icon:'calendar-days', l:'Günlük'},
                            {id:'pos', icon:'credit-card', l:'POS'},
                            {id:'personnel', icon:'users', l:'Personel'},
                            {id:'payments', icon:'receipt', l:'Ödemeler'},
                            {id:'reports', icon:'bar-chart-3', l:'Raporlar'}
                        ].map(t => (
                            <button key={t.id} onClick={() => {setActiveTab(t.id); setSelectedPersonnelId(null);}} 
                                className={`flex-1 md:flex-none flex flex-col md:flex-row items-center gap-1 md:gap-3 p-3 rounded-2xl transition-all ${activeTab === t.id ? 'nav-active' : 'text-slate-500 hover:text-slate-300'}`}>
                                <Icon name={t.icon} size={activeTab === t.id ? 22 : 20} /> 
                                <span className="text-[9px] md:text-xs font-bold uppercase tracking-widest">{t.l}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-4 md:p-12 overflow-y-auto">
                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 md:space-y-10 animate-up">
                                <header className="flex items-center gap-4">
                                    <div className="w-1.5 h-10 gold-bg rounded-full"></div>
                                    <h1 className="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter italic uppercase">Finansal Komuta</h1>
                                </header>
                                
                                <div className="laos-hero-card p-8 md:p-14 text-white shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] relative overflow-hidden group border border-slate-700">
                                    <p className="text-[10px] md:text-[12px] font-bold text-slate-400 uppercase mb-3 tracking-[0.4em] flex items-center gap-2"><Icon name="banknote" size={14} className="gold-text" /> Net Likidite Gücü</p>
                                    <h2 className="text-5xl md:text-9xl font-black gold-text tracking-tighter mb-10 md:mb-16 italic">{formatCurrency(netCash)}</h2>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6 md:gap-12 border-t border-white/5 pt-10">
                                        <div><p className="text-[9px] md:text-[11px] text-slate-500 font-bold uppercase mb-2 tracking-widest">Aylık Ciro</p><p className="font-bold text-lg md:text-2xl text-slate-200">{formatCurrency(totals.cash + totals.card)}</p></div>
                                        <div><p className="text-[9px] md:text-[11px] text-slate-500 font-bold uppercase mb-2 tracking-widest">Gider</p><p className="font-bold text-lg md:text-2xl text-red-400">{formatCurrency(staffPaid + billsPaid + totals.comm)}</p></div>
                                        <div><p className="text-[9px] md:text-[11px] text-slate-500 font-bold uppercase mb-2 tracking-widest">Kredi</p><p className="font-bold text-lg md:text-2xl text-blue-400">{formatCurrency(totals.loan)}</p></div>
                                        <div><p className="text-[9px] md:text-[11px] text-slate-500 font-bold uppercase mb-2 tracking-widest">Kasa</p><p className="font-bold text-lg md:text-2xl text-slate-500">{formatCurrency(settings.initialBalance)}</p></div>
                                    </div>
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-amber-500/5 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8">
                                    <div onClick={() => setActiveTab('pos')} className="white-card p-6 md:p-10 flex flex-col justify-between min-h-[140px] md:min-h-[220px] cursor-pointer hover:border-amber-200 group">
                                        <div className="w-4 h-4 rounded-full gold-bg mb-4 shadow-lg shadow-amber-200 group-hover:scale-125 transition-transform"></div>
                                        <div><p className="text-[9px] md:text-[11px] font-black text-slate-400 uppercase mb-1 tracking-widest italic">POS Bekleyen</p><p className="text-xl md:text-4xl font-black text-slate-800 tracking-tighter">{formatCurrency(posPending)}</p></div>
                                    </div>
                                    <div onClick={() => setActiveTab('daily')} className="white-card p-6 md:p-10 flex flex-col justify-between min-h-[140px] md:min-h-[220px] cursor-pointer hover:border-blue-200 group">
                                        <div className="w-4 h-4 rounded-full bg-blue-500 mb-4 shadow-lg shadow-blue-200 group-hover:scale-125 transition-transform"></div>
                                        <div><p className="text-[9px] md:text-[11px] font-black text-slate-400 uppercase mb-1 tracking-widest italic">Günlük Ciro</p><p className="text-xl md:text-4xl font-black text-slate-800 tracking-tighter">{formatCurrency(totals.cash + totals.card)}</p></div>
                                    </div>
                                    <div onClick={() => setActiveTab('payments')} className="white-card p-6 md:p-10 flex flex-col justify-between min-h-[140px] md:min-h-[220px] cursor-pointer col-span-2 md:col-span-1 hover:border-red-200 group">
                                        <div className="w-4 h-4 rounded-full bg-red-500 mb-4 shadow-lg shadow-red-200 group-hover:scale-125 transition-transform"></div>
                                        <div><p className="text-[9px] md:text-[11px] font-black text-slate-400 uppercase mb-1 tracking-widest italic">Bekleyen Ödemeler</p><p className="text-xl md:text-4xl font-black text-red-500 tracking-tighter">{formatCurrency(pendingBills)}</p></div>
                                    </div>
                                </div>

                                <div className="white-card p-8 md:p-12 border border-slate-100 relative">
                                    <div className="flex justify-between items-center mb-10 border-b border-slate-50 pb-6">
                                        <div className="flex items-center gap-4">
                                            <div className="bg-slate-900 p-4 rounded-3xl text-amber-500 shadow-xl"><Icon name="calendar-clock" size={24} /></div>
                                            <div>
                                                <h3 className="font-black text-2xl md:text-3xl uppercase tracking-tighter text-slate-800 italic">Ajanda</h3>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Öncelikli Ödeme Planı</p>
                                            </div>
                                        </div>
                                        <div className="bg-red-50 px-5 py-2 rounded-2xl text-[10px] font-black text-red-500 uppercase italic">Kritik Akış</div>
                                    </div>
                                    <div className="space-y-4">
                                        {upcomingPayments.length > 0 ? upcomingPayments.slice(0, 5).map(p => (
                                            <div key={p.id} className="flex justify-between items-center bg-[#FDFCFB] p-6 rounded-[2rem] border border-slate-50 hover:border-amber-100 transition-all shadow-sm">
                                                <div className="flex items-center gap-6">
                                                    <div className="text-[10px] font-black text-white gold-bg px-4 py-2 rounded-xl shadow-lg shadow-amber-200/40 italic uppercase">{new Date(p.date).toLocaleDateString('tr-TR')}</div>
                                                    <p className="font-black text-lg text-slate-800 uppercase italic tracking-tighter">{p.label}</p>
                                                </div>
                                                <p className="text-2xl font-black text-slate-900 tracking-tighter">{formatCurrency(p.amount)}</p>
                                            </div>
                                        )) : <div className="text-center py-10 text-slate-300 font-bold uppercase italic tracking-widest text-sm border-2 border-dashed rounded-[3rem]">Bekleyen Kayıt Bulunmuyor</div>}
                                    </div>
                                </div>

                                <div className="bg-slate-950 rounded-[3rem] p-10 flex flex-col md:flex-row items-center justify-between shadow-2xl border border-slate-800">
                                    <div className="flex items-center gap-10">
                                        <div className="w-20 h-20 rounded-full border-4 border-amber-500/30 flex items-center justify-center text-amber-500 font-black text-2xl italic bg-amber-500/5 shadow-inner shadow-amber-500/10">₺</div>
                                        <div>
                                            <p className="text-[10px] font-black text-slate-500 uppercase mb-2 tracking-widest italic">Laos Kasa Başlangıcı</p>
                                            <input type="text" value={formatInput(settings.initialBalance)} onChange={(e) => saveSettings({initialBalance: parseInput(e.target.value)})} className="text-5xl font-black bg-transparent focus:ring-0 gold-text tracking-tighter italic" placeholder="0" />
                                        </div>
                                    </div>
                                    <div className="mt-8 md:mt-0 px-10 py-5 bg-slate-900 rounded-full border border-slate-800 text-[10px] font-black gold-text uppercase tracking-[0.3em] italic shadow-2xl animate-pulse">Sistem Koruma Altında</div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'pos' && (
                             <div className="max-w-4xl mx-auto space-y-10 animate-up">
                                <header className="flex justify-between items-center mb-10">
                                    <h2 className="text-4xl font-black text-slate-900 uppercase italic tracking-tighter laos-gradient-text">POS Likidite Analizi</h2>
                                    <div className="laos-hero-card text-white px-10 py-6 shadow-xl border-b-8 border-amber-500">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase mb-1 tracking-widest italic">Net Tahsilat Bekleyen</p>
                                        <p className="text-4xl font-black gold-text">{formatCurrency(posPending)}</p>
                                    </div>
                                </header>
                                <div className="grid grid-cols-2 gap-8">
                                    <div className="white-card p-10 border-l-8 border-amber-500 shadow-sm">
                                        <p className="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 italic">Laos Komisyon Oranı (%)</p>
                                        <div className="flex items-center gap-2">
                                            <span className="text-2xl font-bold text-slate-300">%</span>
                                            <input type="number" step="0.1" value={settings.defaultCommission} onChange={(e) => saveSettings({defaultCommission: e.target.value})} className="text-4xl font-black bg-transparent w-full focus:ring-0 text-slate-800" />
                                        </div>
                                    </div>
                                    <div className="white-card p-10 border-l-8 border-slate-900 shadow-sm">
                                        <p className="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 italic">Valör / Vade (Gün)</p>
                                        <div className="flex items-center gap-2">
                                            <Icon name="clock" size={24} className="text-slate-300" />
                                            <input type="number" value={settings.defaultValor} onChange={(e) => saveSettings({defaultValor: e.target.value})} className="text-4xl font-black bg-transparent w-full focus:ring-0 text-slate-800" />
                                            <span className="text-sm font-bold text-slate-300 uppercase italic">GÜN</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="grid gap-6 mt-10">
                                    {posSettlements.map(p => (

                                            <div className="flex items-center gap-3 font-black text-5xl text-slate-950 tracking-tighter italic">
                                                <span className="text-3xl text-slate-300">₺</span>
                                                <input type="text" value={formatInput(p.amount)} onChange={(e) => getCol('scheduledPayments').doc(p.id).update({amount: parseInput(e.target.value)})} className="bg-transparent w-full border-none p-0 focus:ring-0" placeholder="0" />
                                            </div>
                                        </div>
                                        <div className="flex gap-6 w-full md:w-auto">
                                            <button onClick={() => getCol('scheduledPayments').doc(p.id).update({status: p.status === 'paid' ? 'pending' : 'paid'})} className={`flex-1 px-12 py-6 rounded-[2rem] font-black text-xs uppercase tracking-widest shadow-xl transition-all ${p.status === 'paid' ? 'bg-green-500 text-white' : 'bg-slate-950 text-white active:scale-95'}`}>{p.status === 'paid' ? 'İŞLEM TAMAM' : 'ÖDEMEYİ YAP'}</button>
                                            <button onClick={() => deleteItem('scheduledPayments', p.id)} className="bg-red-50 text-red-300 p-6 rounded-[2rem] hover:bg-red-500 hover:text-white transition-all shadow-sm"><Icon name="trash-2" size={24} /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Senkronizasyon Durumu */}
                    <div className="fixed top-4 right-4 md:top-8 md:right-8 z-[100]"><div className="px-5 md:px-8 py-2 md:py-4 rounded-full bg-[#0f172a] shadow-2xl border border-slate-800 flex items-center gap-3 group"><div className="w-2.5 h-2.5 rounded-full gold-bg shadow-[0_0_15px_#f59e0b] animate-pulse"></div><span className="text-[8px] md:text-[10px] font-black gold-text uppercase tracking-[0.2em] italic group-hover:text-white transition-colors">Laos Cloud Sync</span></div></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
