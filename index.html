<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Analiz - Laos Pro</title>
    <!-- Kütüphaneler -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Compat Modu - Tarayıcı Uyumluluğu İçin) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; margin: 0; overflow-x: hidden; }
        
        .laos-gradient-text {
            background: linear-gradient(to right, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .animate-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .white-card { background: white; border-radius: 2rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .premium-dark { background: #020617; border-bottom: 8px solid #f59e0b; border-radius: 2.5rem; }
        
        /* Italics for Laos Look */
        .laos-italic { font-style: italic; }
        
        .setup-screen { background: #020617; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- KONFİGÜRASYON ---
        const getFirebaseConfig = () => {
            // Ortamdan gelen config varsa onu kullan (Canvas için)
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                return JSON.parse(__firebase_config);
            }
            // Dış dünya (GitHub) için manuel config alanı
            return {
                apiKey: "", // BURAYA FİREBASE API KEY GELECEK
                authDomain: "laos-61380.firebaseapp.com",
                projectId: "laos-61380",
                storageBucket: "laos-61380.appspot.com",
                messagingSenderId: "833439553703",
                appId: "" // BURAYA FİREBASE APP ID GELECEK
            };
        };

        const firebaseConfig = getFirebaseConfig();
        const appId = typeof __app_id !== 'undefined' ? __app_id : "cafe-pro-v1";

        // Firebase Başlatma
        let db = null;
        let auth = null;
        let isFirebaseValid = false;

        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "") {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
                isFirebaseValid = true;
            } catch (err) {
                console.error("Firebase Error:", err);
            }
        }

        // --- YARDIMCI ARAÇLAR ---
        const toNum = (v) => {
            if (v === null || v === undefined || v === "") return 0;
            if (typeof v === 'number') return Math.floor(v);
            const clean = String(v).replace(/\./g, '').replace(/,/g, '');
            return parseInt(clean, 10) || 0;
        };

        const formatCurrency = (v) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 0 }).format(toNum(v));
        const formatNumber = (val) => new Intl.NumberFormat('tr-TR').format(toNum(val));
        const dbToDisplay = (iso) => iso ? iso.split('-').reverse().join('.') : "";

        // --- BİLEŞENLER ---
        const MoneyInput = ({ value, onChange, className = "", placeholder = "0" }) => {
            const [local, setLocal] = useState(formatNumber(value));
            const isFocused = useRef(false);
            useEffect(() => { if (!isFocused.current) setLocal(formatNumber(value)); }, [value]);
            return (
                <input type="text" inputMode="numeric" value={local === "0" && placeholder !== "0" ? "" : local} 
                    onFocus={() => isFocused.current = true}
                    onBlur={() => { isFocused.current = false; onChange(toNum(local)); }}
                    onChange={(e) => setLocal(formatNumber(e.target.value.replace(/[^0-9]/g, '')))}
                    placeholder={placeholder}
                    className={`focus:ring-2 focus:ring-amber-500 outline-none rounded-lg ${className}`}
                />
            );
        };

        const DateInput = ({ value, onChange, className = "" }) => (
            <div className="flex items-center gap-1">
                <span className="text-amber-500 text-[10px]">📅</span>
                <input type="date" value={value || ""} onChange={(e) => onChange(e.target.value)} 
                    className={`bg-transparent border-none font-black text-slate-700 focus:ring-0 cursor-pointer outline-none text-[10px] p-0 laos-italic ${className}`} />
            </div>
        );

        const MethodSelector = ({ value, onChange, className = "" }) => (
            <select value={value || 'nakit'} onChange={(e) => onChange(e.target.value)} 
                className={`bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[9px] font-bold uppercase text-slate-700 focus:ring-1 focus:ring-amber-500 outline-none laos-italic ${className}`}>
                <option value="nakit">Nakit</option>
                <option value="kart">Kart</option>
                <option value="havale">Havale</option>
                <option value="cek">Çek</option>
            </select>
        );

        // --- ANA UYGULAMA ---
        function App() {
            // Firebase anahtarı yoksa kurulum ekranı göster
            if (!isFirebaseValid) {
                return (
                    <div className="setup-screen">
                        <div className="white-card p-10 max-w-md w-full text-center space-y-6 shadow-2xl animate-up">
                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-3xl">🔑</div>
                            <h2 className="text-xl font-black text-slate-900 uppercase laos-italic">Kurulum Gerekli</h2>
                            <p className="text-slate-500 text-xs leading-relaxed laos-italic">
                                Firebase yapılandırması eksik. Lütfen kodun başındaki <strong>firebaseConfig</strong> alanına <strong>apiKey</strong> ve <strong>appId</strong> bilgilerinizi girin.
                            </p>
                            <div className="bg-slate-50 p-4 rounded-2xl text-[10px] text-left font-mono text-slate-400 border border-slate-100 overflow-hidden">
                                <code>apiKey: "AIzaSy..."</code><br/>
                                <code>appId: "1:8334..."</code>
                            </div>
                            <p className="text-[9px] text-amber-600 font-bold uppercase tracking-widest laos-italic">Laos Pro Sistem Kontrolü</p>
                        </div>
                    </div>
                );
            }

            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [recipeSubTab, setRecipeSubTab] = useState('inventory');
            const [loading, setLoading] = useState(true);
            const [settings, setSettings] = useState({ initialBalance: 0, defaultCommission: 3.5, defaultValor: 30 });
            const [dailyLogs, setDailyLogs] = useState([]);
            const [scheduledPayments, setScheduledPayments] = useState([]);
            const [personnel, setPersonnel] = useState([]);
            const [personnelPayments, setPersonnelPayments] = useState([]);
            const [inventory, setInventory] = useState([]);
            const [products, setProducts] = useState([]);
            const [selectedPersonnelId, setSelectedPersonnelId] = useState(null);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [showDeleteModal, setShowDeleteModal] = useState({ show: false, col: '', id: '' });
            const [reportRange, setReportRange] = useState('monthly');
            const [customStartDate, setCustomStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [customEndDate, setCustomEndDate] = useState(new Date().toISOString().split('T')[0]);

            const pRef = (col) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(col);
            const sDoc = () => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('app_settings');

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else if (!auth.currentUser) {
                            await auth.signInAnonymously();
                        }
                    } catch (e) { console.error("Auth Error:", e); }
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsub = [
                    sDoc().onSnapshot(d => d.exists && setSettings(d.data())),
                    pRef('dailyLogs').onSnapshot(s => setDailyLogs(s.docs.map(d => ({id: d.id, ...d.data()})))),
                    pRef('scheduledPayments').onSnapshot(s => setScheduledPayments(s.docs.map(d => ({id: d.id, ...d.data()})))),
                    pRef('personnel').onSnapshot(s => setPersonnel(s.docs.map(d => ({id: d.id, ...d.data()})))),
                    pRef('personnelPayments').onSnapshot(s => setPersonnelPayments(s.docs.map(d => ({id: d.id, ...d.data()})))),
                    pRef('inventory').onSnapshot(s => setInventory(s.docs.map(d => ({id: d.id, ...d.data()})))),
                    pRef('products').onSnapshot(s => setProducts(s.docs.map(d => ({id: d.id, ...d.data()})))),
                ];
                setLoading(false);
                return () => unsub.forEach(u => u());
            }, [user]);

            // --- HESAPLAMALAR ---
            const stats = useMemo(() => {
                const logsTotal = dailyLogs.reduce((acc, log) => ({
                    cash: acc.cash + toNum(log.cash),
                    card: acc.card + toNum(log.card),
                    loan: acc.loan + toNum(log.dailyLoan),
                    comm: acc.comm + (toNum(log.card) * toNum(settings.defaultCommission || 3.5) / 100)
                }), { cash: 0, card: 0, loan: 0, comm: 0 });

                const bills = scheduledPayments.filter(p => p.status === 'paid').reduce((s, p) => s + toNum(p.amount), 0);
                const staff = personnelPayments.reduce((s, p) => s + toNum(p.amount), 0);
                const netCash = toNum(settings.initialBalance) + logsTotal.cash + logsTotal.card + logsTotal.loan - (bills + staff + logsTotal.comm);
                const posPending = logsTotal.card - logsTotal.comm;
                const upcoming = scheduledPayments.filter(p => p.status !== 'paid').sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0, 4);

                return { ...logsTotal, bills, staff, netCash, posPending, upcoming };
            }, [dailyLogs, scheduledPayments, personnelPayments, settings]);

            const posSettlements = useMemo(() => {
                const today = new Date(); today.setHours(0,0,0,0);
                const valor = toNum(settings.defaultValor || 30);
                return dailyLogs.filter(log => toNum(log.card) > 0).map(log => {
                    const dateObj = new Date(log.date);
                    if (isNaN(dateObj)) return null;
                    const settleDate = new Date(dateObj);
                    settleDate.setDate(dateObj.getDate() + valor);
                    const net = toNum(log.card) - (toNum(log.card) * toNum(settings.defaultCommission || 3.5) / 100);
                    return { id: log.id, date: log.date, settle: settleDate, net, settled: settleDate <= today };
                }).filter(x => x !== null).sort((a,b) => a.settle - b.settle);
            }, [dailyLogs, settings]);

            const calculateCost = (prod) => {
                if (!prod.ingredients) return 0;
                return prod.ingredients.reduce((total, ing) => {
                    const inv = inventory.find(i => i.id === ing.id);
                    if (!inv) return total;
                    const factor = (inv.unit === 'kg' || inv.unit === 'L') ? 1000 : 1;
                    return total + (toNum(inv.price) / factor) * toNum(ing.amount);
                }, 0);
            };

            const reportAnalysis = useMemo(() => {
                const now = new Date();
                const filterFn = (dStr) => {
                    const d = new Date(dStr);
                    if (reportRange === 'daily') return d.toDateString() === now.toDateString();
                    if (reportRange === 'monthly') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    if (reportRange === 'custom') return d >= new Date(customStartDate) && d <= new Date(customEndDate);
                    return true;
                };
                const fLogs = dailyLogs.filter(l => filterFn(l.date));
                const income = fLogs.reduce((a, l) => a + toNum(l.cash) + toNum(l.card) + toNum(l.dailyLoan), 0);
                const staffEx = personnelPayments.filter(p => filterFn(p.date)).reduce((s, p) => s + toNum(p.amount), 0);
                const posEx = fLogs.reduce((s, l) => s + (toNum(l.card) * toNum(settings.defaultCommission) / 100), 0);
                const billsEx = scheduledPayments.filter(p => p.status === 'paid' && filterFn(p.date)).reduce((s, p) => s + toNum(p.amount), 0);
                const totalEx = staffEx + posEx + billsEx;
                return { income, totalEx, profit: income - totalEx, margin: income > 0 ? ((income - totalEx) / income) * 100 : 0, staffEx, posEx };
            }, [dailyLogs, personnelPayments, scheduledPayments, reportRange, customStartDate, customEndDate, settings]);

            const confirmDelete = async () => {
                await pRef(showDeleteModal.col).doc(showDeleteModal.id).delete();
                setShowDeleteModal({ show: false, col: '', id: '' });
            };

            if (loading) return <div className="h-screen bg-slate-950 flex items-center justify-center text-amber-500 font-black animate-pulse text-[10px] uppercase tracking-widest laos-italic">Laos Connect...</div>;

            return (
                <div className="min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 bg-[#F8FAFC]">
                    
                    {/* MODALLAR */}
                    {showDeleteModal.show && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm z-[2000]">
                            <div className="bg-white rounded-[2.5rem] p-8 max-w-xs w-full shadow-2xl animate-up text-center">
                                <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">🗑️</div>
                                <h3 className="text-xs font-black text-slate-900 mb-6 uppercase laos-italic">Bu kayıt silinsin mi?</h3>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowDeleteModal({show:false})} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-500 font-black text-[9px] uppercase laos-italic">VAZGEÇ</button>
                                    <button onClick={confirmDelete} className="flex-1 py-3 rounded-xl bg-red-500 text-white font-black text-[9px] uppercase laos-italic shadow-lg shadow-red-200">SİL</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* NAVİGASYON */}
                    <nav className="fixed bottom-0 left-0 right-0 md:relative md:w-20 lg:w-64 bg-slate-950 text-white p-2 md:p-4 flex md:flex-col justify-around md:justify-start gap-1 z-50 shadow-2xl">
                        <div className="hidden md:flex items-center gap-3 mb-10 px-2">
                            <div className="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center text-slate-950 font-black laos-italic shadow-lg shadow-amber-500/20 text-xs">L</div>
                            <h2 className="hidden lg:block font-black text-sm laos-italic uppercase tracking-tighter text-amber-500">Kafe Analiz</h2>
                        </div>
                        {[
                            {id:'dashboard', i:'📊', l:'Özet'},
                            {id:'daily', i:'📅', l:'Günlük'},
                            {id:'pos', i:'💳', l:'POS'},
                            {id:'personnel', i:'👥', l:'Ekip'},
                            {id:'payments', i:'🧾', l:'Borçlar'},
                            {id:'recipes', i:'📋', l:'Reçete'},
                            {id:'reports', i:'📈', l:'Analiz'}
                        ].map(t => (
                            <button key={t.id} onClick={() => {setActiveTab(t.id); setSelectedPersonnelId(null); setSelectedProductId(null);}} 
                                className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2.5 rounded-xl transition-all flex-1 md:flex-none ${activeTab === t.id ? 'bg-amber-500 text-slate-950 font-black shadow-lg shadow-amber-500/20' : 'text-slate-500 hover:text-slate-200'}`}>
                                <span className="text-base">{t.i}</span> 
                                <span className="text-[7px] lg:text-[10px] font-black uppercase tracking-tight text-center lg:text-left laos-italic">{t.l}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-3 md:p-10 lg:p-14 overflow-y-auto max-w-full no-scrollbar">
                        
                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-up">
                                <header className="flex items-center gap-2">
                                    <div className="w-2 h-8 bg-amber-500 rounded-full"></div>
                                    <h1 className="text-2xl md:text-4xl font-black text-slate-900 uppercase laos-italic tracking-tighter">İşletme Durumu</h1>
                                </header>
                                <div className="premium-dark p-6 md:p-12 text-white shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <p className="text-[9px] md:text-[11px] font-bold text-slate-500 uppercase mb-2 tracking-[0.3em] laos-italic">💰 Mevcut Nakit Gücü</p>
                                        <h2 className="text-3xl md:text-6xl font-black text-amber-500 tracking-tighter mb-10 laos-italic break-words">{formatCurrency(stats.netCash)}</h2>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6 border-t border-white/5 pt-8">
                                            <div><p className="text-[8px] text-slate-400 font-black uppercase mb-1 laos-italic">Toplam Ciro</p><p className="font-black text-xs md:text-xl laos-italic">{formatCurrency(stats.cash + stats.card)}</p></div>
                                            <div><p className="text-[8px] text-slate-400 font-black uppercase mb-1 laos-italic">Giderler</p><p className="font-black text-xs md:text-xl text-red-400 laos-italic">{formatCurrency(stats.staff + stats.bills + stats.comm)}</p></div>
                                            <div><p className="text-[8px] text-slate-400 font-black uppercase mb-1 laos-italic">Borç/Kredi</p><p className="font-black text-xs md:text-xl text-blue-400 laos-italic">{formatCurrency(stats.loan)}</p></div>
                                            <div><p className="text-[8px] text-slate-400 font-black uppercase mb-1 laos-italic">Ana Kasa</p><p className="font-black text-xs md:text-xl text-slate-500 laos-italic">{formatCurrency(settings.initialBalance)}</p></div>
                                        </div>
                                    </div>
                                </div>
                                <div className="white-card p-6 border-l-8 border-red-500 shadow-sm space-y-4">
                                    <h3 className="text-xs md:text-base font-black text-slate-800 uppercase laos-italic">🔔 Yaklaşan Ödemeler</h3>
                                    {stats.upcoming.map(p => (
                                        <div key={p.id} className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-white px-2 py-1 rounded-lg text-[9px] font-black text-red-600 border laos-italic">{dbToDisplay(p.date)}</div>
                                                <div className="font-black text-[10px] md:text-sm uppercase laos-italic">{p.label}</div>
                                            </div>
                                            <p className="text-xs md:text-lg font-black text-red-600 laos-italic">{formatCurrency(p.amount)}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-slate-950 p-6 rounded-3xl shadow-xl border border-slate-800">
                                    <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1 laos-italic">Sistem Başlangıç Bakiyesi</p>
                                    <MoneyInput value={settings.initialBalance} onChange={(v) => sDoc().set({ initialBalance: v }, { merge: true })} className="text-2xl md:text-4xl font-black bg-transparent w-full text-amber-500 laos-italic tracking-tighter" />
                                </div>
                            </div>
                        )}

                        {activeTab === 'daily' && (
                            <div className="max-w-4xl mx-auto space-y-4 animate-up">
                                <div className="bg-slate-950 p-6 rounded-[2.5rem] flex justify-between items-center mb-10 shadow-2xl border-b-8 border-amber-500">
                                    <h2 className="text-white font-black text-lg md:text-3xl uppercase laos-italic laos-gradient-text tracking-tighter">GÜNLÜK GİRİŞLER</h2>
                                    <button onClick={() => pRef('dailyLogs').add({ date: new Date().toISOString().split('T')[0], cash: 0, card: 0, dailyLoan: 0 })} className="bg-amber-500 text-slate-950 px-6 py-3 rounded-2xl font-black text-[10px] uppercase laos-italic shadow-lg active:scale-95 transition-all">YENİ GÜN</button>
                                </div>
                                {dailyLogs.sort((a,b) => new Date(b.date) - new Date(a.date)).map(log => (
                                    <div key={log.id} className="white-card p-6 md:p-10 border border-slate-100 shadow-sm space-y-8 animate-up">
                                        <div className="flex justify-between items-center">
                                            <div className="bg-slate-950 px-4 py-2 rounded-xl text-amber-500 border border-white/10 shadow-xl"><DateInput value={log.date} onChange={(d) => pRef('dailyLogs').doc(log.id).update({ date: d })} /></div>
                                            <button onClick={() => setShowDeleteModal({show:true, col:'dailyLogs', id:log.id})} className="text-red-500 p-2.5 bg-red-50 rounded-xl font-black text-[10px] uppercase laos-italic">SİL</button>
                                        </div>
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="bg-slate-50 p-5 rounded-[2rem] border border-slate-100 text-center shadow-inner">
                                                <p className="text-[8px] font-black text-slate-400 mb-2 uppercase laos-italic tracking-widest">NAKİT SATIŞ</p>
                                                <MoneyInput value={log.cash} onChange={(v) => pRef('dailyLogs').doc(log.id).update({ cash: v })} className="w-full bg-transparent font-black text-sm md:text-3xl text-center laos-italic" />
                                            </div>
                                            <div className="bg-blue-50/50 p-5 rounded-[2rem] border border-blue-100 text-center shadow-inner">
                                                <p className="text-[8px] font-black text-blue-500 mb-2 uppercase laos-italic tracking-widest">POS SATIŞ</p>
                                                <MoneyInput value={log.card} onChange={(v) => pRef('dailyLogs').doc(log.id).update({ card: v })} className="w-full bg-transparent font-black text-sm md:text-3xl text-center text-blue-700 laos-italic" />
                                            </div>
                                        </div>
                                        <div className="bg-slate-950 p-6 rounded-[2rem] border border-slate-800 text-center shadow-2xl">
                                            <p className="text-[8px] font-black text-amber-500 mb-2 uppercase laos-italic tracking-widest">DIŞ KAYNAK / KREDİ GİRİŞİ</p>
                                            <MoneyInput value={log.dailyLoan || 0} onChange={(v) => pRef('dailyLogs').doc(log.id).update({ dailyLoan: v })} className="w-full bg-transparent p-0 border-none font-black text-xl md:text-5xl text-white laos-italic text-center tracking-tighter" />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'pos' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-up">

                            </div>
                        )}

                        {activeTab === 'reports' && (
                            <div className="max-w-6xl mx-auto space-y-10 animate-up pb-24">
                                <header className="flex flex-col md:flex-row justify-between items-center gap-6">
                                    <div className="flex items-center gap-4"><div className="w-2 h-10 bg-amber-500 rounded-full shadow-lg shadow-amber-500/30"></div><h2 className="text-2xl md:text-4xl font-black tracking-tighter uppercase laos-italic text-slate-900">STRATEJİK ANALİZ</h2></div>
                                    <div className="flex bg-slate-950 p-2 rounded-[2rem] border border-slate-800 shadow-2xl">
                                        {['daily', 'monthly', 'custom'].map(r => (
                                            <button key={r} onClick={() => setReportRange(r)} className={`px-8 py-3.5 rounded-full text-[9px] font-black uppercase transition-all laos-italic ${reportRange === r ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20' : 'text-slate-500'}`}>{r === 'daily' ? 'BUGÜN' : r === 'monthly' ? 'BU AY' : 'ÖZEL'}</button>
                                        ))}
                                    </div>
                                </header>
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-6">
                                    <div className="white-card p-8 border-l-[10px] border-emerald-500 shadow-sm"><p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 laos-italic">HASILAT</p><p className="text-sm md:text-3xl font-black tracking-tighter laos-italic">{formatCurrency(reportAnalysis.income)}</p></div>
                                    <div className="white-card p-8 border-l-[10px] border-red-500 shadow-sm"><p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 laos-italic">GİDER</p><p className="text-sm md:text-3xl font-black text-red-600 tracking-tighter laos-italic">{formatCurrency(reportAnalysis.totalEx)}</p></div>
                                    <div className="premium-dark p-8 text-white shadow-2xl border-b-8 border-amber-500"><p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 laos-italic">NET KÂR</p><p className={`text-sm md:text-3xl font-black tracking-tighter laos-italic ${reportAnalysis.profit >= 0 ? 'text-amber-500' : 'text-red-400'}`}>{formatCurrency(reportAnalysis.profit)}</p></div>
                                    <div className="white-card p-8 border-l-[10px] border-blue-500 shadow-sm"><p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 laos-italic">KÂR MARJI (%)</p><p className="text-sm md:text-3xl font-black text-blue-600 tracking-tighter laos-italic">%{reportAnalysis.margin.toFixed(1)}</p></div>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                    <div className="white-card p-10 shadow-sm space-y-10">
                                        <h3 className="text-xs md:text-2xl font-black uppercase laos-italic tracking-[0.2em] border-b pb-8 text-slate-800">GİDER ANALİZİ</h3>
                                        <div className="space-y-10">
                                            {[
                                                { l: 'Maaş', val: reportAnalysis.staffEx, c: 'bg-amber-500' },
                                                { l: 'POS/Banka', val: reportAnalysis.posEx, c: 'bg-blue-500' },
                                                { l: 'Diğer', val: reportAnalysis.totalEx - (reportAnalysis.staffEx + reportAnalysis.posEx), c: 'bg-slate-300' }
                                            ].map((item, i) => {
                                                const ratio = (item.val / (reportAnalysis.totalEx || 1)) * 100;
                                                return (
                                                    <div key={i}>
                                                        <div className="flex justify-between text-[10px] font-black uppercase text-slate-500 mb-4 laos-italic"><span>{item.l}</span><span>%{ratio.toFixed(0)}</span></div>
                                                        <div className="w-full h-4 bg-slate-50 rounded-full border shadow-inner overflow-hidden"><div className={`h-full ${item.c} shadow-lg shadow-black/10`} style={{width: `${ratio}%`}}></div></div>
                                                        <p className="text-right text-[10px] font-black mt-3 laos-italic text-slate-900">{formatCurrency(item.val)}</p>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 p-10 rounded-[3rem] text-white shadow-2xl border border-white/5 flex flex-col justify-between">
                                        <div>
                                            <h3 className="text-xs md:text-2xl font-black text-amber-500 uppercase laos-italic mb-12 tracking-[0.2em] laos-gradient-text">STRATEJİK YÖNETİCİ NOTLARI</h3>
                                            <div className="space-y-8 relative z-10">
                                                <div className="bg-white/5 p-8 rounded-[2rem] border border-white/5 backdrop-blur-xl">
                                                    <p className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest laos-italic">İŞGÜCÜ VERİMLİLİĞİ</p>
                                                    <p className="text-xs md:text-lg font-bold laos-italic leading-relaxed text-slate-200">Maaş giderleri cironun %{((reportAnalysis.staffEx / (reportAnalysis.income || 1)) * 100).toFixed(1)} seviyesinde.</p>
                                                </div>
                                                <div className="bg-white/5 p-8 rounded-[2rem] border border-white/5 backdrop-blur-xl">
                                                    <p className="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest laos-italic">LİKİDİTE DURUMU</p>
                                                    <p className="text-xs md:text-lg font-bold laos-italic leading-relaxed text-slate-200">Kâr marjı operasyonel sürdürülebilirlik sınırları içerisinde.</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="mt-14 pt-10 border-t border-white/5 flex items-center justify-between text-[9px] font-black text-slate-400 uppercase tracking-[0.6em] laos-italic">
                                            <p>LAOS FINANS ANALİZ SİSTEMLERİ</p>
                                            <span className="text-amber-500 text-xl animate-pulse font-black laos-italic">L</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* STATUS BAR */}
                    <div className="fixed top-4 right-4 z-[1001] md:top-8 md:right-8">
                        <div className="px-5 py-2.5 rounded-full bg-slate-950/95 backdrop-blur-2xl shadow-2xl border border-white/10 flex items-center gap-3 text-white">
                            <div className="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-[0_0_15px_#f59e0b] animate-pulse"></div>
                            <span className="text-[9px] font-black text-amber-500 uppercase tracking-[0.3em] laos-italic">LAOS CONNECTED</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
