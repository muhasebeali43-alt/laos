<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafe Analiz - Laos Pro</title>
    <!-- Kütüphaneler -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (v11+) -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; margin: 0; overflow-x: hidden; }
        .laos-gradient-text {
            background: linear-gradient(to right, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .animate-up { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .white-card { background: white; border-radius: 2rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .premium-dark { background: #020617; border-bottom: 8px solid #f59e0b; border-radius: 2.5rem; }
        .laos-italic { font-style: italic; }
        .setup-screen { background: #020617; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- KONFİGÜRASYON ---
        const getFirebaseConfig = () => {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                return JSON.parse(__firebase_config);
            }
            return {
                apiKey: "", // ÖNEMLİ: Firebase Console -> Proje Ayarları kısmından doldurun
                authDomain: "laos-61380.firebaseapp.com",
                projectId: "laos-61380",
                storageBucket: "laos-61380.appspot.com",
                messagingSenderId: "833439553703",
                appId: "" // ÖNEMLİ: Firebase Console -> Proje Ayarları kısmından doldurun
            };
        };

        const firebaseConfig = getFirebaseConfig();
        const appId = typeof __app_id !== 'undefined' ? __app_id : "cafe-pro-v1";

        // Firebase Başlatma (Bileşen dışında başlatılmalı)
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const isFirebaseValid = !!(firebaseConfig.apiKey && firebaseConfig.appId);

        // --- YARDIMCI FONKSİYONLAR ---
        const toNum = (v) => {
            if (!v) return 0;
            if (typeof v === 'number') return Math.floor(v);
            const clean = String(v).replace(/\./g, '').replace(/,/g, '');
            return parseInt(clean, 10) || 0;
        };
        const formatCurrency = (v) => new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 0 }).format(toNum(v));
        const formatNumber = (val) => new Intl.NumberFormat('tr-TR').format(toNum(val));
        const dbToDisplay = (iso) => iso ? iso.split('-').reverse().join('.') : "";

        // --- BİLEŞENLER ---
        const MoneyInput = ({ value, onChange, className = "", placeholder = "0" }) => {
            const [local, setLocal] = useState(formatNumber(value));
            const isFocused = useRef(false);
            useEffect(() => { if (!isFocused.current) setLocal(formatNumber(value)); }, [value]);
            return (
                <input type="text" inputMode="numeric" value={local === "0" && placeholder !== "0" ? "" : local} 
                    onFocus={() => isFocused.current = true}
                    onBlur={() => { isFocused.current = false; onChange(toNum(local)); }}
                    onChange={(e) => setLocal(formatNumber(e.target.value.replace(/[^0-9]/g, '')))}
                    placeholder={placeholder}
                    className={`focus:ring-2 focus:ring-amber-500 outline-none rounded-lg ${className}`}
                />
            );
        };

        const DateInput = ({ value, onChange, className = "" }) => (
            <div className="flex items-center gap-1">
                <span className="text-amber-500 text-[10px]">📅</span>
                <input type="date" value={value || ""} onChange={(e) => onChange(e.target.value)} 
                    className={`bg-transparent border-none font-black text-slate-700 focus:ring-0 cursor-pointer outline-none text-[10px] p-0 laos-italic ${className}`} />
            </div>
        );

        const MethodSelector = ({ value, onChange, className = "" }) => (
            <select value={value || 'nakit'} onChange={(e) => onChange(e.target.value)} 
                className={`bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[9px] font-bold uppercase text-slate-700 focus:ring-1 focus:ring-amber-500 outline-none laos-italic ${className}`}>
                <option value="nakit">Nakit</option><option value="kart">Kart</option><option value="havale">Havale</option><option value="cek">Çek</option>
            </select>
        );

        // --- ANA UYGULAMA ---
        function App() {
            const [demoMode, setDemoMode] = useState(false);
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [recipeSubTab, setRecipeSubTab] = useState('inventory');
            const [loading, setLoading] = useState(true);
            const [settings, setSettings] = useState({ initialBalance: 15000, defaultCommission: 3.5, defaultValor: 30 });
            const [dailyLogs, setDailyLogs] = useState([]);
            const [scheduledPayments, setScheduledPayments] = useState([]);
            const [personnel, setPersonnel] = useState([]);
            const [personnelPayments, setPersonnelPayments] = useState([]);
            const [inventory, setInventory] = useState([]);
            const [products, setProducts] = useState([]);
            const [selectedPersonnelId, setSelectedPersonnelId] = useState(null);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [showDeleteModal, setShowDeleteModal] = useState({ show: false, col: '', id: '' });
            const [reportRange, setReportRange] = useState('monthly');

            // --- FİRESTORE YOLLARI ---
            const pRef = (col) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(col);
            const sDoc = () => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('config').doc('app_settings');

            // 1. Yetkilendirme Effect
            useEffect(() => {
                if (!isFirebaseValid) {
                    setLoading(false);
                    return;
                }

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else if (!auth.currentUser) {
                            await auth.signInAnonymously();
                        }
                    } catch (e) { console.error("Giriş Hatası:", e); }
                };

                initAuth();
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            // 2. Veri Çekme Effect (User varsa çalışır)
            useEffect(() => {
                if (!user || !isFirebaseValid) return;

                const errorCallback = (err) => console.error("Firestore Hatası:", err);

                const unsub = [
                    sDoc().onSnapshot(d => d.exists && setSettings(d.data()), errorCallback),
                    pRef('dailyLogs').onSnapshot(s => setDailyLogs(s.docs.map(d => ({id: d.id, ...d.data()}))), errorCallback),
                    pRef('scheduledPayments').onSnapshot(s => setScheduledPayments(s.docs.map(d => ({id: d.id, ...d.data()}))), errorCallback),
                    pRef('personnel').onSnapshot(s => setPersonnel(s.docs.map(d => ({id: d.id, ...d.data()}))), errorCallback),
                    pRef('personnelPayments').onSnapshot(s => setPersonnelPayments(s.docs.map(d => ({id: d.id, ...d.data()}))), errorCallback),
                    pRef('inventory').onSnapshot(s => setInventory(s.docs.map(d => ({id: d.id, ...d.data()}))), errorCallback),
                    pRef('products').onSnapshot(s => setProducts(s.docs.map(d => ({id: d.id, ...d.data()}))), errorCallback),
                ];
                setLoading(false);
                return () => unsub.forEach(u => u());
            }, [user]);

            // --- HESAPLAMALAR ---
            const totals = useMemo(() => dailyLogs.reduce((acc, log) => ({
                cash: acc.cash + toNum(log.cash),
                card: acc.card + toNum(log.card),
                loan: acc.loan + toNum(log.dailyLoan),
                comm: acc.comm + (toNum(log.card) * toNum(settings.defaultCommission) / 100)
            }), { cash: 0, card: 0, loan: 0, comm: 0 }), [dailyLogs, settings]);

            const billsPaid = useMemo(() => scheduledPayments.filter(p => p.status === 'paid').reduce((s, p) => s + toNum(p.amount), 0), [scheduledPayments]);
            const staffPaid = useMemo(() => personnelPayments.reduce((s, p) => s + toNum(p.amount), 0), [personnelPayments]);
            const netCash = toNum(settings.initialBalance) + totals.cash + totals.card + totals.loan - (billsPaid + staffPaid + totals.comm);
            
            const upcomingPayments = useMemo(() => scheduledPayments.filter(p => p.status !== 'paid').sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0, 3), [scheduledPayments]);

            const posSettlements = useMemo(() => {
                const valor = toNum(settings.defaultValor);
                return dailyLogs.filter(l => toNum(l.card) > 0).map(l => {
                    const d = new Date(l.date); d.setDate(d.getDate() + valor);
                    return { id: l.id, date: l.date, settle: d, net: toNum(l.card) * (1 - (toNum(settings.defaultCommission)/100)) };
                }).sort((a,b) => a.settle - b.settle);
            }, [dailyLogs, settings]);

            const calculateCost = (prod) => (prod.ingredients || []).reduce((t, ing) => {
                const inv = inventory.find(i => i.id === ing.id);
                if (!inv) return t;
                const factor = (inv.unit === 'kg' || inv.unit === 'L') ? 1000 : 1;
                return t + (toNum(inv.price) / factor) * toNum(ing.amount);
            }, 0);

            const confirmDelete = async () => {
                if (isFirebaseValid && user) await pRef(showDeleteModal.col).doc(showDeleteModal.id).delete();
                setShowDeleteModal({ show: false, col: '', id: '' });
            };

            if (!isFirebaseValid && !demoMode) {
                return (
                    <div className="setup-screen">
                        <div className="white-card p-10 max-w-md w-full text-center space-y-6 shadow-2xl animate-up">
                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-3xl">🔑</div>
                            <h2 className="text-xl font-black text-slate-900 uppercase laos-italic">Bağlantı Bekleniyor</h2>
                            <p className="text-slate-500 text-xs leading-relaxed laos-italic">
                                Firebase projeniz hazır ancak <b>apiKey</b> ve <b>appId</b> eksik olduğu için veritabanına bağlanılamıyor.
                            </p>
                            <button onClick={() => setDemoMode(true)} className="w-full bg-slate-900 text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest laos-italic shadow-xl">Uygulamayı Önizle (Demo)</button>
                            <p className="text-[8px] text-slate-400 font-bold uppercase tracking-widest laos-italic">LAOS PRO SİSTEM KONTROLÜ</p>
                        </div>
                    </div>
                );
            }

            if (loading && !demoMode) return <div className="h-screen bg-slate-950 flex items-center justify-center text-amber-500 font-black animate-pulse text-[10px] uppercase laos-italic">Laos Connect...</div>;

            return (
                <div className="min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 bg-[#F8FAFC]">
                    
                    {/* MODAL & STATUS */}
                    {showDeleteModal.show && (
                        <div className="fixed inset-0 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm z-[2000]">
                            <div className="bg-white rounded-[2.5rem] p-8 max-w-xs w-full shadow-2xl animate-up text-center">
                                <h3 className="text-xs font-black text-slate-900 mb-6 uppercase laos-italic italic">Bu kayıt silinsin mi?</h3>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowDeleteModal({show:false})} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-500 font-black text-[9px] uppercase laos-italic">Vazgeç</button>
                                    <button onClick={confirmDelete} className="flex-1 py-3 rounded-xl bg-red-500 text-white font-black text-[9px] uppercase laos-italic">Sil</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* NAVİGASYON */}
                    <nav className="fixed bottom-0 left-0 right-0 md:relative md:w-20 lg:w-64 bg-slate-950 text-white p-2 md:p-4 flex md:flex-col justify-around md:justify-start gap-1 z-50">
                        <div className="hidden md:flex items-center gap-3 mb-10 px-2">
                            <div className="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center text-slate-950 font-black laos-italic text-xs italic">L</div>
                            <h2 className="hidden lg:block font-black text-sm laos-italic uppercase text-amber-500 italic">Kafe Analiz</h2>
                        </div>
                        {[
                            {id:'dashboard', i:'📊', l:'Özet'}, {id:'daily', i:'📅', l:'Günlük'}, {id:'pos', i:'💳', l:'POS'},
                            {id:'personnel', i:'👥', l:'Ekip'}, {id:'payments', i:'🧾', l:'Borçlar'}, {id:'recipes', i:'📋', l:'Reçete'}, {id:'reports', i:'📈', l:'Analiz'}
                        ].map(t => (
                            <button key={t.id} onClick={() => {setActiveTab(t.id); setSelectedPersonnelId(null); setSelectedProductId(null);}} 
                                className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2.5 rounded-xl transition-all flex-1 md:flex-none ${activeTab === t.id ? 'bg-amber-500 text-slate-950 font-black shadow-lg shadow-amber-500/20' : 'text-slate-500 hover:text-slate-200'}`}>
                                <span className="text-base">{t.i}</span> 
                                <span className="text-[7px] lg:text-[10px] font-black uppercase tracking-tight text-center lg:text-left laos-italic italic">{t.l}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-3 md:p-10 lg:p-14 overflow-y-auto no-scrollbar">
                        
                        {activeTab === 'dashboard' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-up">
                                <div className="premium-dark p-6 md:p-12 text-white shadow-2xl relative overflow-hidden">
                                    <p className="text-[9px] font-bold text-slate-500 uppercase mb-2 tracking-[0.3em] laos-italic italic">💰 Mevcut Nakit Gücü</p>
                                    <h2 className="text-3xl md:text-6xl font-black text-amber-500 tracking-tighter mb-10 laos-italic italic">{formatCurrency(netCash)}</h2>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6 border-t border-white/5 pt-8">
                                        <div><p className="text-[8px] text-slate-400 font-black uppercase mb-1 laos-italic italic">Ciro</p><p className="font-black text-xs md:text-xl laos-italic italic">{formatCurrency(totals.cash + totals.card)}</p></div>
                                        <div><p className="text-[8px] text-slate-400 font-black uppercase mb-1 laos-italic italic">Giderler</p><p className="font-black text-xs md:text-xl text-red-400 laos-italic italic">{formatCurrency(staffPaid + billsPaid + totals.comm)}</p></div>
                                        <div><p className="text-[8px] text-slate-400 font-black uppercase mb-1 laos-italic italic">Kredi</p><p className="font-black text-xs md:text-xl text-blue-400 laos-italic italic">{formatCurrency(totals.loan)}</p></div>
                                        <div><p className="text-[8px] text-slate-400 font-black uppercase mb-1 laos-italic italic">Başlangıç</p><p className="font-black text-xs md:text-xl text-slate-500 laos-italic italic">{formatCurrency(settings.initialBalance)}</p></div>
                                    </div>
                                </div>
                                <div className="white-card p-6 border-l-8 border-red-500 shadow-sm space-y-4">
                                    <h3 className="text-xs font-black text-slate-800 uppercase laos-italic italic">🔔 Yaklaşan Ödemeler</h3>
                                    {upcomingPayments.map(p => (
                                        <div key={p.id} className="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border">
                                            <div className="flex items-center gap-3"><div className="bg-white px-2 py-1 rounded text-[9px] font-black text-red-600 border italic">{dbToDisplay(p.date)}</div><p className="font-black text-[10px] md:text-sm uppercase italic">{p.label}</p></div>
                                            <p className="text-xs md:text-lg font-black text-red-600 italic">{formatCurrency(p.amount)}</p>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-slate-950 p-6 rounded-3xl border border-slate-800">
                                    <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1 laos-italic italic">Kasa Başlangıç Bakiyesi</p>
                                    <MoneyInput value={settings.initialBalance} onChange={(v) => isFirebaseValid && user ? sDoc().set({ initialBalance: v }, { merge: true }) : setSettings(s => ({...s, initialBalance: v}))} className="text-2xl md:text-4xl font-black bg-transparent w-full text-amber-500 laos-italic italic" />
                                </div>
                            </div>
                        )}

                        {activeTab === 'daily' && (
                            <div className="max-w-4xl mx-auto space-y-4 animate-up">
                                <div className="bg-slate-950 p-6 rounded-[2.5rem] flex justify-between items-center mb-10 shadow-2xl border-b-8 border-amber-500">
                                    <h2 className="text-white font-black text-lg md:text-3xl uppercase laos-italic laos-gradient-text tracking-tighter italic">GÜNLÜK GİRİŞLER</h2>
                                    <button onClick={() => isFirebaseValid && user ? pRef('dailyLogs').add({ date: new Date().toISOString().split('T')[0], cash: 0, card: 0, dailyLoan: 0 }) : setDailyLogs(d => [...d, {id:Date.now(), date: new Date().toISOString().split('T')[0], cash: 0, card: 0, dailyLoan: 0}])} className="bg-amber-500 text-slate-950 px-6 py-3 rounded-2xl font-black text-[10px] uppercase laos-italic italic shadow-lg">YENİ GÜN</button>
                                </div>
                                {dailyLogs.sort((a,b) => new Date(b.date) - new Date(a.date)).map(log => (
                                    <div key={log.id} className="white-card p-6 md:p-10 space-y-8 animate-up">
                                        <div className="flex justify-between items-center">
                                            <div className="bg-slate-950 px-4 py-2 rounded-xl text-amber-500 border border-white/10 shadow-xl"><DateInput value={log.date} onChange={(d) => isFirebaseValid && user ? pRef('dailyLogs').doc(log.id).update({ date: d }) : setDailyLogs(dl => dl.map(x => x.id === log.id ? {...x, date: d} : x))} /></div>
                                            <button onClick={() => setShowDeleteModal({show:true, col:'dailyLogs', id:log.id})} className="text-red-500 p-2.5 bg-red-50 rounded-xl font-black text-[10px] uppercase laos-italic">SİL</button>
                                        </div>
                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="bg-slate-50 p-5 rounded-[2rem] border text-center shadow-inner"><p className="text-[8px] font-black text-slate-400 mb-2 uppercase laos-italic italic">NAKİT SATIŞ</p><MoneyInput value={log.cash} onChange={(v) => isFirebaseValid && user ? pRef('dailyLogs').doc(log.id).update({ cash: v }) : setDailyLogs(dl => dl.map(x => x.id === log.id ? {...x, cash: v} : x))} className="w-full bg-transparent font-black text-sm md:text-3xl text-center laos-italic italic" /></div>
                                            <div className="bg-blue-50/50 p-5 rounded-[2rem] border border-blue-100 text-center shadow-inner"><p className="text-[8px] font-black text-blue-500 mb-2 uppercase laos-italic italic">POS SATIŞ</p><MoneyInput value={log.card} onChange={(v) => isFirebaseValid && user ? pRef('dailyLogs').doc(log.id).update({ card: v }) : setDailyLogs(dl => dl.map(x => x.id === log.id ? {...x, card: v} : x))} className="w-full bg-transparent font-black text-sm md:text-3xl text-center text-blue-700 laos-italic italic" /></div>
                                        </div>
                                        <div className="bg-slate-950 p-6 rounded-[2rem] border border-slate-800 text-center shadow-2xl"><p className="text-[8px] font-black text-amber-500 mb-2 uppercase laos-italic italic">DIŞ KAYNAK / KREDİ GİRİŞİ</p><MoneyInput value={log.dailyLoan || 0} onChange={(v) => isFirebaseValid && user ? pRef('dailyLogs').doc(log.id).update({ dailyLoan: v }) : setDailyLogs(dl => dl.map(x => x.id === log.id ? {...x, dailyLoan: v} : x))} className="w-full bg-transparent font-black text-xl md:text-5xl text-white laos-italic text-center italic tracking-tighter" /></div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'pos' && (
                            <div className="max-w-4xl mx-auto space-y-6 animate-up">
                                <header className="bg-slate-950 p-6 rounded-[2.5rem] border-b-8 border-amber-500 flex flex-col md:flex-row justify-between items-center gap-6 shadow-2xl">
                                    <h2 className="text-white font-black text-lg md:text-3xl uppercase laos-italic laos-gradient-text tracking-tighter italic">BANKA & POS</h2>
                                    <div className="bg-white/5 border border-white/10 px-8 py-4 rounded-3xl text-center shadow-inner">
                                        <p className="text-[8px] font-black text-slate-500 uppercase laos-italic mb-1 italic">TOPLAM BEKLEYEN</p>
                                        <p className="text-xl md:text-4xl font-black text-amber-500 laos-italic italic">{formatCurrency(totals.card - totals.comm)}</p>
                                    </div>
                                </header>
                                <div className="grid grid-cols-2 gap-6">
                                    <div className="white-card p-8 border-l-[10px] border-amber-500 text-center shadow-sm"><p className="text-[9px] font-black text-slate-400 uppercase laos-italic mb-2 italic">KOMİSYON (%)</p><input type="number" step="0.1" value={settings.defaultCommission} onChange={(e) => isFirebaseValid && user ? sDoc().set({ defaultCommission: Number(e.target.value) }, { merge: true }) : setSettings(s => ({...s, defaultCommission: Number(e.target.value)}))} className="text-lg md:text-4xl font-black bg-transparent w-full text-center laos-italic italic outline-none" /></div>
                                    <div className="white-card p-8 border-l-[10px] border-slate-900 text-center shadow-sm"><p className="text-[9px] font-black text-slate-400 uppercase laos-italic mb-2 italic">VALÖR GÜNÜ</p><input type="number" value={settings.defaultValor} onChange={(e) => isFirebaseValid && user ? sDoc().set({ defaultValor: Number(e.target.value) }, { merge: true }) : setSettings(s => ({...s, defaultValor: Number(e.target.value)}))} className="text-lg md:text-4xl font-black bg-transparent w-full text-center laos-italic italic outline-none" /></div>
                                </div>
                                <div className="space-y-3 mt-10">
                                    <h3 className="text-xs font-black uppercase text-slate-500 laos-italic italic mb-4 tracking-widest">🗓️ TAHSİLAT TAKVİMİ</h3>

                                <div className="bg-slate-900 p-10 rounded-[3rem] text-white shadow-2xl flex flex-col md:flex-row gap-12 items-center"><div className="flex-1 space-y-8"><h3 className="text-xs md:text-2xl font-black text-amber-500 uppercase laos-italic italic tracking-widest">YÖNETİCİ ÖZETİ</h3><p className="text-xs md:text-lg font-bold laos-italic italic text-slate-200 leading-relaxed">İşletmenizin şu anki net nakit gücü {formatCurrency(netCash)} seviyesindedir. Toplam cironuzun {formatCurrency(totals.comm)} kadarı banka komisyonlarına gitmektedir.</p></div><div className="w-48 h-48 rounded-full border-8 border-amber-500 flex flex-col items-center justify-center italic font-black text-amber-500 uppercase text-xs tracking-widest text-center">LAOS<br/>STRATEJİ<br/>EKİBİ</div></div>
                            </div>
                        )}
                    </main>

                    {/* STATUS BAR */}
                    <div className="fixed top-4 right-4 z-[1001] md:top-8 md:right-8">
                        <div className="px-5 py-2.5 rounded-full bg-slate-950/95 backdrop-blur-2xl shadow-2xl border border-white/10 flex items-center gap-3 text-white">
                            <div className={`w-2.5 h-2.5 rounded-full shadow-[0_0_15px] animate-pulse ${isFirebaseValid ? 'bg-amber-500 shadow-amber-500' : 'bg-red-500 shadow-red-500'}`}></div>
                            <span className="text-[9px] font-black text-amber-500 uppercase tracking-[0.3em] laos-italic italic">{isFirebaseValid && user ? 'LAOS CONNECTED' : 'DEMO MODE'}</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
